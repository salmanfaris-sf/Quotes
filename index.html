<!DOCTYPE html>
<html lang="en" class="h-full bg-black">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P37159WTH1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-P37159WTH1');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>salmanfaris.com</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description" content="Forge an unbreakable mind. Be a man of your word. Don't waste time. Stay disciplined. Stay focused. This is the way.">
    
    <!-- Pure Black Address Bar & Status Bar Controls -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="msapplication-navbutton-color" content="#000000">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --text: #f5f5f7;
            --apple-muted: #86868b;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .bottom-hint-pos {
            bottom: calc(0.9rem + env(safe-area-inset-bottom, 0px));
        }

        /* Borderless Status Toast Popup */
        #_ap_status_ {
            position: fixed;
            top: calc(1.5rem + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translate(-50%, -10px);
            font-size: 12px;
            background: rgba(30, 30, 35, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #e5e5e7;
            padding: 7px 18px;
            border-radius: 9999px;
            font-weight: 400;
            letter-spacing: 0.02em;
            pointer-events: none;
            opacity: 0;
            z-index: 60;
            white-space: nowrap;
            transition: opacity 0.35s ease, transform 0.35s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        #_ap_status_.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        ._f1 {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        ._f1.v {
            opacity: 1;
        }

        ._c1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 680px;
            width: calc(100% - 48px);
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform, opacity;
        }

        #_q_ {
            font-family: 'Inter', sans-serif;
            white-space: pre-wrap;
            margin-bottom: 16px;
            color: #ffffff;
            display: inline-block;
            will-change: opacity;
            transition: opacity 0.35s ease-in-out;
            font-weight: 300;
            letter-spacing: -0.01em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            font-size: clamp(1.125rem, 3.5vw, 1.875rem);
            line-height: 1.5;
        }

        #_st_ {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--apple-muted);
            font-weight: 400;
            letter-spacing: 0.02em;
            transition: opacity 0.35s ease;
            line-height: 1.6;
        }
    </style>
</head>
<body class="relative flex flex-col h-full overflow-hidden bg-black text-white">

    <!-- Status Toast Notification -->
    <div id="_ap_status_"></div>

    <!-- Main Content Display -->
    <main class="_c1 _f1" id="_mc_">
        <h1 id="_q_" class="opacity-0"></h1>
        <div id="_st_" class="opacity-0"></div>
    </main>

    <!-- Tap Hint at Bottom -->
    <div id="tap-hint" class="bottom-hint-pos fixed left-1/2 -translate-x-1/2 text-[12px] font-normal tracking-wide text-[#86868b] pointer-events-none transition-opacity duration-1000 opacity-0 text-center whitespace-nowrap z-30">
        Tap anywhere to view the next quote
    </div>

    <script>
    (function(){
        const _db = [
            { t: "Be better than you were yesterday." },
            { t: "Race one another in good deeds." },
            { t: "Don't waste time. You don't get it back." },
            { t: "Focus." },
            { t: "Be relentless." },
            { t: "Win the day." },
            { t: "No shortcuts." },
            { t: "The problem is,\nyou think you have a lot of time to live." },
            { t: "Live everyday like it's your last day." },
            { t: "Consistency." },
            { t: "Big dreams need big sacrifices." },
            { t: "Practice makes perfect." },
            { t: "Do it even when you don't feel like it." },
            { t: "Nothing changes if nothing changes." },
            { t: "Stay different." },
            { t: "You only have 1,440 minutes every day,\ndon't let a single one go to waste.", id: "t_q" },
            { t: "You can't have a million dollar dream with a minimum wage work ethic." },
            { t: "A real man protects and provides." },
            { t: "Don't follow the crowd. Follow the truth." },
            { t: "Never build your happiness on\n someone else's tears." },
            { t: "Eliminate the 'tomorrow' mindset today." },
            { t: "The strongest man is he who controls his anger." },
            { t: "Be a man of your word." },
            { t: "Your habits define your future self." },
            { t: "Hate Laziness." },
            { t: "Always speak the truth." },
            { t: "Time waits for no one." },
            { t: "Quality over quantity in everything." },
            { t: "Knowledge without action is useless." },
            { t: "Live with purpose." },
            { t: "A real man protects those who are vulnerable." },
            { t: "Every day is a second chance." },
            { t: "Now is the time." },
            { t: "Success is earned, not given." },
            { t: "Focus on your growth." },
            { t: "Stay Disciplined." },
            { t: "He who is brave is free." },
            { t: "Growth begins outside comfort zones." },
            { t: "This is the way." },
            { t: "Hard days make strong people." },
            { t: "Keep showing up." },
            { t: "Strength is built through repetition." },
            { t: "Be the change that you wish to see in the world." },
            { t: "Do the boring work well." },
            { t: "Consistency creates mastery." },
            { t: "Work now, Relax later." },
            { t: "Don't look back. You're not going that way."},
            { t: "Every day counts." },
            { t: "Habits decide outcomes." },
            { t: "Growth requires discomfort." },
            { t: "Sweat more in practice. Bleed less in war." },
            { t: "do it scared.\ndo it tired.\ndo it anyway." },
            { t: "When you feel like nothing is going your way, look at a person breaking a stone. They can hit a big rock 100 times and it won't even move. But on the 101st hit, it suddenly breaks into two pieces. It wasn't just that last hit that broke it,it was the result of all the hits that happened before it." },
            { t: "It always seems impossible until it's done." },
            { t: "Focus is a superpower in a distracted world." },
            { t: "Weakness leaves when discipline enters." },
            { t: "Strength is built through patience." },
            { t: "Be strict with yourself." },
            { t: "Zero Excuses." },
            { t: "You already know what to do.\nYou just don’t like the cost." },
            { t: "The brain will invent reasons to avoid pain, even when pain is the only path forward." },
            { t: "Every wasted year makes the\n next one heavier." },
            { t: "Do it the moment you remember it." },
            { t: "Stick to the plan. Not your mood." },
            { t: "5,4,3,2,1. Act Now." },
            { t: "There are two blessings that many people are deceived into losing: health and free time." },
            { t: "Make things easy for the people, and do not make it difficult for them." },
            { t: "Do good deeds properly, sincerely and moderately." },
            { t: "Speak good or remain silent." },
            { t: "Character is who you are when no one is watching." },
            { t: "Keep moving forward." },
            { t: "If not now, Then when?" },
            { t: "Leave a legacy. Let your life be a story of courage, action, and impact." },
            { t: "NOW.\nWaiting won’t help.\nOverthinking won’t help.\nAction will.\nDo it." },
            { t: "Your current life is the result of past actions. Your future will be the result of today's actions." },
            { t: "The man who keeps walking will eventually leave the place he hates." },
            { t: "A few years of sacrifice can create a lifetime of freedom." },
            { t: "Your future is built by what you do after a long tiring day." },
            { t: "Action may not always bring happiness, but there is no happiness without action." },
            { t: "Stand straight. Speak clearly. Fear none."},
            { t: "Weak men wait for courage.\n Strong men create it through action."},
            { t: "Be the man who acts while others are still thinking."},
            { t: "Be so disciplined that even your bad days look like progress."},
            { t: "A strong man doesn’t need motivation.\nHe acts because he decided."},
            { t: "Pressure reveals the man within."}
        ];

        let _wakeLock = null;
        let _hasTapped = false;
        let _l_i = null;
        let _currentPool = [];
        let _lastQuoteText = null;
        let _history = [];
        let _historyIndex = -1;

        // Autoplay & Long Press Variables
        let _autoplayTimer = null;
        let _longPressTimer = null;
        let _statusTimer = null;
        let _isLongPress = false;
        let _startX = 0;
        let _startY = 0;

        const _qx = document.getElementById('_q_');
        const _st = document.getElementById('_st_');
        const _mc = document.getElementById('_mc_');
        const _tapHint = document.getElementById('tap-hint');
        const _apStatus = document.getElementById('_ap_status_');

        async function _requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    _wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                await _requestWakeLock();
            }
        });

        function _showStatus(msg) {
            if (!_apStatus) return;
            if (_statusTimer) clearTimeout(_statusTimer);

            _apStatus.innerText = msg;
            _apStatus.classList.add('visible');

            _statusTimer = setTimeout(() => {
                _apStatus.classList.remove('visible');
            }, 2200);
        }

        function _shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function _getNextQuote() {
            if (_currentPool.length === 0) {
                let freshList = [..._db];
                _shuffle(freshList);
                if (freshList.length > 1 && freshList[freshList.length - 1].t === _lastQuoteText) {
                    const head = freshList.pop();
                    freshList.unshift(head);
                }
                _currentPool = freshList;
            }
            const choice = _currentPool.pop();
            if (choice) _lastQuoteText = choice.t;
            return choice || { t: "Stay Disciplined." };
        }

        function _gs() {
            const n = new Date();
            let h = n.getHours();
            const m = n.getMinutes().toString().padStart(2, '0');
            const a = h >= 12 ? 'pm' : 'am';
            h = h % 12 || 12;
            const e = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 23, 59, 59);
            const d = e - n;
            const ml = Math.floor(d / 60000);
            return { t: `${h}:${m} ${a}`, l: ml };
        }

        function _showQuote(nq) {
            _st.classList.add('opacity-0');
            if (_l_i) clearInterval(_l_i);

            _qx.style.transition = 'opacity 0.35s ease-in-out';
            _qx.style.opacity = '0';

            setTimeout(() => {
                _qx.innerText = nq.t;

                if (nq.id === "t_q") {
                    const ux = () => {
                        const s = _gs();
                        _st.innerHTML = `Time: ${s.t} • ${s.l} minutes remaining today`;
                    };
                    ux();
                    _st.classList.remove('opacity-0');
                    _l_i = setInterval(ux, 30000);
                } else {
                    _st.innerHTML = "";
                    _st.classList.add('opacity-0');
                }

                requestAnimationFrame(() => {
                    _qx.style.transition = 'opacity 0.35s ease-in-out';
                    _qx.style.opacity = '1';
                });
            }, 350);
        }

        function _hideTapHint() {
            if (!_hasTapped) {
                _hasTapped = true;
                if (_tapHint) {
                    _tapHint.classList.remove('opacity-90');
                    _tapHint.classList.add('opacity-0');
                    setTimeout(() => {
                        if (_tapHint && _tapHint.parentNode) {
                            _tapHint.parentNode.removeChild(_tapHint);
                        }
                    }, 1000);
                }
            }
        }

        function _startAutoplay() {
            if (_autoplayTimer) clearInterval(_autoplayTimer);
            _autoplayTimer = setInterval(() => {
                _next();
            }, 15000); // 15 seconds interval
        }

        function _stopAutoplay() {
            if (_autoplayTimer) {
                clearInterval(_autoplayTimer);
                _autoplayTimer = null;
            }
        }

        function _toggleAutoplay() {
            if (_autoplayTimer) {
                _stopAutoplay();
                _showStatus("Autoplay Off");
            } else {
                _next();
                _startAutoplay();
                _showStatus("Autoplay On (15s)");
            }
        }

        function _next() {
            _hideTapHint();
            if (_historyIndex < _history.length - 1) {
                _historyIndex++;
                _showQuote(_history[_historyIndex]);
            } else {
                const nq = _getNextQuote();
                _history.push(nq);
                _historyIndex = _history.length - 1;
                _showQuote(nq);
            }

            // Reset timer if autoplay is active
            if (_autoplayTimer) {
                _startAutoplay();
            }
        }

        function _prev() {
            _hideTapHint();
            if (_historyIndex > 0) {
                _historyIndex--;
                _showQuote(_history[_historyIndex]);
            }

            if (_autoplayTimer) {
                _startAutoplay();
            }
        }

        window.onload = () => {
            _requestWakeLock();

            const i = _getNextQuote();
            _history.push(i);
            _historyIndex = 0;
            
            _qx.innerText = i.t;
            _qx.style.opacity = '1';
            
            if (i.id === "t_q") {
                const s = _gs();
                _st.innerHTML = `Time: ${s.t} • ${s.l} minutes remaining today`;
                _st.classList.remove('opacity-0');
            }

            requestAnimationFrame(() => {
                _mc.classList.add('v');
            });

            setTimeout(() => {
                if (!_hasTapped && _tapHint) {
                    _tapHint.classList.remove('opacity-0');
                    _tapHint.classList.add('opacity-90');
                }
            }, 900);
        };

        // Long Press Gesture Handlers
        function _startPress(x, y) {
            _startX = x;
            _startY = y;
            _isLongPress = false;
            if (_longPressTimer) clearTimeout(_longPressTimer);

            _longPressTimer = setTimeout(() => {
                _isLongPress = true;
                if (navigator.vibrate) {
                    try { navigator.vibrate(50); } catch(e){}
                }
                _toggleAutoplay();
            }, 550);
        }

        function _movePress(x, y) {
            if (Math.abs(x - _startX) > 10 || Math.abs(y - _startY) > 10) {
                if (_longPressTimer) clearTimeout(_longPressTimer);
            }
        }

        function _endPress() {
            if (_longPressTimer) clearTimeout(_longPressTimer);
        }

        // Pointer / Touch / Mouse Events
        document.addEventListener('touchstart', (e) => {
            _requestWakeLock();
            _startPress(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            _movePress(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        document.addEventListener('touchend', _endPress, { passive: true });
        document.addEventListener('touchcancel', _endPress, { passive: true });

        document.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            _requestWakeLock();
            _startPress(e.clientX, e.clientY);
        });

        document.addEventListener('mousemove', (e) => {
            _movePress(e.clientX, e.clientY);
        });

        document.addEventListener('mouseup', _endPress);

        // Global Click Event (skips if triggered via long press)
        document.addEventListener('click', (e) => {
            _requestWakeLock();
            if (_isLongPress) {
                _isLongPress = false;
                return;
            }
            _next();
        });

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            _requestWakeLock();
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                _next();
            } else if (e.code === 'ArrowLeft') {
                _prev();
            }
        });

    })();
    </script>
</body>
</html>
