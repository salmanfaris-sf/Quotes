<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#050505">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1K1TKBQFFK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-1K1TKBQFFK');
</script>
<title>Salman Faris | Simple Wisdom</title>
<meta name="description" content="Personal thoughts of Salman Faris on hard work, focus, and life.">
<meta name="author" content="Salman Faris">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#050505',c2:'#C5A059',eye:'#B8B8B0'}
    }
  }
}
</script>
<style>
html { background-color: #050505; scroll-behavior: auto; }
body { margin: 0; background-color: #050505; color: #d1d1d1; font-smoothing: antialiased; width: 100%; position: relative; }
.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(5,5,5,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.z1{opacity:0;transform:translateY(40px);filter:blur(15px);transition:all 1.8s cubic-bezier(.16,1,.3,1)}
.z1.za{opacity:1;transform:translateY(0);filter:blur(0)}
.z2{position:fixed;top:50%;left:50%;width:100vw;height:100vw;background:radial-gradient(circle,rgba(255,255,255,.02) 0,transparent 60%);transform:translate(-50%,-50%);pointer-events:none;z-index:0}
.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}
.zs1{font-size:11px;letter-spacing:.8em;text-transform:uppercase;font-family:Inter,sans-serif;opacity:.4;color:#fff}
.zb{color:#C5A059;opacity:.9;text-shadow:0 0 30px rgba(197,160,89,.3)}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,.5)}
@keyframes flash{0%,100%{opacity:.1}50%{opacity:.7}}
.zf{animation:flash 2s ease-in-out infinite}
#sd{transition:opacity .5s ease,visibility .5s}
.hi{transition:color .6s ease,text-shadow .6s ease,opacity .6s ease;opacity:0.15;color:#B8B8B0;display:inline-block}
.hi.active{opacity:1 !important;color:#fff !important;text-shadow:0 0 15px rgba(255,255,255,0.4) !important}

.v-grid { display: flex; flex-direction: column; gap: 80px; width: 100%; max-width: 800px; margin: 0 auto; }
.v-wrap { width: 100%; background: #111; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: relative; cursor: pointer; transition: transform 0.4s ease; display: none; }
.v-wrap.visible { display: block; }
.v-wrap:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.15); }
video { width: 100%; height: auto; display: block; background: #000; }

.v-play-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 96px; height: 96px; background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  z-index: 10; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.v-play-btn svg { fill: white; width: 38px; height: 38px; transform: translateX(5px); }
.v-wrap.is-playing .v-play-btn { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(0.6); }
</style>
</head>
<body>
<div class="z2"></div>
<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <div id="d0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">DAY 000</div>
  <div id="t0" class="text-[10px] uppercase tracking-[0.4em] text-white/80 font-f2">LOADING...</div>
</nav>
<main class="relative w-full">
  <section class="h-screen flex flex-col items-center justify-center px-6 relative z-10">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <h1 id="h0" class="font-f1 text-9xl md:text-[16rem] italic tracking-tighter leading-tight md:leading-none z1" style="transition-delay:.2s"></h1>
    </div>
    <div id="sd" class="pb-40 md:pb-24 z1" style="transition-delay:.8s">
      <div class="zs1 zf">Scroll Down</div>
    </div>
  </section>

  <article id="m0" class="max-w-screen-2xl mx-auto px-6 pt-40 pb-20 relative z-10 space-y-72"></article>

  <section id="v-section" class="max-w-screen-2xl mx-auto px-6 py-40 relative z-10 flex flex-col items-center">
    <div class="z1 mb-16 text-center w-full">
       <h3 class="font-f2 text-[10px] uppercase tracking-[0.6em] text-white/40 mb-16">Reflections</h3>
       <div id="video-list" class="v-grid"></div>
    </div>
    <div class="z1 text-center py-20">
      <p class="font-f2 text-[12px] tracking-[0.8em] uppercase text-c2">Defeat Laziness. Conquer Yourself. Build the Future.</p>
    </div>
  </section>
</main>

<footer class="w-full flex justify-end px-12 py-12 relative z-10 z1">
  <div class="text-[10px] uppercase tracking-[0.6em] font-f2 text-white font-medium opacity-40">&mdash; BY SALMAN FARIS</div>
</footer>

<script>
(function(){
  const themes = ['Strong Mind', 'Deep Will', 'Full Focus', 'Never Stop', 'Great Aim'];
  const content = [
    ["Do not care what other people think. If you can control your mind, you can control your life. What people say does not last. Who you are inside lasts forever. Stand by what you believe. Always do the right thing.", "Your value comes from what you do, not how you look. The world does not care about your face. It cares about how strong you are. Stop looking for others to like you. If you are happy with yourself, nothing else matters.", "The best way to live is to have a goal. Without a goal, you are lost. With a goal, you are strong. Live with a clear plan. Try to find the truth. Do not wait for others to show you the way.", "Being lazy is your biggest enemy. It wants you to stay in bed. It wants you to be average. It wants you to waste time on your phone. Fight it. Wake up early. Start your work. A busy mind is a free mind.", "Do not be mad if your life is hard. Hard times make you better. Work hard to take care of your family. Use your quiet time to build your future. The world sees every step you take. Hard work always pays off."],
    ["Strength is saying no to things that feel good but are bad for you. Pick the hard path if it is the right path. If you can control yourself, you can win. The time to start is now. Real power is self-control.", "Doing the same good things every day is the way to win. If you do not control your habits, they will control you. If you win the morning, you win the day. Build your life around good actions. Being strong is a choice you make every day.", "Your time is the most important thing you have. When it is gone, you cannot get it back. Stop looking at things that do not matter. Stop waiting for help. Being lazy is a slow death. Be fast. Be clear. Every hour is a choice.", "Your word is a promise to yourself. Do not break it when you are tired. Wake up with a plan. Finish with a smile. The struggle is how you learn. Being great is not one act, it is what you do every day. Be the best you can be.", "Stop waiting for the world to get better. Make yourself better first. Be strong for your friends and family. Listen more than you speak. Your real value is measured by what you do for others."],
    ["Trust the process when you are not sure. Be thankful even when things are bad. You build your heart by working every day. Stop crying about the rain. Start building your house. You can do great things if you keep trying.", "Be kind because everyone is having a hard time. Kindness is a kind of strength. One good act can change a life. Do not let a hard world make you mean. Stay humble. Treat everyone with the same respect.", "The world looks at what you do, not what you say. People see that you do not give up. They see that you are focused. Do not be sad if you are slow. You move a mountain one stone at a time. Stand up and move.", "Real success is who you became, not what you bought. Help people who have less than you. Protect those who are weak. The strongest person is the one who beats their own bad habits. Try to be that person.", "Never forget where you came from. You came from the earth and you will go back to it. Use this to stay humble. Take care of the world. Build something that stays after you are gone."]
  ];

  const wrapWords = (text) => text.split(/\.\s*/).filter(s => s.trim().length > 0).map(s => `<span class="hi">${s.trim()}.</span> `).join("");

  const initVideos = () => {
    const list = document.getElementById('video-list');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("za"); });
    }, { threshold: 0.05 });

    for(let i=1; i<=200; i++) {
      const vWrap = document.createElement('div');
      vWrap.className = 'v-wrap v-container z1';
      vWrap.innerHTML = `
        <div class="v-play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <video controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false;" preload="metadata" playsinline loop>
          <source src="videos/${i}.mp4" type="video/mp4">
        </video>
      `;

      const video = vWrap.querySelector('video');
      video.onloadedmetadata = () => { vWrap.classList.add('visible'); observer.observe(vWrap); };
      video.onerror = () => vWrap.remove();

      vWrap.addEventListener('click', () => {
        if (video.paused) {
          document.querySelectorAll('video').forEach(v => {
            if(v !== video) { v.pause(); v.parentElement.classList.remove('is-playing'); }
          });
          video.play();
          vWrap.classList.add('is-playing');
        } else {
          video.pause();
          vWrap.classList.remove('is-playing');
        }
      });
      list.appendChild(vWrap);
    }
  };

  const init = () => {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start + (start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000;
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    
    document.getElementById("d0").textContent = `DAY ${String(dayOfYear).padStart(3, "0")}`;
    document.getElementById("h0").innerHTML = `The <span class="text-white not-italic">${themes[dayOfYear % 5]}</span>`;
    
    document.getElementById("m0").innerHTML = `
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(content[0][dayOfYear % content[0].length])}</p></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05]">${wrapWords(content[1][(dayOfYear + 2) % content[1].length])}</p></div>
      <div class="py-24 text-center z1"><h2 class="font-f1 text-8xl md:text-[12rem] italic zb">${themes[dayOfYear % 5].toUpperCase()}.</h2></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(content[2][(dayOfYear + 4) % content[2].length])}</p></div>
    `;

    initVideos();
    const generalObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("za"); });
    }, { threshold: 0.05 });
    document.querySelectorAll(".z1:not(.v-wrap)").forEach(el => generalObserver.observe(el));
  };

  const updateTime = () => {
    const n = new Date();
    document.getElementById("t0").textContent = `${n.toLocaleDateString("en-US",{month:"long"}).toUpperCase()} ${n.toLocaleDateString("en-US",{day:"2-digit"})} / ${n.getFullYear()}`;
  };

  window.addEventListener("scroll", () => {
    const scrollPos = window.scrollY || window.pageYOffset;
    const nav = document.getElementById("n0");
    const scrollHint = document.getElementById("sd");
    const vh = window.innerHeight;
    scrollPos > 10 ? nav.classList.add("zs") : nav.classList.remove("zs");
    if (scrollHint) { scrollHint.style.opacity = scrollPos > 20 ? "0" : "1"; }

    const spans = document.querySelectorAll(".hi");
    const centerY = vh * 0.5;
    let activeSpan = null;
    let minDistance = Infinity;
    spans.forEach(span => {
      const rect = span.getBoundingClientRect();
      const dist = Math.abs((rect.top + rect.height / 2) - centerY);
      if (dist < minDistance) { minDistance = dist; activeSpan = span; }
    });
    spans.forEach(span => {
      if (span === activeSpan && minDistance < vh * 0.4) span.classList.add("active");
      else span.classList.remove("active");
    });
  }, { passive: true });

  window.onload = () => {
    updateTime();
    init();
    setInterval(updateTime, 60000);
    setTimeout(() => { window.dispatchEvent(new Event('scroll')); }, 150);
  };
})();
</script>
</body>
</html>
