<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SALMANFARIS.COM</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --subtext: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            text-align: center;
            padding: 0 24px;
            max-width: 500px;
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 24px;
        }

        .divider {
            width: 32px;
            height: 1px;
            background-color: #333333;
            margin: 0 auto 24px auto;
        }

        .status {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--subtext);
            line-height: 1.8;
            margin-bottom: 16px;
        }

        .time-remaining {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: #555555;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">SALMANFARIS.COM</div>
        <div class="divider"></div>
        <div class="status">REDESIGN IN PROGRESS.<br>STAY DISCIPLINED.</div>
        <div class="time-remaining" id="time-el">--:-- -- • -- MINUTES REMAINING TODAY</div>
    </div>

    <script>
        function updateTime() {
            const n = new Date();
            let h = n.getHours();
            const m = n.getMinutes().toString().padStart(2, '0');
            const a = h >= 12 ? 'pm' : 'am';
            h = h % 12 || 12;
            const endOfDay = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 23, 59, 59);
            const remainingMinutes = Math.floor((endOfDay - n) / 60000);
            
            document.getElementById('time-el').innerText = `${h}:${m} ${a} • ${remainingMinutes} MINUTES REMAINING TODAY`;
        }

        updateTime();
        setInterval(updateTime, 30000);
    </script>
</body>
</html>
