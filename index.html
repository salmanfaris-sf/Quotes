<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#000000">
<title>Salman Faris | Daily Wisdom</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1K1TKBQFFK"></script>

<meta name="description" content="Simple thoughts on focus, family, standards, and building a good life.">
<meta name="author" content="Salman Faris">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#000000',c2:'#C5A059',eye:'#B8B8B0'}
    }
  }
}
</script>
<style>
html, body { 
  background-color: #000000; 
  scroll-behavior: auto; 
  overflow-x: hidden;
  width: 100%;
  position: relative;
  touch-action: pan-y; 
}

body { margin: 0; color: #d1d1d1; font-smoothing: antialiased; }

.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.z1{opacity:0;transform:translateY(40px);filter:blur(15px);transition:all 1.8s cubic-bezier(.16,1,.3,1)}
.z1.za{opacity:1;transform:translateY(0);filter:blur(0)}

.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}

.zs1{font-size:11px;letter-spacing:.8em;text-transform:uppercase;font-family:Inter,sans-serif;opacity:0.4;color:#fff}
.zb{color:#C5A059;opacity:0.9;text-shadow:0 0 30px rgba(197,160,89,0.3)}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,0.5)}
@keyframes flash{0%,100%{opacity:0.1}50%{opacity:0.7}}
.zf{animation:flash 2s ease-in-out infinite}
#sd{transition:opacity 0.5s ease,visibility 0.5s}

.hi{transition:color 0.6s ease,text-shadow 0.6s ease,opacity 0.6s ease;opacity:0.15;color:#B8B8B0;display:inline-block}
.hi.active{opacity:1 !important;color:#fff !important;text-shadow:0 0 15px rgba(255,255,255,0.4) !important}

.quote-container { width: 100%; max-width: 90vw; margin: 0 auto; text-align: center; }
.quote-line { font-family: 'Inter', sans-serif; font-size: clamp(12px, 3.8vw, 17px); font-weight: 400; line-height: 1.5; color: #ffffff; opacity: 0.9; margin: 0; }
.quote-stats { font-family: 'Inter', sans-serif; font-size: clamp(10px, 3vw, 14px); color: #ffffff; opacity: 0.5; margin-top: 10px; font-weight: 500; }

.quote-wrapper { padding-top: 100px; padding-bottom: 60px; }
footer { padding-top: 10px; padding-bottom: 40px; }
</style>
</head>
<body oncontextmenu="return false;">

<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <!-- Left: Month and Year (Clean crisp white) -->
  <div id="d0" class="text-white/90 text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">LOADING...</div>
  <!-- Right: Day of the Week (Classic dynamic gold accent color) -->
  <div id="t0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">LOADING...</div>
</nav>

<main class="relative w-full">
  <section class="h-screen flex flex-col items-center justify-center px-6 relative z-10">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <!-- Restored back to the original massive text-9xl md:text-[16rem] styling -->
      <h1 id="h0" class="font-f1 text-9xl md:text-[16rem] italic tracking-tighter leading-tight md:leading-none z1" style="transition-delay:0.2s"></h1>
    </div>
    <div id="sd" class="pb-40 md:pb-24 z1" style="transition-delay:0.8s">
      <div class="zs1 zf">Scroll Down</div>
    </div>
  </section>

  <article id="m0" class="max-w-screen-2xl mx-auto px-6 pt-40 pb-20 relative z-10 space-y-72"></article>

  <section class="relative z-10">
    <div class="z1 text-center px-6 quote-wrapper">
        <div class="quote-container border-t border-white/5 pt-16">
            <p class="quote-line">You only have 1,440 minutes every day,</p>
            <p class="quote-line">don't let a single one go to waste.</p>
            <p id="live-stats" class="quote-stats"></p>
        </div>
    </div>
  </section>
</main>

<footer class="w-full flex justify-center px-6 relative z-10 z1">
  <div class="text-[9px] uppercase tracking-[0.8em] font-f2 text-white font-medium opacity-30">BY SALMAN FARIS</div>
</footer>

<script>
(function(){
  // 15 Noble, self-improvement themes focusing on character, standards, family, and progress
  const themes = [
    'Pure Focus', 'Noble Paths', 'High Standards', 'Quiet Purpose', 'Steady Step',
    'Deep Respect', 'Kind Action', 'True Value', 'Good Works', 'Great Patience',
    'Real Growth', 'Clear Mind', 'Honest Labor', 'Strong Caring', 'Daily Duty'
  ];
  
  // 15 simplified text tracks dedicated to positive progress, focus, family, standards, and helpfulness
  const content = [
    [
      "You know what must be done today. Do not wait for a perfect mood to begin. The best way to feel happy is to start your work. Every small step you take helps you build a bright future. Focus on your own goals and do your best without waiting for praise.",
      "Time is a precious gift. You have one thousand four hundred and forty minutes today. If you spend them looking at screens or waiting, they are gone forever. Choose to move. Be the person who takes honest action and respects the gift of life.",
      "True strength is built when you choose simple work over easy comfort. Do not look for shortcuts. Build a clean foundation. When you do the quiet and patient work today, you can look back tomorrow with a peaceful mind."
    ],
    [
      "Nothing changes if you do not start. You cannot think your way to a better life without taking action. Your schedule shows your real goals, not your wishes. Choose to speak less and do more. Step away from distractions and focus on your path.",
      "Your ideas need gentle and steady work to grow. Do not wait for everything to be perfect. The best time to start is right now. Run toward the things you find difficult. The faster you begin, the easier the work becomes.",
      "When things get hard, do not slow down. Keep a calm and steady pace. Treat your responsibilities with care. Every small, wise choice you make today builds a good habit of success. Keep stepping forward with hope."
    ],
    [
      "Waiting too long makes your goals fade away. The more you delay a simple task, the harder it feels. Lower your gaze from distractions and put your hands to work. Your future self is either thanking you for your effort or wishing you had started sooner.",
      "The person who takes action will always learn more than the person who only dreams. Years of quiet, honest work build a wonderful life. But you must pay attention to today first. Let your daily actions speak for you. Keep your focus clean.",
      "Every single second is a chance to choose a good path over an easy one. You must make this choice. Do not let your family down, and do not let yourself down. Doing your duty is how you show real respect to your life. Start right now."
    ],
    [
      "If you let your feelings rule your day, you lose your focus. Your mind naturally seeks comfort and safety. But your goals require steady effort, focus, and attention. Do not argue with your own lazy thoughts. Rise early and start with a kind heart.",
      "The world has many people who talk about what should be done. Be the person who actually does it. Reject paths that are too easy. If you can guide your own body and your own time, you can guide your life toward great things.",
      "Look at your family and look at your name. You carry a beautiful history. Show your love for them by living a helpful, honest life. Stand tall, carry your responsibilities with joy, and do your best every single day."
    ],
    [
      "A master of any craft does not wait for a sunny day to practice. He works in the rain, the cold, and the quiet. Do not wait for perfect conditions because they do not exist. Do your best work even when you feel tired or distracted.",
      "No one else can build your future for you. No one can force your hands to do the work. You are the one who must choose to act. Accept this and find freedom in it. Build your good life step by step, every single day.",
      "Too much comfort makes the mind soft. The moment you are happy with what you did yesterday is the moment you should set a new gentle goal. Keep learning, keep helping, and keep growing. Moving forward is the true path."
    ],
    [
      "Let your honest work speak for you. A person who talks too much about their future is often hiding a lack of action today. Keep your quiet power. Work in peace. When you talk too much about your plans, you lose the energy to do them.",
      "You do not need to read another page to know what is right. You do not need a new plan. You need to start. You have gathered enough wisdom already. Now use it. Keep the path simple and take the first step with confidence.",
      "A quiet life of honest action is much better than a loud life of zero results. Let the world seek quick praise and false attention. Choose the classic way of daily effort, quiet helping, and good deeds. Just do your best."
    ],
    [
      "Never complain about results when you did not put in the effort. If you wish to improve your life, change your habits. If you want a healthy body, move and eat well. If you want a calm mind, think good thoughts. Discomfort is just a sign of growth.",
      "The greatest victories are won in the quiet, simple habits of everyday life. The excitement of a new goal always fades quickly. What remains is your daily promise. If you can enjoy the simple, steady work, you will build something beautiful.",
      "Make your decision once, then follow it. If you promised to wake up early and walk, do not debate it when you open your eyes. The debate is where you make excuses. Be true to your own promises. Your mind sets the path; your body must follow it."
    ],
    [
      "Fear is often a sign showing you what you need to learn. If a task makes you hesitate, it is the exact task you should do first. Do not run from a healthy challenge. Step into it. The person who never tries hard never knows how strong they are.",
      "Every distraction you allow to steal your focus is a vote against your own future. Guard your attention with care. The modern world is full of noise designed to keep you busy and distracted. Reclaim your time and find quiet.",
      "When the sun sets, ask yourself: Did I help someone today? Did I move closer to my goals? Be honest with your heart. If you had a difficult day, forgive yourself, learn the lesson, and prepare to try again tomorrow."
    ],
    [
      "You are defined by the standards you keep. If you accept lazy efforts and unfinished tasks, your life will feel messy. Raise your standards today. Demand the best effort from yourself before you ask anything from others. Start with the hard task first.",
      "Do not search for quick motivation. It is a fair-weather friend that leaves when the day gets cold. Rely on your steady habits. Good habits are like a warm coat in the winter. They keep you moving when you do not feel like it.",
      "Your life is passing by. Every single breath is a moment you will never have again. Knowing this, spend your hours on things that matter. Put away useless screens. Use your limited time to love your family and build a good life."
    ],
    [
      "The path of progress is built step by step. You will make mistakes, and you will have tough days. The difference between success and giving up is how fast you stand back up. Do not spend three days wasting time over one bad day. Reset your mind.",
      "Spend time with people who have good values. Their kind and focused energy will help you. Avoid those who complain and bring you down. If you want to grow, find friends who inspire you to be honest, kind, and hard-working.",
      "Your life is your own responsibility. No one can do your exercises or learn your lessons for you. Stop blaming your past or your circumstances. Use the hand you have been given and play it with a smile and a warm heart."
    ],
    [
      "While the rest of the world is busy with noise, you can find a quiet window to grow. Use the peaceful hours of the morning or evening to study, to pray, or to work on your goals. With no distractions, you can do wonderful things.",
      "Do not let physical tiredness make you quit. Your mind will try to tell you that you have done enough. It will suggest finishing the task tomorrow. This is when you should stay for ten more minutes to finish it well.",
      "Quiet work is not a punishment. It is choosing your future over temporary pleasure. You are trading quick entertainment for true peace of mind. Keep your head down, love your family, and let your progress bring you joy."
    ],
    [
      "A calm mind cannot be easily shaken by the world. You must build a peaceful place inside your heart. When there is noise around you, remain quiet, think carefully, and do the next right thing. This is true personal strength.",
      "Stop looking for approval from people you do not know. Their praise is empty, and their words do not change who you are. The only metric that matters is your own self-respect. Did you do your honest best today? If yes, be at peace.",
      "Too much pride is your worst enemy. It makes you think you are too good to do simple, humble tasks. Keep a humble heart. Remain a student who is always willing to learn, and do the simple jobs with love and care."
    ],
    [
      "Keep your inner light burning bright, even when the world feels cold. There will be seasons when nothing seems to go right. This is when your character is tested. Do not rely on external praise. Work because it is the right thing to do.",
      "Your unused talents are a loss to the world. If you do not try your best, you miss the chance to see what you can achieve. Do not rob yourself of this beautiful experience. Gentle effort every day will reveal your true gifts.",
      "The difference between a wish and a goal is taking action. Stop wishing for a better mind, a healthier body, or a happy life. Write down the simple daily actions you need to take, and do them with a happy and determined heart."
    ],
    [
      "In quiet moments, you find the best answers for your life. People are often afraid of silence because it makes them think. Do not run from silence. Sit quietly, look at your progress, and listen to the gentle voice that guides you.",
      "Noise is a major distraction. Cut out the useless news and digital gossip. You do not need to know every online trend. Focus on the work in front of you and the people who love you. Simplify your life to find real peace.",
      "The most reliable person is the one who says little but always keeps their word. They do not waste breath trying to impress others. They listen, they care, and they help. Cultivate this quiet power. Let your kind actions speak."
    ],
    [
      "Build your character through steady, patient effort. Just as gold is refined, your mind is shaped by the challenges you face with grace. Do not run from hard times; they are the lessons that make you a wise and gentle person.",
      "Honesty and helpful actions are your true wealth. Money can come and go, but your good character is yours forever. Keep your high standards. Never trade your honesty for quick money or easy choices. Stand firm and do good.",
      "You will not remember the days you spent sleeping in and doing nothing. You will remember the times you were tired, but you still chose to help a friend or complete your duty. Give your future self a story of kindness and steady action."
    ]
  ];

  // Helper to wrap sentences inside individual high-contrast fading interactive span blocks
  const wrapWords = (text) => text.split(/\.\s*/).filter(s => s.trim().length > 0).map(s => `<span class="hi">${s.trim()}.</span> `).join("");

  // Update clock dynamically & handle bottom countdown stats
  const updateClockAndStats = () => {
    const now = new Date();
    
    // Left navbar: Month & Year (Clean crisp white)
    const month = now.toLocaleDateString("en-US", { month: "long" }).toUpperCase();
    const year = now.getFullYear();
    document.getElementById("d0").textContent = `${month} ${year}`;
    
    // Right navbar: Day of the Week (Dynamic gold accent color)
    const weekday = now.toLocaleDateString("en-US", { weekday: "long" }).toUpperCase();
    document.getElementById("t0").textContent = weekday;

    // Time & Remaining Minutes calculations
    const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const totalMinutesInDay = 1440;
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const remainingMinutes = totalMinutesInDay - currentMinutes;
    
    const statsEl = document.getElementById('live-stats');
    if (statsEl) { 
      statsEl.textContent = `Time: ${timeStr} • ${remainingMinutes} minutes remaining today`; 
    }
  };

  const init = () => {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start + (start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000;
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    
    // Calculate rotational offsets so heading matches content in unique daily permutations
    const themeIndex = dayOfYear % themes.length;
    const contentIndex = dayOfYear % content.length;
    
    const activeTheme = themes[themeIndex];
    const activeParagraphs = content[contentIndex];

    // Set Main Hero Title (Restored to original font configurations)
    document.getElementById("h0").innerHTML = `The <span class="text-white not-italic">${activeTheme}</span>`;
    
    // Populate the Body Content with illuminated sentence splits
    document.getElementById("m0").innerHTML = `
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(activeParagraphs[0])}</p></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05]">${wrapWords(activeParagraphs[1])}</p></div>
      <div class="py-24 text-center z1"><h2 class="font-f1 text-8xl md:text-[12rem] italic zb">${activeTheme.toUpperCase()}.</h2></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(activeParagraphs[2])}</p></div>
    `;
    
    updateClockAndStats();
    
    // Smooth visibility revealing handler on scroll (IntersectionObserver)
    const generalObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { 
        if (entry.isIntersecting) {
          entry.target.classList.add("za"); 
        }
      });
    }, { threshold: 0.05 });
    
    document.querySelectorAll(".z1").forEach(el => generalObserver.observe(el));
  };

  window.addEventListener("scroll", () => {
    const scrollPos = window.scrollY;
    const nav = document.getElementById("n0");
    const scrollHint = document.getElementById("sd");
    
    // Dynamic Navbar visual blur toggle
    scrollPos > 10 ? nav.classList.add("zs") : nav.classList.remove("zs");
    if (scrollHint) { 
      scrollHint.style.opacity = scrollPos > 20 ? "0" : "1"; 
    }
    
    // Progressive Sentence Lighting Engine
    const spans = document.querySelectorAll(".hi");
    const centerY = window.innerHeight * 0.5;
    let activeSpan = null;
    let minDistance = Infinity;
    
    spans.forEach(span => {
      const rect = span.getBoundingClientRect();
      const dist = Math.abs((rect.top + rect.height / 2) - centerY);
      if (dist < minDistance) { 
        minDistance = dist; 
        activeSpan = span; 
      }
    });
    
    spans.forEach(span => {
      if (span === activeSpan && minDistance < window.innerHeight * 0.4) {
        span.classList.add("active");
      } else {
        span.classList.remove("active");
      }
    });
  }, { passive: true });

  window.onload = () => {
    init();
    setInterval(updateClockAndStats, 1000);
    setTimeout(() => { window.dispatchEvent(new Event('scroll')); }, 150);
  };
})();
</script>
</body>
</html>
