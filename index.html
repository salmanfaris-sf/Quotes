<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>salmanfaris.com</title>
    <meta name="description" content="Forge an unbreakable mind. Obey Allah. Obey His Messenger. Be a man of your word. Don't waste time. Stay disciplined. Stay focused. This is the way.">
    <meta name="theme-color" content="#000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1K1TKBQFFK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1K1TKBQFFK');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --text: #ffffff;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        ._f1 {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        ._f1.v {
            opacity: 1;
        }

        ._c1 {
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        #_q_ {
            transition: opacity 0.5s ease;
            white-space: pre-wrap;
            margin-bottom: 8px; 
            color: #ffffff;
        }

        #_st_ {
            font-size: 13px;
            color: #777;
            font-weight: 300;
            letter-spacing: 0.02em;
            transition: opacity 0.5s ease;
            line-height: 1.6;
            margin-bottom: 4px;
        }

        ._h_t {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: #666;
            transition: opacity 0.8s ease;
            white-space: nowrap;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        ._h_d {
            opacity: 0 !important;
            pointer-events: none;
        }

        #_nt_ {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 100;
        }

        #_nt_.s {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="_nt_">AUTOPLAY ON</div>

    <div class="_c1 _f1" id="_mc_">
        <h1 id="_q_" class="text-base md:text-lg font-light leading-relaxed tracking-wide"></h1>
        <div id="_st_" class="opacity-0"></div>
    </div>

    <div id="_hi_" class="_h_t opacity-0">TAP ANYWHERE TO VIEW NEXT QUOTE</div>

<script>
(function(){
    const _db = [
        { t: "Be better than you were yesterday." },
        { t: "Race one another in good deeds.\n(Qur'an 2:148)" },
        { t: "Don't waste time. You don't get it back." },
        { t: "Focus." },
        { t: "The problem is,\nyou think you have a lot of time to live." },
        { t: "Live everyday like it's your last day." },
        { t: "Consistency." },
        { t: "Big dreams need big sacrifices." },
        { t: "Practice makes perfect." },
        { t: "Do it even when you don't feel like it." },
        { t: "Nothing changes if nothing changes." },
        { t: "Stay different." },
        { t: "You only have 1,440 minutes every day, don’t let a single one go to waste.", id: "t_q" },
        { t: "You can't have a million-dollar dream with a minimum-wage work ethic." },
        { t: "A real man protects and provides." },
        { t: "Don't follow the crowd. Follow the truth." },
        { t: "Never build your happiness on\n someone else's tears." },
        { t: "Eliminate the 'tomorrow' mindset today." },
        { t: "The strongest man is he who controls\n his anger." },
        { t: "Be a man of your word." },
        { t: "Your habits define your future self." },
        { t: "Hate Laziness." },
        { t: "Always speak the truth." },
        { t: "Time waits for no one." },
        { t: "Quality over quantity in everything." },
        { t: "Knowledge without action is useless." },
        { t: "Fear Allah. Not people." },
        { t: "Live with purpose." },
        { t: "Be a man of honor." },
        { t: "A real man protects those who are vulnerable." },
        { t: "Every day is a second chance." },
        { t: "Now is the time." },
        { t: "Success is earned, not given." },
        { t: "Focus on your growth." },
        { t: "Stay Disciplined." },
        { t: "A heart connected to Allah is\n never truly broken." },
        { t: "Growth begins outside comfort zones." },
        { t: "This is the way." },
        { t: "Hard days make strong people." },
        { t: "Keep showing up." },
        { t: "Strength is built through repetition." },
        { t: "Do the boring work well." },
        { t: "Consistency creates mastery." },
        { t: "Work now, Relax later." },
        { t: "Don't look back. You're not going that way."},
        { t: "Every day counts." },
        { t: "Habits decide outcomes." },
        { t: "Growth requires discomfort." },
        { t: "Sweat more in practice. Bleed less in war." },
        { t: "When you feel like nothing is going your way, look at a person breaking a stone. They can hit a big rock 100 times and it won't even move. But on the 101st hit, it suddenly breaks into two pieces. It wasn't just that last hit that broke it—it was the result of all the hits that happened before it." },
        { t: "It always seems impossible until it's done." },
        { t: "Focus is a superpower in a\n Distracted world." },
        { t: "Weakness leaves when discipline enters." },
        { t: "Strength is built through patience." },
        { t: "Be strict with yourself." },
        { t: "Zero Excuses." },
        { t: "You already know what to do.\nYou just don’t like the cost." },
        { t: "The brain will invent reasons to avoid pain, even when pain is the only path forward." },
        { t: "Every wasted year makes the\n next one heavier." },
        { t: "Do it the moment you remember it." },
        { t: "Stick to the plan. Not your mood." },
        { t: "5… 4… 3… 2… 1. Take action." },
        { t: "Indeed Shaytan is ever, to mankind,\na clear enemy.\n(Qur'an 17:53)"},
        { t: "Prophet Muhammad ﷺ said:\nThere are two blessings that many people are deceived into losing: health and free time.\n- Sahih al-Bukhari 6412" },
        { t: "If not now, Then when?" },
        { t: "Leave a legacy. Let your life be a story of courage, action, and impact." },
        { t: "NOW.\nWaiting won’t help.\nOverthinking won’t help.\nAction will.\nDo it." },
        { t: "Lower your gaze, guard your tongue, and protect your heart." },
        { t: "Your current life is the result of past actions. Your future will be the result of today's actions." },
        { t: "The man who keeps walking will eventually leave the place he hates." },
        { t: "A few years of sacrifice can create a lifetime of freedom." },
        { t: "Your future is built by what you do\nafter a long tiring day." },
        { t: "Stand straight. Speak clearly. Fear none."},
        { t: "Its what's inside that matters." },
        { t: "Weak men wait for courage.\n Strong men create it through action."},
        { t: "Be the man who acts while others are\n still thinking."},
        { t: "Be so disciplined that even your bad days look like progress."},
        { t: "A strong man doesn’t need motivation.\nHe acts because he decided."},
        { t: "Pressure reveals the man within."}
    ];

    const _qx = document.getElementById('_q_');
    const _ha = document.getElementById('_hi_');
    const _st = document.getElementById('_st_');
    const _mc = document.getElementById('_mc_');
    const _nt = document.getElementById('_nt_');
    
    let _f = true;
    let _p = [];
    let _l_i = null;
    let _ap = false;
    let _ti = null;
    let _pt = null;
    let _lp = false;
    const _dur = 5000; 

    function _gs() {
        const n = new Date();
        let h = n.getHours();
        const m = n.getMinutes().toString().padStart(2, '0');
        const a = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        const e = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 23, 59, 59);
        const d = e - n;
        const ml = Math.floor(d / 60000);
        return { t: `${h}:${m} ${a}`, l: ml };
    }

    function _rp() {
        const lx = _qx.innerText;
        _p = [..._db].sort(() => Math.random() - 0.5);
        if (_p.length > 1 && _p[_p.length - 1].t === lx) {
             const s = _p.pop();
             _p.unshift(s);
        }
    }

    function _sn(msg) {
        _nt.innerText = msg;
        _nt.classList.add('s');
        setTimeout(() => _nt.classList.remove('s'), 1800);
    }

    function _up() {
        if (_p.length === 0) _rp();

        const nq = _p.pop();
        _qx.style.opacity = '0';
        _st.classList.add('opacity-0');
        
        if (_f) _ha.classList.add('_h_d');
        if (_l_i) clearInterval(_l_i);

        setTimeout(() => {
            _qx.innerText = nq.t;
            _qx.style.opacity = '1';
            _f = false;

            if (nq.id === "t_q") {
                const ux = () => {
                    const s = _gs();
                    _st.innerHTML = `Time: ${s.t} • ${s.l} minutes remaining today`;
                };
                ux();
                _st.classList.remove('opacity-0');
                _l_i = setInterval(ux, 30000);
            } else {
                _st.innerHTML = "";
                _st.classList.add('opacity-0');
            }
        }, 300);
    }

    function _ta() {
        _ap = !_ap;
        if (_ap) {
            _sn("AUTOPLAY ON");
            if (_ti) clearInterval(_ti);
            _ti = setInterval(_up, _dur);
        } else {
            _sn("AUTOPLAY OFF");
            if (_ti) clearInterval(_ti);
        }
    }

    function _sp() {
        _lp = false;
        _pt = setTimeout(() => {
            _lp = true;
            _ta();
            _pt = null;
        }, 600); 
    }

    function _ep() {
        if (_pt) {
            clearTimeout(_pt);
            _pt = null;
        }
        if (!_lp && !_ap) _up();
        _lp = false;
    }

    window.onload = () => {
        _rp();
        const i = _p.pop();
        _qx.innerText = i.t;
        
        if (i.id === "t_q") {
            const s = _gs();
            _st.innerHTML = `Time: ${s.t} • ${s.l} minutes remaining today`;
            _st.classList.remove('opacity-0');
        }

        requestAnimationFrame(() => {
            _mc.classList.add('v');
            setTimeout(() => {
                if (_f) _ha.classList.remove('opacity-0');
            }, 1000);
        });
    };

    document.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        _sp();
    });
    document.addEventListener('mouseup', () => _ep());
    document.addEventListener('touchstart', () => _sp(), { passive: true });
    document.addEventListener('touchend', () => _ep(), { passive: true });

})();
</script>
</body>
</html>
