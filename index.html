<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#050505">
<title>Salman Faris | Library & Reflections</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#050505',c2:'#C5A059'}
    }
  }
}
</script>
<style>
html { background-color: #050505; scroll-behavior: auto; }
body { margin: 0; background-color: #050505; color: #d1d1d1; font-smoothing: antialiased; overflow-x: hidden; }
.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(5,5,5,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.z1{opacity:0;transform:translateY(40px);filter:blur(15px);transition:all 1.2s cubic-bezier(.16,1,.3,1)}
.z1.za{opacity:1;transform:translateY(0);filter:blur(0)}
.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}
.hi{transition:color .6s ease,text-shadow .6s ease,opacity .6s ease;opacity:0.15;color:#B8B8B0;display:inline-block}
.hi.active{opacity:1 !important;color:#fff !important;text-shadow:0 0 15px rgba(255,255,255,0.4) !important}
.zb{color:#C5A059;opacity:.9;text-shadow:0 0 30px rgba(197,160,89,.3)}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,.5)}

.audio-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(197, 160, 89, 0.1);
    padding: 40px 30px;
    border-radius: 4px;
    transition: all 0.4s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}
.audio-card:hover { border-color: rgba(197, 160, 89, 0.4); background: rgba(255, 255, 255, 0.04); }
.audio-card.active { border-color: #C5A059; background: rgba(197, 160, 89, 0.05); }

/* Live Indicator Bars */
.playing-indicator {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
}
.playing-indicator span {
    width: 2px;
    background: #C5A059;
    animation: bar-up 0.8s ease-in-out infinite alternate;
}
.playing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.playing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bar-up { 0% { height: 3px; } 100% { height: 12px; } }

#fs-player {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #050505; z-index: 100;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.5s ease;
    touch-action: manipulation;
}
#fs-player.active { display: flex; opacity: 1; }

.ripple-target {
    position: absolute; width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(197, 160, 89, 0.3) 0%, transparent 70%);
    pointer-events: none; opacity: 0; transform: scale(0.4);
    z-index: 1;
}
.ripple-target.active {
    animation: ripple-pop 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes ripple-pop {
    0% { transform: scale(0.4); opacity: 0; }
    15% { opacity: 0.8; }
    100% { transform: scale(2.4); opacity: 0; }
}

@keyframes move-left-smooth { 
    0% { transform: translateX(0); } 
    40% { transform: translateX(-25px); } 
    100% { transform: translateX(0); } 
}
@keyframes move-right-smooth { 
    0% { transform: translateX(0); } 
    40% { transform: translateX(25px); } 
    100% { transform: translateX(0); } 
}
@keyframes scale-pop-smooth { 
    0% { transform: scale(1); } 
    50% { transform: scale(0.85); } 
    100% { transform: scale(1); } 
}

.anim-move-left { animation: move-left-smooth 0.7s cubic-bezier(0.25, 1, 0.5, 1); }
.anim-move-right { animation: move-right-smooth 0.7s cubic-bezier(0.25, 1, 0.5, 1); }
.anim-scale-pop { animation: scale-pop-smooth 0.5s cubic-bezier(0.25, 1, 0.5, 1); }

.seek-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 10;
    color: rgba(197, 160, 89, 0.3);
    transition: color 0.4s ease;
}

/* Progress Area Styles */
.progress-area {
    width: 100%;
    padding: 20px 0;
    cursor: pointer;
    pointer-events: auto;
}
.progress-container { 
    width: 100%; 
    height: 2px; 
    background: rgba(255, 255, 255, 0.05); 
    position: relative; 
}
.progress-bar { 
    height: 100%; 
    background: #C5A059; 
    width: 0%; 
    transition: width 0.1s linear; 
}
.progress-handle {
    position: absolute;
    right: -4px;
    top: -3px;
    width: 8px;
    height: 8px;
    background: #C5A059;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.2s;
}
.progress-area:hover .progress-handle { opacity: 1; }

#yt-container { position: fixed; bottom: -100px; left: -100px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
@keyframes flash{0%,100%{opacity:.1}50%{opacity:.7}}
.zf{animation:flash 2s ease-in-out infinite}
</style>
</head>
<body>

<div id="fs-player" onclick="handleScreenTap(event)">
    <div class="text-center space-y-12 select-none w-full relative pointer-events-none">
        <div class="px-8">
            <h2 id="fs-title" class="font-f1 text-5xl md:text-8xl italic text-white/90 mb-4"></h2>
            <p id="fs-reciter" class="font-f2 text-[10px] tracking-[0.6em] uppercase text-c2/60"></p>
        </div>
        
        <div class="flex items-center justify-center space-x-8 md:space-x-16 relative pointer-events-auto">
            <div class="relative flex items-center justify-center">
                <div id="rip-prev" class="ripple-target"></div>
                <button id="btn-prev" onclick="event.stopPropagation(); seekRel(-10)" class="seek-btn text-lg md:text-xl p-6">
                    &lt;&lt; 10
                </button>
            </div>

            <div class="relative flex items-center justify-center">
                <div id="rip-play" class="ripple-target" style="width:180px; height:180px;"></div>
                <div id="fs-play-btn" onclick="event.stopPropagation(); togglePlay()" class="w-20 h-20 md:w-24 md:h-24 rounded-full border border-c2/20 flex items-center justify-center text-c2 hover:border-c2/50 transition-all cursor-pointer bg-white/[0.03] z-10">
                    <svg id="fs-icon-svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5V19L19 12L8 5Z"/>
                    </svg>
                </div>
            </div>

            <div class="relative flex items-center justify-center">
                <div id="rip-next" class="ripple-target"></div>
                <button id="btn-next" onclick="event.stopPropagation(); seekRel(10)" class="seek-btn text-lg md:text-xl p-6">
                    10 &gt;&gt;
                </button>
            </div>
        </div>
    </div>
    
    <div class="w-full max-w-lg px-12 mt-20">
        <div class="progress-area" onclick="handleProgressBarClick(event)">
            <div class="progress-container">
                <div id="fs-progress" class="progress-bar">
                    <div class="progress-handle"></div>
                </div>
            </div>
        </div>
        <div class="flex justify-between text-[9px] font-f2 tracking-widest opacity-20 mt-2 uppercase pointer-events-none">
            <span id="fs-curr">00:00</span>
            <span id="fs-dur">--:--</span>
        </div>
    </div>
</div>

<nav id="n0" class="z0 fixed top-0 w-full z-40 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <div id="d0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">DAY 000</div>
  <div id="t0" class="text-[10px] uppercase tracking-[0.4em] text-white/80 font-f2">LOADING...</div>
</nav>

<main class="relative w-full">
  <section class="h-screen flex flex-col items-center justify-center px-6 relative z-10">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <h1 id="h0" class="font-f1 text-9xl md:text-[16rem] italic tracking-tighter leading-tight md:leading-none z1"></h1>
    </div>
    <div id="sd" class="pb-40 md:pb-24 z1">
      <div class="text-[11px] tracking-[0.8em] uppercase font-f2 opacity-40 zf">Scroll Down</div>
    </div>
  </section>

  <article id="m0" class="max-w-screen-2xl mx-auto px-6 py-40 relative z-10 space-y-72"></article>

  <section class="max-w-6xl mx-auto px-6 py-60 relative z-10">
    <div class="text-center mb-24 z1">
        <h2 class="font-f1 text-6xl md:text-8xl italic mb-4">The <span class="not-italic text-white">Library</span></h2>
        <p class="font-f2 text-[10px] tracking-[0.5em] uppercase text-c2/60">Qur'an Recitations</p>
    </div>
    <div id="library-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
  </section>
</main>

<div id="yt-container"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
let activeId = null;
let currentItem = null;
let progressInterval;
let lastTapTime = 0;

const recitationLibrary = [
    { title: "Surah Fatir (1-18)", reciter: "Abdul Basit Abdussamad", id: "2aUV7aA2Vs8" },
    { title: "Surah Yusuf", reciter: "Muhammad Hisham", id: "C0idKuUWdmU" },
    { title: "Surah Al-Baqarah", reciter: "Muhammad Hisham", id: "qfa9eYbyfWA" },
    { title: "Surah Al-Kahf", reciter: "Raad Al Kurdi", id: "jHZMsEinTwk" },
    { title: "Surah Al-Insan", reciter: "Omar Hisham", id: "JRn8Xc41nUI" },
    { title: "Surah Maryam", reciter: "Sherif Mostafa", id: "Jrtn8SPrMiw" }
];

function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-container', {
        height: '1', width: '1',
        playerVars: { 'autoplay': 0, 'controls': 0, 'modestbranding': 1, 'rel': 0, 'enablejsapi': 1, 'playsinline': 1 },
        events: {
            'onStateChange': (e) => {
                if (e.data == YT.PlayerState.PLAYING) {
                    startProgress();
                    updateIcons(true);
                    updateMediaSession();
                    updateLibraryUI();
                } else if (e.data == YT.PlayerState.PAUSED || e.data == YT.PlayerState.ENDED) {
                    clearInterval(progressInterval);
                    updateIcons(false);
                    updateLibraryUI();
                }
            }
        }
    });
}

function handleScreenTap(e) {
    const now = Date.now();
    const timeSinceLastTap = now - lastTapTime;
    lastTapTime = now;

    if (timeSinceLastTap < 300) {
        const x = e.clientX;
        const w = window.innerWidth;
        if (x < w * 0.4) seekRel(-10);
        else if (x > w * 0.6) seekRel(10);
    }
}

function handleProgressBarClick(e) {
    e.stopPropagation();
    if (!player || !player.getDuration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const width = rect.width;
    const percentage = x / width;
    const seekTime = player.getDuration() * percentage;
    player.seekTo(seekTime, true);
}

function updateMediaSession() {
    if ('mediaSession' in navigator && currentItem) {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: currentItem.title, artist: currentItem.reciter, album: "Qur'an Library"
        });
        navigator.mediaSession.setActionHandler('play', () => player.playVideo());
        navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
        navigator.mediaSession.setActionHandler('seekbackward', () => seekRel(-10));
        navigator.mediaSession.setActionHandler('seekforward', () => seekRel(10));
    }
}

function togglePlay() {
    const state = player.getPlayerState();
    if (state === 1) player.pauseVideo();
    else player.playVideo();
    triggerAnim('rip-play', 'fs-play-btn', 'pop');
}

function seekRel(sec) {
    if (!player || !player.getCurrentTime) return;
    const current = player.getCurrentTime();
    player.seekTo(current + sec, true);
    if (sec < 0) triggerAnim('rip-prev', 'btn-prev', 'left');
    else triggerAnim('rip-next', 'btn-next', 'right');
}

function triggerAnim(rippleId, btnId, type) {
    const rip = document.getElementById(rippleId);
    const btn = document.getElementById(btnId);
    rip.classList.remove('active');
    btn.classList.remove('anim-move-left', 'anim-move-right', 'anim-scale-pop');
    void rip.offsetWidth; 
    rip.classList.add('active');
    if (type === 'left') btn.classList.add('anim-move-left');
    if (type === 'right') btn.classList.add('anim-move-right');
    if (type === 'pop') btn.classList.add('anim-scale-pop');
}

function renderLibrary() {
    const grid = document.getElementById('library-grid');
    grid.innerHTML = '';
    recitationLibrary.forEach((item) => {
        const card = document.createElement('div');
        card.className = `audio-card z1 ${activeId === item.id ? 'active' : ''}`;
        card.id = `card-${item.id}`;
        card.onclick = () => openFS(item);
        
        const isPlaying = activeId === item.id && player && player.getPlayerState() === 1;

        card.innerHTML = `
            <div class="flex justify-between items-start">
                <div class="text-left">
                    <h3 class="font-f1 text-4xl md:text-5xl italic text-white/90">${item.title}</h3>
                    <p class="font-f2 text-[10px] tracking-[0.4em] uppercase text-c2/60 mt-3">${item.reciter}</p>
                </div>
                <div class="lib-status h-4">
                    ${isPlaying ? `
                        <div class="playing-indicator">
                            <span></span><span></span><span></span>
                        </div>
                    ` : ''}
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
    refreshObservers();
}

function updateLibraryUI() {
    const cards = document.querySelectorAll('.audio-card');
    cards.forEach(card => {
        const id = card.id.replace('card-', '');
        const statusDiv = card.querySelector('.lib-status');
        const isPlaying = activeId === id && player && player.getPlayerState() === 1;
        
        card.classList.toggle('active', activeId === id);
        if (statusDiv) {
            statusDiv.innerHTML = isPlaying ? `
                <div class="playing-indicator">
                    <span></span><span></span><span></span>
                </div>
            ` : '';
        }
    });
}

function openFS(item) {
    currentItem = item;
    const fs = document.getElementById('fs-player');
    document.getElementById('fs-title').textContent = item.title;
    document.getElementById('fs-reciter').textContent = item.reciter;
    fs.style.display = 'flex';
    setTimeout(() => fs.classList.add('active'), 10);
    history.pushState({ player: 'open' }, "");
    if (activeId !== item.id) {
        activeId = item.id;
        player.loadVideoById(item.id);
    } else {
        player.playVideo();
    }
}

function closeFS(e, fromPopState = false) {
    if(e) e.stopPropagation();
    const fs = document.getElementById('fs-player');
    fs.classList.remove('active');
    setTimeout(() => fs.style.display = 'none', 500);
    if (!fromPopState) history.back();
}

window.onpopstate = (e) => {
    if (document.getElementById('fs-player').classList.contains('active')) closeFS(null, true);
};

function updateIcons(isPlaying) {
    const fsIcon = document.getElementById('fs-icon-svg');
    if (isPlaying) fsIcon.innerHTML = '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
    else fsIcon.innerHTML = '<path d="M8 5V19L19 12L8 5Z"/>';
}

function startProgress() {
    clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        if (!activeId || !player.getCurrentTime) return;
        const time = player.getCurrentTime();
        const dur = player.getDuration();
        if (dur > 0) {
            document.getElementById('fs-progress').style.width = (time / dur * 100) + '%';
            document.getElementById('fs-curr').textContent = formatTime(time);
            document.getElementById('fs-dur').textContent = formatTime(dur);
        }
    }, 500);
}

function formatTime(sec) {
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function refreshObservers() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("za"); });
    }, { threshold: 0.1 });
    document.querySelectorAll(".z1").forEach(el => observer.observe(el));
}

(function(){
  const themes = ['True Faith', 'Pure Soul', 'Clear Path', 'Strong Will', 'Firm Deed'];
  const content = [
    ["Do not be afraid of what people think. If you fear Allah, you will not fear any man. People's words cannot kill you. Do not listen to them. Listen to your Creator instead. Stand tall. Be strong in your faith. Always do what is right.", "Your worth is about your good actions, not how you look. Allah does not care about your face or your body. He looks at your heart. Stop wasting time hating yourself. If you please Allah, the words of others do not matter.", "The best way to live is to obey Allah. Without Him, you have nothing. With Him, you have everything. Live with a clear goal. Seek to please the One who made you. Do not wait for people to love you.", "Shaitan is your obvious enemy. He wants you to sleep all day. He wants you to be lazy. He wants you to waste your life on your phone. Fight him. Get up now. Start your work. A strong person is always better than a weak one.", "Do not be sad about a job that is hard. It is a way to learn how to be strong. Work to feed your family. Use your free time to build your dream. Allah sees every step you take. Your hard work is never wasted."],
    ["Be strong by saying no to bad things. Do what is good even when it feels hard. If you can control yourself, you can win. Stop waiting for the right time. Get to work now. True power comes from following the laws of Allah.", "Discipline makes you special. If you cannot rule your day, others will do it for you. A quiet man who prays Fajr has already won. Build your day around your prayers, not your sleep. Strength comes from hard work.", "Your time is more important than money. A second lost is gone forever. Stop looking at your screen all day. Stop waiting for help. Shaitan loves it when you put off work. Be fast. Be smart. Every moment is a gift.", "Your goal is a promise to yourself. Do not break it just because you are tired. Wake up early. Stay late. The hard work is where your soul is tested. Allah loves the person who tries to be the best. Be good in everything.", "Stop waiting for people to say you are good. Only the words of Allah matter in the end. Be a brave man in public and a humble servant in private. Your real worth is in your faith, not in your bank account."],
    ["Trust Allah when life is hard. Say Alhamdulillah even in the middle of a problem. You build your heart by praying every day. Stop complaining. Start building your future. You can do great things if you stay focused.", "Be kind even when you have no energy. A smile is a gift. A kind word can save a life. Do not let hard work make you an angry person. Be humble. Treat the poor person with the same respect you show the boss.", "Allah sees everything you do. He sees your struggle. He sees your tired eyes. Do not be sad if your progress is slow. Just keep moving forward. Stand up, have a good intention, and face the day.", "Your real success is not what you own, but whom you helped. Help those who have nothing. Be the one who protects the weak. The strongest person is the one who changes bad habits for the sake of Allah. Be that man.", "Never forget where you started. You were made from dust, and you will go back to dust. Use this to stay humble. Be kind to the earth, because it will cover you soon. Prepare your answers for the Day of Judgment."]
  ];
  const wrapWords = (text) => text.split(/\.\s*/).filter(s => s.trim().length > 0).map(s => `<span class="hi">${s.trim()}.</span> `).join("");
  const initReflections = () => {
    const now = new Date();
    const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
    const themeName = themes[dayOfYear % 5];
    document.getElementById("d0").textContent = `DAY ${String(dayOfYear).padStart(3, "0")}`;
    document.getElementById("h0").innerHTML = `The <span class="text-white not-italic">${themeName}</span>`;
    document.getElementById("m0").innerHTML = `<div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(content[0][dayOfYear % content[0].length])}</p></div><div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05]">${wrapWords(content[1][(dayOfYear + 2) % content[1].length])}</p></div><div class="py-24 text-center z1"><h2 class="font-f1 text-8xl md:text-[12rem] italic zb">${themeName.toUpperCase()}.</h2></div><div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(content[2][(dayOfYear + 4) % content[2].length])}</p></div>`;
    updateTime();
    renderLibrary();
  };
  const updateTime = () => {
    const n = new Date();
    document.getElementById("t0").textContent = `${n.toLocaleDateString("en-US",{month:"long"}).toUpperCase()} ${n.toLocaleDateString("en-US",{day:"2-digit"})} / ${n.getFullYear()}`;
  };
  window.addEventListener("scroll", () => {
    const scrollPos = window.scrollY;
    document.getElementById("n0").classList.toggle("zs", scrollPos > 50);
    const sd = document.getElementById("sd");
    if(sd) sd.style.opacity = scrollPos > 20 ? "0" : "1";
    const spans = document.querySelectorAll(".hi"), vh = window.innerHeight, cy = vh * 0.5;
    let activeSpan = null, minD = Infinity;
    spans.forEach(s => {
      const d = Math.abs((s.getBoundingClientRect().top + s.getBoundingClientRect().height/2) - cy);
      if(d < minD) { minD = d; activeSpan = s; }
    });
    spans.forEach(s => s.classList.toggle("active", s === activeSpan && minD < vh * 0.4));
  }, { passive: true });
  window.onload = () => { initReflections(); setInterval(updateTime, 60000); };
})();
</script>
</body>
</html>
