<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Quotes.</title>
    <meta name="theme-color" content="#000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1K1TKBQFFK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1K1TKBQFFK');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --text: #e5e7eb;
            --quote-font: 'Inter', sans-serif;
            --ui-font: 'Inter', sans-serif;
            --weight-main: 300;
            --weight-bold: 400;
            --letter-spacing: 0.025em;
            --line-height: 1.625;
            --hint-color: #444;
            --btn-color: #555;
            --menu-bg: rgba(20, 20, 20, 0.9);
            --menu-line-height: 1px;
            --quote-size: 1rem;
            --quote-size-md: 1.125rem;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: var(--ui-font);
            color: var(--text);
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .fade-entrance {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-entrance.visible {
            opacity: 1;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-10px);
        }

        #g4x_txt {
            transition: opacity 0.5s ease;
            white-space: pre-wrap;
            margin-bottom: 8px; 
            font-family: var(--quote-font);
            font-weight: var(--weight-main);
            letter-spacing: var(--letter-spacing);
            line-height: var(--line-height);
            font-size: var(--quote-size);
        }

        @media (min-width: 768px) {
            #g4x_txt { font-size: var(--quote-size-md); }
        }

        #live_info {
            font-size: 13px;
            color: #777;
            font-weight: 300;
            letter-spacing: 0.05em;
            transition: opacity 0.5s ease;
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .tap-hint {
            font-size: 10px;
            color: var(--hint-color);
            transition: opacity 0.8s ease;
            white-space: nowrap;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            pointer-events: none;
            min-height: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            font-weight: var(--weight-bold);
        }

        #notification {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.08em;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 100;
        }

        #notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .menu-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 110;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Logic to hide menu in fullscreen */
        .is-fullscreen .menu-wrapper {
            opacity: 0;
            pointer-events: none;
        }

        #menu_btn {
            pointer-events: auto;
            padding: 12px;
            cursor: pointer;
            color: var(--btn-color);
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            gap: 5px; 
            z-index: 112;
            width: 44px; 
            height: 44px;
        }

        .menu-line {
            height: var(--menu-line-height);
            width: 18px;
            background-color: currentColor;
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: center; 
        }

        #menu_btn.open .line-1 { transform: translateY(3px) rotate(45deg); }
        #menu_btn.open .line-2 { transform: translateY(-3px) rotate(-45deg); }

        #options_panel {
            pointer-events: auto;
            background: var(--menu-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: none;
            border-radius: 16px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: -4px;
        }

        #options_panel.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .menu-item {
            padding: 10px 20px;
            font-size: 11px;
            letter-spacing: 0.02em;
            color: var(--text);
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.2s;
            font-weight: var(--weight-bold);
            white-space: nowrap;
        }

        .menu-item:hover { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div id="notification">Autoplay On</div>

    <div class="menu-wrapper">
        <div id="menu_btn">
            <div class="menu-line line-1"></div>
            <div class="menu-line line-2"></div>
        </div>
        <div id="options_panel">
            <div class="menu-item" id="btn_fullscreen">Full Screen</div>
            <div class="menu-item" id="btn_autoplay">Autoplay</div>
        </div>
    </div>

    <div class="container fade-entrance" id="main_content">
        <h1 id="g4x_txt"></h1>
        <div id="live_info" class="opacity-0"></div>
        <div id="hint" class="tap-hint opacity-0">TAP TO VIEW NEXT QUOTE</div>
    </div>

<script>
(function(){
    const quotes = [
        { t: "Be better than you were yesterday." },
        { t: "So race one another in good deeds.\n(Qur'an 2:148)" },
        { t: "Don't waste time. You don't get it back." },
        { t: "Focus." },
        { t: "The problem is,\nyou think you have a lot of time to live." },
        { t: "Live everyday like it's your last day." },
        { t: "Consistency." },
        { t: "Big dreams need big sacrifices." },
        { t: "Practice makes perfect." },
        { t: "Do it even when you don't feel like it." },
        { t: "Nothing changes if nothing changes." },
        { t: "Stay different." },
        { t: "You only have 1,440 minutes every day, don’t let a single one go to waste.", id: "time_quote" },
        { t: "You can't have a million-dollar dream with a minimum-wage work ethic." },
        { t: "A real man protects and provides." },
        { t: "Don't follow the crowd. Follow the truth." },
        { t: "Never build your happiness on someone else's tears." },
        { t: "Eliminate the 'tomorrow' mindset today." },
        { t: "The strongest man is he who controls his anger." },
        { t: "Be a man of your word." },
        { t: "Your habits define your future self." },
        { t: "Hate Laziness." },
        { t: "Always speak the truth." },
        { t: "Time waits for no one." },
        { t: "Quality over quantity in everything." },
        { t: "Knowledge without action is useless." },
        { t: "Fear Allah. Not people." },
        { t: "Live with purpose." },
        { t: "Be a man of honor." },
        { t: "A real man protects those who are vulnerable." },
        { t: "Every day is a second chance." },
        { t: "Now is the time." },
        { t: "Success is earned, not given." },
        { t: "Focus on your growth." },
        { t: "Stay Disciplined." },
        { t: "A heart connected to Allah is never truly broken." },
        { t: "Growth begins outside comfort zones." },
        { t: "This is the way." },
        { t: "Hard days make strong people." },
        { t: "Keep showing up." },
        { t: "Strength is built through repetition." },
        { t: "Do the boring work well." },
        { t: "Consistency creates mastery." },
        { t: "Work now, Relax later." },
        { t: "Don't look back. You're not going that way."},
        { t: "Every day counts." },
        { t: "Habits decide outcomes." },
        { t: "Growth requires discomfort." },
        { t: "Sweat more in practice. Bleed less in war." },
        { t: "When you feel like nothing is going your way, look at a person breaking a stone. It's the 101st hit that breaks it—the result of all that happened before." },
        { t: "It always seems impossible until it's done." },
        { t: "Focus is a superpower in a distracted world." },
        { t: "Weakness leaves when discipline enters." },
        { t: "Strength is built through patience." },
        { t: "Be strict with yourself." },
        { t: "Zero Excuses." },
        { t: "The brain will invent reasons to avoid pain, even when pain is the only path forward." },
        { t: "Every wasted year makes the next one heavier." },
        { t: "Do it the moment you remember it." },
        { t: "Stick to the plan. Not your mood." },
        { t: "5… 4… 3… 2… 1. Take action." },
        { t: "Indeed Shaytan is ever, to mankind, a clear enemy.\n- Surah Al-Isra: 53"},
        { t: "Prophet Muhammad ﷺ said:\nThere are two blessings that many people are deceived into losing: health and free time.\n- Sahih al-Bukhari 6412" },
        { t: "If not now, Then when?" },
        { t: "Leave a legacy. Let your life be a story of courage, action, and impact." },
        { t: "NOW.\nWaiting won’t help.\nOverthinking won’t help.\nAction will.\nDo it." },
        { t: "Lower your gaze, guard your tongue, and protect your heart." },
        { t: "Your future is built by what you do after a long tiring day." },
        { t: "Speak clearly. Stand straight. Fear none."},
        { t: "Its what's inside that matters." }
    ];

    const display = document.getElementById('g4x_txt');
    const hintArea = document.getElementById('hint');
    const infoDisplay = document.getElementById('live_info');
    const mainContent = document.getElementById('main_content');
    const notification = document.getElementById('notification');
    const menuBtn = document.getElementById('menu_btn');
    const optionsPanel = document.getElementById('options_panel');
    const btnAutoplay = document.getElementById('btn_autoplay');
    const btnFullscreen = document.getElementById('btn_fullscreen');
    
    let firstInteraction = true;
    let quotePool = [];
    let liveInterval = null;
    let autoplayActive = false;
    let autoplayInterval = null;
    let pressTimer = null;
    let longPressed = false;

    function getLiveStats() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return { time: `${hours}:${minutes} ${ampm}`, left: Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59) - now) / 60000) };
    }

    function refreshPool() {
        quotePool = [...quotes].sort(() => Math.random() - 0.5);
    }

    function showNotification(text) {
        notification.innerText = text;
        notification.classList.add('show');
        setTimeout(() => notification.classList.remove('show'), 1800);
    }

    function updateDisplay() {
        if (quotePool.length === 0) refreshPool();
        const nextQuote = quotePool.pop();
        display.style.opacity = '0';
        infoDisplay.classList.add('opacity-0');
        if (firstInteraction) hintArea.style.opacity = '0';
        if (liveInterval) clearInterval(liveInterval);

        setTimeout(() => {
            display.innerText = nextQuote.t;
            display.style.opacity = '1';
            firstInteraction = false;
            if (nextQuote.id === "time_quote") {
                const updateUI = () => { const stats = getLiveStats(); infoDisplay.innerHTML = `Time: ${stats.time} • ${stats.left} minutes remaining today`; };
                updateUI();
                infoDisplay.classList.remove('opacity-0');
                liveInterval = setInterval(updateUI, 30000);
            }
        }, 300);
    }

    function toggleAutoplay() {
        autoplayActive = !autoplayActive;
        showNotification(autoplayActive ? "Autoplay On" : "Autoplay Off");
        if (autoplayActive) autoplayInterval = setInterval(updateDisplay, 5000);
        else clearInterval(autoplayInterval);
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => showNotification("Fullscreen error"));
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    // Handle button hiding logic
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            document.body.classList.add('is-fullscreen');
            optionsPanel.classList.remove('open');
            menuBtn.classList.remove('open');
        } else {
            document.body.classList.remove('is-fullscreen');
        }
    });

    menuBtn.addEventListener('click', (e) => { 
        e.stopPropagation(); 
        const isOpen = optionsPanel.classList.toggle('open');
        menuBtn.classList.toggle('open', isOpen);
    });

    btnAutoplay.addEventListener('click', (e) => { e.stopPropagation(); toggleAutoplay(); optionsPanel.classList.remove('open'); menuBtn.classList.remove('open'); });
    btnFullscreen.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });

    window.onload = () => {
        refreshPool();
        updateDisplay();
        requestAnimationFrame(() => {
            mainContent.classList.add('visible');
            setTimeout(() => { if(firstInteraction) hintArea.classList.remove('opacity-0'); }, 1000);
        });
    };

    document.addEventListener('mousedown', (e) => { 
        if (e.target.closest('.menu-wrapper')) return;
        pressTimer = setTimeout(() => { longPressed = true; toggleAutoplay(); }, 600);
    });

    document.addEventListener('mouseup', () => { 
        clearTimeout(pressTimer); 
        if (!longPressed && !autoplayActive && !optionsPanel.classList.contains('open')) updateDisplay(); 
        longPressed = false; 
    });

    document.addEventListener('touchstart', (e) => { 
        if (e.target.closest('.menu-wrapper')) return;
        pressTimer = setTimeout(() => { longPressed = true; toggleAutoplay(); }, 600);
    }, { passive: true });

    document.addEventListener('touchend', () => { 
        clearTimeout(pressTimer); 
        if (!longPressed && !autoplayActive && !optionsPanel.classList.contains('open')) updateDisplay(); 
        longPressed = false; 
    }, { passive: true });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.menu-wrapper')) {
            optionsPanel.classList.remove('open');
            menuBtn.classList.remove('open');
        }
    });

})();
</script>
</body>
</html>
