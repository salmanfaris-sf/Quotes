<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Quotes</title>
    <meta name="theme-color" content="#000">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --text: #ffffff; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: var(--bg); overflow: hidden; touch-action: none; }
        body { font-family: 'Inter', sans-serif; color: var(--text); user-select: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        ._f1 { opacity: 0; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        ._f1.v { opacity: 1; }
        ._c1 { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 600px; width: calc(100% - 48px); text-align: center; z-index: 5; display: flex; flex-direction: column; align-items: center; }
        #_q_ { white-space: pre-wrap; margin-bottom: 12px; transition: opacity 0.35s ease-in-out; font-weight: 300; letter-spacing: -0.01em; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        #_st_ { font-size: 12px; color: #888888; font-weight: 400; transition: opacity 0.35s ease; line-height: 1.6; margin-bottom: 4px; }
        /* Premium hint styling: smaller, spaced, muted grey */
        #_hint_ { 
            position: absolute; bottom: 32px; left: 0; right: 0; text-align: center; 
            font-size: 9px; color: #404040; text-transform: uppercase; 
            letter-spacing: 0.25em; transition: opacity 0.5s ease; pointer-events: none; 
        }
    </style>
</head>
<body>

    <div class="_c1 _f1" id="_mc_">
        <h1 id="_q_" class="text-sm md:text-base lg:text-lg leading-relaxed tracking-wide opacity-0"></h1>
        <div id="_st_" class="opacity-0"></div>
    </div>

    <div id="_hint_">Tap anywhere to view the next quote</div>

<script>
(function(){
    const _db = [
        { t: "Be better than you were yesterday." },
        { t: "Race one another in good deeds.\n(Qur'an 2:148)" },
        { t: "Don't waste time. You don't get it back." },
        { t: "Focus." },
        { t: "Consistency." },
        { t: "This is the way." },
        { t: "Focus is a superpower in a Distracted world." },
        { t: "5  4  3  2  1\nTake action." },
        { t: "Speak good or remain silent.\n[Riyad as-Salihin 1511]" },
        { t: "Be the man who acts while others are still thinking." }
    ];

    const _qx = document.getElementById('_q_'), _st = document.getElementById('_st_'), _mc = document.getElementById('_mc_'), _hint = document.getElementById('_hint_');
    let _history = [], _historyIndex = -1, _hintShown = false;

    function _showQuote(nq) {
        _qx.style.opacity = '0';
        setTimeout(() => {
            _qx.innerText = nq.t;
            _qx.style.opacity = '1';
        }, 350);
    }

    function _next() {
        if (!_hintShown) {
            _hint.style.opacity = '0';
            _hintShown = true;
        }
        _historyIndex++;
        if (_historyIndex >= _history.length) {
            const nq = _db[Math.floor(Math.random() * _db.length)];
            _history.push(nq);
        }
        _showQuote(_history[_historyIndex]);
    }

    document.addEventListener('click', _next);
    window.onload = () => { 
        _history.push(_db[0]); 
        _historyIndex = 0; 
        _qx.innerText = _db[0].t; 
        _qx.style.opacity = '1'; 
        _mc.classList.add('v'); 
    };
})();
</script>
</body>
</html>
