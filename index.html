<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#050505',c2:'#C5A059',eye:'#B8B8B0'}
    }
  }
}

<style>
html {
  background-color: #050505;
  scroll-behavior: auto;
}
body {
  margin: 0;
  background-color: #050505;
  color: #d1d1d1;
  display: block;
  font-smoothing: antialiased;
  width: 100%;
  position: relative;
}
.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(5,5,5,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.z1{opacity:0;transform:translateY(40px);filter:blur(15px);transition:all 1.8s cubic-bezier(.16,1,.3,1)}
.z1.za{opacity:1;transform:translateY(0);filter:blur(0)}
.z2{position:fixed;top:50%;left:50%;width:100vw;height:100vw;background:radial-gradient(circle,rgba(255,255,255,.02) 0,transparent 60%);transform:translate(-50%,-50%);pointer-events:none;z-index:0}
.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}
.zs1{font-size:11px;letter-spacing:.8em;text-transform:uppercase;font-family:Inter,sans-serif;opacity:.4;color:#fff}
.zb{color:#C5A059;opacity:.9;text-shadow:0 0 30px rgba(197,160,89,.3)}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,.5)}
@keyframes flash{0%,100%{opacity:.1}50%{opacity:.7}}
.zf{animation:flash 2s ease-in-out infinite}
#sd{transition:opacity .5s ease,visibility .5s}
.hi{transition:color .6s ease,text-shadow .6s ease,opacity .6s ease;opacity:0.15;color:#B8B8B0;display:inline-block}
.hi.active{opacity:1 !important;color:#fff !important;text-shadow:0 0 15px rgba(255,255,255,0.4) !important}
.sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0;}
</style>
</head>
<body>
<div class="sr-only">
  <h1>Salman Faris</h1>
  <p>This is the official homepage of Salman Faris. It features daily thoughts, spiritual reflections, and insights on personal discipline and strength.</p>
</div>
<div class="z2"></div>
<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <div id="d0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">DAY 000</div>
  <div id="t0" class="text-[10px] uppercase tracking-[0.4em] text-white/80 font-f2">LOADING...</div>
</nav>
<main class="relative w-full">
  <!-- Section height is 100vh, we use flex-col and padding to lift the scroll hint -->
  <section class="h-screen flex flex-col items-center justify-between px-6 pt-24 pb-20 relative z-10">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <h1 id="h0" class="font-f1 text-9xl md:text-[16rem] italic tracking-tighter leading-tight md:leading-none z1" style="transition-delay:.2s"></h1>
    </div>
    <!-- Adjusted container for the scroll down hint to be higher up from the bottom -->
    <div id="sd" class="z1 flex justify-center items-center" style="transition-delay:.8s">
      <div class="zs1 zf">Scroll Down</div>
    </div>
  </section>
  <article id="m0" class="max-w-screen-2xl mx-auto px-6 py-40 relative z-10 space-y-72"></article>
</main>
<footer class="w-full flex justify-end px-12 py-12 relative z-10 z1">
  <div class="text-[10px] uppercase tracking-[0.6em] font-f2 text-white font-medium opacity-40">&mdash; BY SALMAN FARIS</div>
</footer>
<script>
(function(){
  const themes = ['True Faith', 'Pure Soul', 'Clear Path', 'Strong Will', 'Firm Deed'];
  const content = [
    [
      "Do not be afraid of what people think. If you fear Allah, you will not fear any man. People's words cannot kill you. Do not listen to them. Listen to your Creator instead. Stand tall. Be strong in your faith. Always do what is right.",
      "Your worth is about your good actions, not how you look. Allah does not care about your face or your body. He looks at your heart. Stop wasting time hating yourself. If you please Allah, the words of others do not matter.",
      "The best way to live is to obey Allah. Without Him, you have nothing. With Him, you have everything. Live with a clear goal. Seek to please the One who made you. Do not wait for people to love you.",
      "Shaitan is your obvious enemy. He wants you to sleep all day. He wants you to be lazy. He wants you to waste your life on your phone. Fight him. Get up now. Start your work. A strong person is always better than a weak one.",
      "Do not be sad about a job that is hard. It is a way to learn how to be strong. Work to feed your family. Use your free time to build your dream. Allah sees every step you take. Your hard work is never wasted."
    ],
    [
      "Be strong by saying no to bad things. Do what is good even when it feels hard. If you can control yourself, you can win. Stop waiting for the right time. Get to work now. True power comes from following the laws of Allah.",
      "Discipline makes you special. If you cannot rule your day, others will do it for you. A quiet man who prays Fajr has already won. Build your day around your prayers, not your sleep. Strength comes from hard work.",
      "Your time is more important than money. A second lost is gone forever. Stop looking at your screen all day. Stop waiting for help. Shaitan loves it when you put off work. Be fast. Be smart. Every moment is a gift.",
      "Your goal is a promise to yourself. Do not break it just because you are tired. Wake up early. Stay late. The hard work is where your soul is tested. Allah loves the person who tries to be the best. Be good in everything.",
      "Stop waiting for people to say you are good. Only the words of Allah matter in the end. Be a brave man in public and a humble servant in private. Your real worth is in your faith, not in your bank account."
    ],
    [
      "Trust Allah when life is hard. Say Alhamdulillah even in the middle of a problem. You build your heart by praying every day. Stop complaining. Start building your future. You can do great things if you stay focused.",
      "Be kind even when you have no energy. A smile is a gift. A kind word can save a life. Do not let hard work make you an angry person. Be humble. Treat the poor person with the same respect you show the boss.",
      "Allah sees everything you do. He sees your struggle. He sees your tired eyes. Do not be sad if your progress is slow. Just keep moving forward. Stand up, have a good intention, and face the day.",
      "Your real success is not what you own, but whom you helped. Help those who have nothing. Be the one who protects the weak. The strongest person is the one who changes bad habits for the sake of Allah. Be that man.",
      "Never forget where you started. You were made from dust, and you will go back to dust. Use this to stay humble. Be kind to the earth, because it will cover you soon. Prepare your answers for the Day of Judgment."
    ]
  ];
  const wrapWords = (text) => {
    return text.split(/\.\s*/)
      .filter(s => s.trim().length > 0)
      .map(s => `<span class="hi">${s.trim()}.</span> `)
      .join("");
  };
  const init = () => {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start + (start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000;
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    const themeIndex = dayOfYear % 5;
    const themeName = themes[themeIndex];
    document.getElementById("d0").textContent = `DAY ${String(dayOfYear).padStart(3, "0")}`;
    document.getElementById("h0").innerHTML = `The <span class="text-white not-italic">${themeName}</span>`;
    document.getElementById("m0").innerHTML = `
      <div class="z1">
        <p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">
          ${wrapWords(content[0][dayOfYear % content[0].length])}
        </p>
      </div>
      <div class="z1">
        <p class="font-f1 text-6xl md:text-8xl leading-[1.05]">
          ${wrapWords(content[1][(dayOfYear + 2) % content[1].length])}
        </p>
      </div>
      <div class="py-24 text-center z1">
        <h2 class="font-f1 text-8xl md:text-[12rem] italic zb">${themeName.toUpperCase()}.</h2>
      </div>
      <div class="z1">
        <p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">
          ${wrapWords(content[2][(dayOfYear + 4) % content[2].length])}
        </p>
      </div>
      <div class="z1 text-center py-12">
        <p class="font-f2 text-[12px] tracking-[0.6em] uppercase text-c2">Fear Allah. Work Hard. Stay Focused.</p>
      </div>
    `;
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add("za");
      });
    }, { threshold: 0.05 });
    document.querySelectorAll(".z1").forEach(el => observer.observe(el));
  };
  const updateTime = () => {
    const n = new Date();
    document.getElementById("t0").textContent = `${n.toLocaleDateString("en-US",{month:"long"}).toUpperCase()} ${n.toLocaleDateString("en-US",{day:"2-digit"})} / ${n.getFullYear()}`;
  };
  window.addEventListener("scroll", () => {
    const scrollPos = window.scrollY || window.pageYOffset;
    const nav = document.getElementById("n0");
    const scrollHint = document.getElementById("sd");
    const vh = window.innerHeight;
    scrollPos > 10 ? nav.classList.add("zs") : nav.classList.remove("zs");
    if (scrollHint) {
      if (scrollPos > 20) {
        scrollHint.style.opacity = "0";
        scrollHint.style.pointerEvents = "none";
      } else {
        scrollHint.style.opacity = "1";
        scrollHint.style.pointerEvents = "auto";
      }
    }
    const spans = document.querySelectorAll(".hi");
    const centerY = vh * 0.5;
    
    let activeSpan = null;
    let minDistance = Infinity;

    spans.forEach(span => {
      const rect = span.getBoundingClientRect();
      const mid = rect.top + (rect.height / 2);
      const dist = Math.abs(mid - centerY);
      
      if (dist < minDistance) {
        minDistance = dist;
        activeSpan = span;
      }
    });

    spans.forEach(span => {
      if (span === activeSpan && minDistance < vh * 0.4) {
        span.classList.add("active");
      } else {
        span.classList.remove("active");
      }
    });
  }, { passive: true });
  window.onload = () => {
    updateTime();
    init();
    setInterval(updateTime, 60000);
    setTimeout(() => {
      window.dispatchEvent(new Event('scroll'));
    }, 150);
  };
})();
</script>
</body>
</html>
