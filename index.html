<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#000000">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1K1TKBQFFK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-1K1TKBQFFK');
</script>
<title>Salman Faris | Simple Wisdom</title>
<meta name="description" content="Raw thoughts on discipline, focus, and the hard path.">
<meta name="author" content="Salman Faris">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#000000',c2:'#C5A059',eye:'#B8B8B0'}
    }
  }
}
</script>
<style>
html, body { 
  background-color: #000000; 
  scroll-behavior: auto; 
  overflow-x: hidden;
  width: 100%;
  position: relative;
  touch-action: pan-y; 
}

body { margin: 0; color: #d1d1d1; font-smoothing: antialiased; }

.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.z1{opacity:0;transform:translateY(40px);filter:blur(15px);transition:all 1.8s cubic-bezier(.16,1,.3,1)}
.z1.za{opacity:1;transform:translateY(0);filter:blur(0)}

.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}

.zs1{font-size:11px;letter-spacing:.8em;text-transform:uppercase;font-family:Inter,sans-serif;opacity:0.4;color:#fff}
.zb{color:#C5A059;opacity:0.9;text-shadow:0 0 30px rgba(197,160,89,0.3)}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,0.5)}
@keyframes flash{0%,100%{opacity:0.1}50%{opacity:0.7}}
.zf{animation:flash 2s ease-in-out infinite}
#sd{transition:opacity 0.5s ease,visibility 0.5s}

.hi{transition:color 0.6s ease,text-shadow 0.6s ease,opacity 0.6s ease;opacity:0.15;color:#B8B8B0;display:inline-block}
.hi.active{opacity:1 !important;color:#fff !important;text-shadow:0 0 15px rgba(255,255,255,0.4) !important}

/* Video Grid */
.v-grid { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 60px; }

.v-item {
  width: 90vw;
  max-width: 800px;
  aspect-ratio: 16/9;
  position: relative;
  background: #0d0d0d;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
  overflow: hidden;
  cursor: pointer;
  display: none;
}
.v-item.is-visible { display: block; }

.v-item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.5;
  transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
.v-item:hover video { opacity: 0.8; transform: scale(1.05); }

.v-play-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 54px; height: 54px; 
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  z-index: 5; pointer-events: none;
}
.v-play-btn svg { fill: #fff; width: 16px; height: 16px; transform: translateX(2px); }

/* Premium Cinema Overlay */
#cinema-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1000; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.98);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}

#cinema-video-container {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#cinema-video {
  max-width: 100%;
  max-height: 100%;
  box-shadow: 0 0 100px rgba(0,0,0,0.5);
}

#cinema-close {
  position: fixed; top: 30px; right: 30px; z-index: 1001;
  color: #fff; font-family: 'Inter'; font-size: 10px; letter-spacing: 0.4em;
  text-transform: uppercase; cursor: pointer; opacity: 0.6;
}
#cinema-close:hover { opacity: 1; }

.quote-container { width: 100%; max-width: 90vw; margin: 0 auto; text-align: center; }
.quote-line { font-family: 'Inter', sans-serif; font-size: clamp(12px, 3.8vw, 17px); font-weight: 400; line-height: 1.5; color: #ffffff; opacity: 0.9; margin: 0; }
.quote-stats { font-family: 'Inter', sans-serif; font-size: clamp(10px, 3vw, 14px); color: #ffffff; opacity: 0.5; margin-top: 10px; font-weight: 500; }

#v-section { padding-bottom: 0; margin-bottom: 0; }
.quote-wrapper { padding-top: 100px; padding-bottom: 80px; }
</style>
</head>
<body>

<div id="cinema-overlay">
  <div id="cinema-close">Close</div>
  <div id="cinema-video-container">
    <video id="cinema-video" playsinline preload="auto"></video>
  </div>
</div>

<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center">
  <div id="d0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">DAY 000</div>
  <div id="t0" class="text-[10px] uppercase tracking-[0.4em] text-white/80 font-f2">LOADING...</div>
</nav>

<main class="relative w-full">
  <section class="h-screen flex flex-col items-center justify-center px-6 relative z-10">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <h1 id="h0" class="font-f1 text-9xl md:text-[16rem] italic tracking-tighter leading-tight md:leading-none z1" style="transition-delay:0.2s"></h1>
    </div>
    <div id="sd" class="pb-40 md:pb-24 z1" style="transition-delay:0.8s">
      <div class="zs1 zf">Scroll Down</div>
    </div>
  </section>

  <article id="m0" class="max-w-screen-2xl mx-auto px-6 pt-40 pb-20 relative z-10 space-y-72"></article>

  <section id="v-section" class="relative z-10">
    <div class="z1 mb-24 text-center px-6">
       <h3 class="font-f2 text-[9px] uppercase tracking-[0.8em] text-white/25">Visual Reflections</h3>
    </div>
    <div id="video-list" class="v-grid"></div>
    
    <div class="z1 text-center px-6 quote-wrapper">
        <div class="quote-container">
            <p class="quote-line">You only have 1,440 minutes every day,</p>
            <p class="quote-line">don't let a single one go to waste.</p>
            <p id="live-stats" class="quote-stats"></p>
        </div>
    </div>
  </section>
</main>

<footer class="w-full flex justify-center px-6 pb-12 relative z-10 z1">
  <div class="text-[9px] uppercase tracking-[0.8em] font-f2 text-white font-medium opacity-30">BY SALMAN FARIS</div>
</footer>

<script>
(function(){
  const themes = ['Zero Excuses', 'Hard Truths', 'Full Focus', 'No Retreat', 'Pure Action'];
  const content = [
    ["You already know what to do. You just don’t like the cost. The brain will invent reasons to avoid pain, even when pain is the only path forward. Every wasted year makes the next one heavier. Do it the moment you remember it. Stick to the plan. Not your mood.", "You only have one thousand four hundred and forty minutes every day. Don’t let a single one go to waste. Focus is a superpower in a distracted world. Weakness leaves when discipline enters. Strength is built through patience. Be strict with yourself.", "Success is earned, not given. Focus on your growth. Stay Disciplined. Growth begins outside comfort zones. Hard days make strong people. Keep showing up. Strength is built through repetition. Do the boring work well.", "A real man protects and provides. Don't follow the crowd. Follow the truth. Never build your happiness on someone else's tears. Eliminate the tomorrow mindset today. The strongest man is he who controls his anger. Be a man of your word.", "Don't waste time. You don't get it back. The problem is, you think you have a lot of time to live. Live everyday like it's your last day. Consistency is the only way out. Big dreams need big sacrifices. Practice makes perfect."],
    ["Nothing changes if nothing changes. Stay different. You can't have a million dollar dream with a minimum wage work ethic. Your habits define your future self. Hate Laziness. Always speak the truth. Time waits for no one.", "Knowledge without action is useless. Fear Allah. Not people. Live with purpose. Be a man of honor. A real man protects those who are vulnerable. Every day is a second chance. Now is the time.", "When you feel like nothing is going your way, look at a person breaking a stone. They can hit a big rock one hundred times and it won't even move. But on the one hundred and first hit, it suddenly breaks. It wasn't just the last hit. It was all of them.", "Zero Excuses. Sweat more in practice. Bleed less in war. Habits decide outcomes. Growth requires discomfort. Work now. Relax later. Don't look back. You're not going that way. Every day counts.", "Focus. Be better than you were yesterday. So race one another in good deeds. Consistency creates mastery. This is the way. Leave a legacy. Let your life be a story of courage, action, and impact."],
    ["Waiting won’t help. Overthinking won’t help. Action will. Do it. Lower your gaze, guard your tongue, and protect your heart. Your current life is the result of past actions. Your future is the result of today's actions.", "The man who keeps walking will eventually leave the place he hates. A few years of sacrifice can create a lifetime of freedom. Your future is built by what you do after a long tiring day. Speak clearly. Stand straight. Fear none.", "It always seems impossible until it's done. Discipline is doing what needs to be done, even if you don't want to do it. Stop looking for shortcuts. There are none. Only work. Only results.", "People will forget your words, but they will never forget your results. Stop talking and start building. The world doesn't care about your potential. It cares about your output. Be undeniable.", "Every second is a war against your own laziness. Win the war. Don't let your ancestors down. Be the one who changed the family line. Discipline is the highest form of self-love."]
  ];

  const wrapWords = (text) => text.split(/\.\s*/).filter(s => s.trim().length > 0).map(s => `<span class="hi">${s.trim()}.</span> `).join("");

  const updateClockAndStats = () => {
    const now = new Date();
    document.getElementById("t0").textContent = `${now.toLocaleDateString("en-US",{month:"long"}).toUpperCase()} ${now.toLocaleDateString("en-US",{day:"2-digit"})} / ${now.getFullYear()}`;
    const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const remainingMinutes = 1440 - (now.getHours() * 60 + now.getMinutes());
    const statsEl = document.getElementById('live-stats');
    if (statsEl) statsEl.textContent = `Time: ${timeStr} • ${remainingMinutes} minutes remaining today`;
  };

  const initVideos = () => {
    const list = document.getElementById('video-list');
    const overlay = document.getElementById('cinema-overlay');
    const cinemaVideo = document.getElementById('cinema-video');
    const closeBtn = document.getElementById('cinema-close');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("za"); });
    }, { threshold: 0.1 });

    const openCinema = (src) => {
      cinemaVideo.src = src;
      overlay.style.display = 'flex';
      cinemaVideo.play().catch(e => console.log("Play interrupted"));
    };

    const closeCinema = () => {
      cinemaVideo.pause();
      cinemaVideo.src = "";
      overlay.style.display = 'none';
    };

    closeBtn.addEventListener('click', closeCinema);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeCinema(); });

    for(let i=1; i<=200; i++) {
      const item = document.createElement('div');
      item.className = 'v-item z1';
      const videoSrc = `videos/${i}.mp4`;
      
      item.innerHTML = `
        <div class="v-play-btn"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></div>
        <video muted playsinline preload="metadata">
          <source src="${videoSrc}" type="video/mp4">
        </video>
      `;

      const video = item.querySelector('video');
      video.onloadeddata = () => { item.classList.add('is-visible'); observer.observe(item); };
      video.onerror = () => item.remove();

      item.addEventListener('click', () => openCinema(videoSrc));
      list.appendChild(item);
    }
  };

  const init = () => {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / 864e5);
    document.getElementById("d0").textContent = `DAY ${String(dayOfYear).padStart(3, "0")}`;
    document.getElementById("h0").innerHTML = `The <span class="text-white not-italic">${themes[dayOfYear % 5]}</span>`;
    document.getElementById("m0").innerHTML = `
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(content[0][dayOfYear % content[0].length])}</p></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05]">${wrapWords(content[1][(dayOfYear + 2) % content[1].length])}</p></div>
      <div class="py-24 text-center z1"><h2 class="font-f1 text-8xl md:text-[12rem] italic zb">${themes[dayOfYear % 5].toUpperCase()}.</h2></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(content[2][(dayOfYear + 4) % content[2].length])}</p></div>
    `;
    initVideos();
    updateClockAndStats();
    
    const generalObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("za"); });
    }, { threshold: 0.05 });
    document.querySelectorAll(".z1:not(.v-item)").forEach(el => generalObserver.observe(el));
  };

  window.addEventListener("scroll", () => {
    const scrollPos = window.scrollY;
    const nav = document.getElementById("n0");
    const scrollHint = document.getElementById("sd");
    scrollPos > 10 ? nav.classList.add("zs") : nav.classList.remove("zs");
    if (scrollHint) scrollHint.style.opacity = scrollPos > 20 ? "0" : "1";
    
    const spans = document.querySelectorAll(".hi");
    const centerY = window.innerHeight * 0.5;
    let activeSpan = null;
    let minDistance = Infinity;
    spans.forEach(span => {
      const rect = span.getBoundingClientRect();
      const dist = Math.abs((rect.top + rect.height / 2) - centerY);
      if (dist < minDistance) { minDistance = dist; activeSpan = span; }
    });
    spans.forEach(span => {
      if (span === activeSpan && minDistance < window.innerHeight * 0.4) span.classList.add("active");
      else span.classList.remove("active");
    });
  }, { passive: true });

  window.onload = () => {
    init();
    setInterval(updateClockAndStats, 1000);
  };
})();
</script>
</body>
</html>
