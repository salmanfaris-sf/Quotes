<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Salman Faris | Daily Wisdom</title>
<link class="favicon" rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Daily wisdom on discipline, focus, action, and personal growth.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#000000',c2:'#C5A059',eye:'#B8B8B0'}
    }
  }
}
</script>
<style>
html { background-color: #000000; scroll-behavior: smooth; overscroll-behavior-y: contain; }
body { margin: 0; color: #d1d1d1; font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.z1{opacity:0;transform:translateY(40px);filter:blur(15px);transition:all 1.8s cubic-bezier(.16,1,.3,1)}
.z1.za{opacity:1;transform:none;filter:blur(0)}
.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}
.zs1{font-size:11px;letter-spacing:.8em;text-transform:uppercase;font-family:Inter,sans-serif;opacity:0.4;color:#fff}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,0.5)}
@keyframes flash{0%,100%{opacity:0.1}50%{opacity:0.7}}
.zf{animation:flash 2s ease-in-out infinite}
#sd{transition:opacity 0.5s ease,visibility 0.5s}
.hi{transition:color 0.6s ease,text-shadow 0.6s ease,opacity 0.6s ease;opacity:0.15;color:#B8B8B0;display:inline-block}
.hi.active{opacity:1 !important;color:#fff !important;text-shadow:0 0 15px rgba(255,255,255,0.4) !important}
.quote-container { width: 100%; max-width: 90vw; margin: 0 auto; text-align: center; }

/* Slightly increased typographic size from previous revision (clamp(12px, 2vw, 16px)) */
.quote-line { font-family: 'Inter', sans-serif; font-size: clamp(14px, 2.5vw, 20px); font-weight: 400; line-height: 1.6; color: #ffffff; opacity: 0.9; margin: 0; }

/* Restored original sizing, weight, and brightness (0.5 opacity) */
.quote-stats { font-family: 'Inter', sans-serif; font-size: clamp(12px, 3vw, 18px); color: #ffffff; opacity: 0.5; margin-top: 15px; font-weight: 500; }

.quote-wrapper { padding-top: 100px; padding-bottom: 60px; }
footer { padding-top: 10px; padding-bottom: 40px; position: relative; }
</style>
</head>
<body>
<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <div id="t0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium"></div>
  <div id="d0" class="text-white/90 text-[10px] uppercase tracking-[0.4em] font-f2 font-medium"></div>
</nav>
<main class="relative w-full">
  <section class="min-h-[85vh] flex flex-col items-center justify-center px-6 relative z-10 pt-24">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <h1 id="h0" class="font-f1 text-[4.5rem] sm:text-[6.5rem] md:text-[9.5rem] not-italic tracking-tighter leading-none z1 text-white" style="transition-delay:0.2s"></h1>
    </div>
    <div id="sd" class="py-12 z1" style="transition-delay:0.8s">
      <div class="zs1 zf">Scroll Down</div>
    </div>
  </section>
  <article id="m0" class="max-w-screen-2xl mx-auto px-6 py-20 relative z-10 space-y-72"></article>
  <section class="relative z-10">
    <div class="z1 text-center px-6 quote-wrapper">
        <div class="quote-container pt-16">
            <p class="quote-line">You only have 1,440 minutes every day,</p>
            <p class="quote-line">don't let a single one go to waste.</p>
            <p id="live-stats" class="quote-stats"></p>
        </div>
    </div>
  </section>
</main>
<footer class="w-full flex justify-center px-6 relative z-10 z1">
  <div class="text-[9px] uppercase tracking-[0.8em] font-f2 text-white font-medium opacity-30">BY SALMAN FARIS</div>
</footer>
<script>
(function(){
    const data = [
    { theme: 'Take Action', paragraphs: ["Stop waiting. The perfect time is a lie. If you want results, you have to do the work, not just think about it.", "Stop stalling. When you hesitate, you lose. Take the first step now. Action is the only way to build the life you want."] },
    { theme: 'Kill Laziness', paragraphs: ["Comfort is a trap. It feels good now, but it will ruin your future. Get up and move.", "Waiting makes it harder to start. Do not think, just do. Start with the hardest task and watch your energy grow."] },
    { theme: 'Don\'t Waste Time', paragraphs: ["You have 1,440 minutes today. Once they are gone, you cannot get them back. Stop wasting them on things that do not matter.", "Be protective of your hours. Do not trade your life for distractions. Focus on what moves you forward."] },
    { theme: 'Fear None', paragraphs: ["Other people's opinions do not pay your bills or build your future. Stop shrinking yourself to make them feel better.", "Fear is just a feeling. It looks big until you walk right through it. Face your challenges and they will fade away."] },
    { theme: 'Achieve Dreams', paragraphs: ["Dreams are useless without sweat. You need massive effort to make them real. Wishing is not doing.", "Wake up with a mission. While everyone else is sleeping or wasting time, you need to be building your future."] },
    { theme: 'Stay Focused', paragraphs: ["You cannot do everything at once. Pick one thing and do it well. Ignore the noise and say no to distractions.", "Lock the doors and turn off your phone. Focus is your greatest power. If you protect it, you will win."] },
    { theme: 'Obey Discipline', paragraphs: ["Motivation is for people who only work when they feel like it. Discipline is for people who get the job done every single day.", "Show up when you are tired. Show up when you are bored. True growth happens when you do the work you hate doing."] },
    { theme: 'Set Goals', paragraphs: ["If you do not have a target, you are just wandering. Decide exactly what you want and aim for it.", "Do not play it safe just to avoid failing. Set goals that scare you. Growth is found outside of your comfort zone."] },
    { theme: 'Crush Doubts', paragraphs: ["Doubt grows when you do nothing. The only cure for doubt is action. Work so hard that you have no time to worry.", "Your mind will lie to you and tell you to quit. Ignore it. Start moving and the fear will vanish."] },
    { theme: 'Burn the Boats', paragraphs: ["Stop looking back at your old life. Cut the ties to your lazy habits and commit to the new path.", "When you know there is no way back, you will find a way to succeed. Put your back against the wall and move forward."] },
    { theme: 'No Excuses', paragraphs: ["Stop blaming your past or your luck. That is just an excuse to stay where you are. Take control of your life.", "No one is coming to save you. You have to do the work yourself. Stop making excuses and start changing your habits."] },
    { theme: 'Stay Hard', paragraphs: ["If you are always comfortable, you will become weak. Do something hard every day to stay strong.", "Toughen your mind and body. Life will hit you, and when it does, you need to be an iron pillar."] },
    { theme: 'Pure Intensity', paragraphs: ["Give everything you have or do not bother starting. Half-hearted effort is a waste of your time.", "Attack your goals with hunger. Put your whole heart into today. Do not leave anything on the table when you go to sleep."] },
    { theme: 'Let It Go', paragraphs: ["Learn from yesterday, but do not live there. You cannot fix the past, but you can win the present.", "Stop carrying your mistakes. Take the lesson, drop the regret, and keep moving forward."] },
    { theme: 'Be Relentless', paragraphs: ["People will doubt you. Let them talk. A person who refuses to quit cannot be defeated.", "When you fall, get back up. Persistence is your best weapon. Keep moving until you cross the finish line."] },
    { theme: 'Kill Hesitation', paragraphs: ["Every second you wait, your fear grows. Act fast. A good plan now is better than a perfect plan later.", "Do not overthink it. Make a decision, move, and fix things as you go. Speed is your advantage."] },
    { theme: 'Stand Alone', paragraphs: ["The path to greatness is a lonely one. Do not wait for friends to join you. Trust your own vision.", "It is better to walk alone in the right direction than to follow a crowd toward a dead end."] },
    { theme: 'Own the Day', paragraphs: ["Do not let the day happen to you. You decide what happens. Start your morning with a plan.", "Win the first hour, and you will win the day. Get your most important work done while the world is still waking up."] },
    { theme: 'High Standards', paragraphs: ["Never settle for good enough. How you do one thing is how you do everything. Put your best into every detail.", "Demand more from yourself than anyone else does. Excellence is a daily habit, not a one-time thing."] },
    { theme: 'Build Momentum', paragraphs: ["A slow start is easy to stop, but a fast engine is hard to catch. Build your speed every single day.", "Do not stop. When you finish one task, start the next one immediately. Keep the fire burning."] },
    { theme: 'Master Yourself', paragraphs: ["If you cannot control your impulses, you are a slave. Learn to say no to what you want right now for what you want most.", "True power is self-control. Master your mind, and you will master your world."] },
    { theme: 'Zero Compromise', paragraphs: ["Do not lower your standards to fit in with lazy people. Stay at your level and let your results do the talking.", "Protect your energy. Get away from drama and cheap habits. Stay focused on your growth."] },
    { theme: 'Move Faster', paragraphs: ["The world is fast; if you are slow, you lose. Stop analyzing and start moving. Speed kills the competition.", "Learn fast and adapt. You create your own luck through movement. Get out of your head and get to work."] },
    { theme: 'Overcome Limits', paragraphs: ["Your limits are just in your head. When your brain tells you to stop, you are nowhere near your actual limit.", "Dig deep. You are stronger than you think. Push past the pain and discover what you are really capable of."] },
    { theme: 'Stay Real', paragraphs: ["Stop wearing a mask to please people who do not matter. Be yourself. It is the only way to live without fear.", "Live with integrity. Speak the truth and back it up with your actions. Real respect is earned, not bought."] },
    { theme: 'Outwork Them', paragraphs: ["Talent is common; work ethic is rare. While they are sleeping, you should be working. Sharpen your skills.", "Do the work when nobody is watching. True success is built in silence and proven in the results."] },
    { theme: 'Stay Sharp', paragraphs: ["A lazy brain is a useless brain. Read, learn, and grow every single day. Never stop getting smarter.", "Train your mind to solve problems. Knowledge is a weapon. Keep it ready and use it to win."] },
    { theme: 'Be Decisive', paragraphs: ["Weak people talk forever but never act. Strong people make a choice and move forward immediately.", "Trust yourself. Make the call. Anything is better than standing still and doing nothing."] },
    { theme: 'Rise Above', paragraphs: ["Gossip and drama are for people with empty lives. Keep your eyes on your goal and ignore the noise.", "Your time is too valuable to waste on small-minded people. Let them talk while you climb to the top."] },
    { theme: 'No Lifelines', paragraphs: ["Stop waiting for a lucky break or a helping hand. No one is coming to save you.", "You are responsible for your own life. Put the weight on your shoulders and carry it. That is how you win."] }
  ];


  const wrapWords = (text) => text.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0).map(s => `<span class="hi">${s.trim()}</span>`).join(" ");

  const updateClockAndStats = () => {
    const now = new Date();
    const day = now.getDate();
    const month = now.toLocaleDateString("en-US", { month: 'long' }).toUpperCase();
    const year = now.getFullYear();
    document.getElementById("d0").textContent = `${day} ${month} ${year}`;
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    document.getElementById("t0").textContent = `DAY ${dayOfYear}`;
    const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const remaining = 1440 - (now.getHours() * 60 + now.getMinutes());
    const statsEl = document.getElementById('live-stats');
    if (statsEl) statsEl.textContent = `Time: ${timeStr} • ${remaining} minutes remaining today`;
  };

  const init = () => {
    const startOfYear = new Date(new Date().getFullYear(), 0, 1);
    const today = new Date();
    const dayOfYear = Math.floor((today - startOfYear) / (1000 * 60 * 60 * 24));
    const item = data[dayOfYear % data.length];
    document.getElementById("h0").textContent = item.theme;
    document.getElementById("m0").innerHTML = `
      <div class="z1"><p class="font-f1 text-6xl sm:text-8xl md:text-[8.5rem] leading-[1.05] zi">${wrapWords(item.paragraphs[0])}</p></div>
      <div class="z1"><p class="font-f1 text-6xl sm:text-8xl md:text-[8.5rem] leading-[1.05]">${wrapWords(item.paragraphs[1])}</p></div>
    `;
    updateClockAndStats();
    const observer = new IntersectionObserver((entries) => { 
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("za"); }); 
    }, { threshold: 0.05 });
    document.querySelectorAll(".z1").forEach(el => observer.observe(el));
  };

  window.addEventListener("scroll", () => {
    const s = window.scrollY;
    document.getElementById("n0").classList.toggle("zs", s > 10);
    if(document.getElementById("sd")) document.getElementById("sd").style.opacity = s > 20 ? "0" : "1";
    const spans = document.querySelectorAll(".hi");
    let active = null, min = Infinity;
    spans.forEach(span => {
      const dist = Math.abs((span.getBoundingClientRect().top + span.getBoundingClientRect().height / 2) - (window.innerHeight * 0.5));
      if (dist < min) { min = dist; active = span; }
    });
    spans.forEach(span => { span === active && min < window.innerHeight * 0.4 ? span.classList.add("active") : span.classList.remove("active"); });
  }, { passive: true });
  window.onload = () => { init(); setInterval(updateClockAndStats, 1000); };
})();
</script>
</body>
</html>
