<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1K1TKBQFFK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-1K1TKBQFFK');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#050505">
    <title>Daily Discipline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        f1: ['"Cormorant Garamond"', 'serif'],
                        f2: ['Inter', 'sans-serif']
                    },
                    colors: {
                        c1: '#050505',
                        c2: '#C5A059',
                        eye: '#B8B8B0'
                    }
                }
            }
        }
    </script>
    <style>
        html, body { height: 100%; margin: 0; background-color: #050505; color: #d1d1d1; scroll-behavior: smooth; display: flex; flex-direction: column; }
        ._n1 { transition: transform .6s cubic-bezier(.16, 1, .3, 1), opacity .6s ease, background-color .4s ease, backdrop-filter .4s ease; }
        ._n1._s1 { background-color: rgba(5, 5, 5, .7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, .05); }
        ._n1._h1 { transform: translateY(-100%); opacity: 0; }
        ._r1 { opacity: 0; transform: translateY(40px); filter: blur(15px); transition: all 1.8s cubic-bezier(.16, 1, .3, 1); }
        ._r1._a1 { opacity: 1; transform: translateY(0); filter: blur(0); }
        ._g1 { position: fixed; top: 50%; left: 50%; width: 100vw; height: 100vw; background: radial-gradient(circle, rgba(255, 255, 255, .02) 0, transparent 60%); transform: translate(-50%, -50%); pointer-events: none; z-index: 0; }
        ._i1 { text-indent: 10rem; }
        @media (max-width: 768px) { ._i1 { text-indent: 0; } }
        ._w1 { color: #ececec; text-shadow: 0 0 20px rgba(255, 255, 255, .1), 0 0 40px rgba(255, 255, 255, .05); }
        ._sl1 { font-size: 10px; letter-spacing: .8em; text-transform: uppercase; font-family: Inter, sans-serif; opacity: .4; color: #ffffff; }
        ._bg1 { color: #C5A059; opacity: .9; text-shadow: 0 0 30px rgba(197, 160, 89, .3); }
    </style>
</head>
<body class="antialiased overflow-x-hidden">
    <div class="_g1"></div>
    <nav id="a1" class="_n1 fixed top-0 w-full z-50 px-8 py-6 flex justify-between items-center">
        <span class="font-f1 italic text-xl tracking-tighter text-white">SF</span>
        <div class="text-right">
            <div id="a2" class="text-[9px] uppercase tracking-[0.4em] text-white">...</div>
        </div>
    </nav>
    <main class="flex-grow">
        <section class="min-h-screen flex flex-col items-center justify-center px-6 relative z-10">
            <div class="h-20"></div>
            <div class="text-center flex-grow flex flex-col justify-center">
                <span id="a3" class="text-[10px] uppercase tracking-[1em] text-c2 mb-8 block _r1 font-f2"></span>
                <h1 id="a4" class="font-f1 text-8xl md:text-[14rem] italic tracking-tighter leading-none _r1" style="transition-delay:.2s"></h1>
            </div>
            <div class="pb-32 _r1" style="transition-delay:.4s">
                <div class="_sl1">Scroll Down</div>
            </div>
        </section>
        <article id="a5" class="max-w-screen-xl mx-auto px-6 py-40 relative z-10 space-y-60"></article>
    </main>
    <footer class="w-full flex flex-col items-center justify-center text-center px-6 pt-60 pb-8 relative z-10 _r1">
        <h3 class="font-f1 text-7xl md:text-9xl italic mb-10 _w1">Daily Wisdom.</h3>
        <div class="w-24 h-px bg-c2 mb-10 opacity-30"></div>
        <div class="space-y-4">
            <div class="text-[9px] uppercase tracking-[0.6em] font-f2 text-white font-medium">BY SALMAN FARIS</div>
        </div>
    </footer>
    <script>
        (function () {
            const adjectives = ["Pure", "Real", "Hard", "True", "Deep", "Bold", "Firm", "Main", "Great", "Iron", "Smart", "Wise", "Fast", "Strong", "Open"];
            const nouns = ["Mind", "Heart", "Work", "Step", "Rule", "Goal", "Way", "Plan", "Life", "Soul", "Power", "Duty", "Path", "Fight", "Hope"];
            
            const p1Pool = [
                "Fear Allah and you will never fear any man. When you know that Allah is in control, people's words cannot hurt you. Do not trade what Allah thinks of you for what people think of you. Stand tall. Be who you are meant to be.",
                "Shaitan is your real enemy. He never stops trying to trick you. He wants you to stay in bed. He wants you to be lazy. He wants you to waste your life. Fight back. Get up. Do your work. A strong Muslim is a hero in the eyes of Allah.",
                "Time is like money that you can only spend once. Do not waste it on your phone or on useless talk. Every minute you lose is a minute you could have used to get better. If you are not growing, you are failing. Take back your day.",
                "The Quran is the best book. It is the word of God. If you keep it in your heart, you will never be lost. Try to learn even one line a day. Do not let your heart be empty. Fill it with the words that really matter.",
                "Train your body so you can serve Allah better. Being strong is part of being a good Muslim. It helps you pray better and help others. Do not be weak. Eat well, sleep well, and work hard. Your body is a gift from Allah."
            ];

            const p2Pool = [
                "Mental strength means saying 'no' to yourself. It means doing what is right even when it is hard. If you can control your own mind, you can do anything. Stop being lazy. Get to work. True power comes when you follow the rules of Allah.",
                "Do good things when no one is looking. A good deed for show is a waste. A good deed for Allah is a treasure that lasts forever. Be a worker in the dark. Let your actions show who you really are. Be kind and be useful.",
                "People in the past were great because they only feared Allah. They did not care what others said. Why are you so worried about what people think? They cannot help you or hurt you. Only Allah has that power. Stand firm.",
                "Shaitan loves it when you say 'I will do it tomorrow.' Tomorrow is a lie. You only have today. If you need to fix your life, do it now. The door of mercy is open right now. Step through it. Do not wait for the end.",
                "Keep the Quran close to your heart. It will make you strong when you feel weak. It will show you the way when you are lost. It is a book for the strong, not the lazy. Read it. Live it. Love it every single day."
            ];

            const p3Pool = [
                "To be strong in the mind is to trust Allah when things are hard. It is to say 'Thank You' even in the storm. You build this strength by praying every day and thinking deeply. Stop complaining. Start building yourself. You are capable of so much.",
                "Fight Shaitan by being the first one awake. He likes it when you are sleepy and slow. Light up your day with the name of Allah. A heart that remembers Allah is a heart that Shaitan cannot touch. Be brave. Be ready.",
                "This world is a test. Every hard thing you face is a way to make you stronger. Do not wish for an easy life. Work to have a strong heart. Fear Allah in a way that makes you move. Do not let fear stop you. Let it push you forward.",
                "Your life is shorter than you think. What will you leave behind? Will it be a life of wasted time or a life of duty? Choose to be a man of action today. Good deeds are the only thing you will take to the grave. Do them now.",
                "Allah sees everything you do. He sees your struggle. He sees your hard work. Do not be sad if you only make a little progress. Just keep moving. Stand up, wash yourself, and face your life with the strength of a true believer."
            ];

            function getDayOfYear() {
                const now = new Date();
                const start = new Date(now.getFullYear(), 0, 0);
                const diff = (now - start) + ((start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000);
                const oneDay = 1000 * 60 * 60 * 24;
                return Math.floor(diff / oneDay);
            }

            function getDailyContent(d) {
                // Seed includes the current year to ensure variety across different years
                const year = new Date().getFullYear();
                const seed = (d * 163) + (year * 7); 
                const adj = adjectives[seed % adjectives.length];
                const noun = nouns[(seed + 11) % nouns.length];
                
                return {
                    title: `${adj} ${noun}`,
                    p1: p1Pool[seed % p1Pool.length],
                    p2: p2Pool[(seed + 4) % p2Pool.length],
                    p3: p3Pool[(seed + 7) % p3Pool.length],
                    idx: d
                };
            }

            function render() {
                const dIdx = getDayOfYear();
                const d = getDailyContent(dIdx);
                
                document.getElementById("a3").textContent = `DAY ${String(d.idx).padStart(3, "0")}`;
                document.getElementById("a4").innerHTML = `The <span class="text-white not-italic">${d.title}</span>`;
                
                const mainTag = d.title.toUpperCase() + ".";
                
                document.getElementById("a5").innerHTML = `
                    <div class="_r1">
                        <p class="font-f1 text-5xl md:text-7xl leading-[1.1] text-eye _i1">${d.p1}</p>
                    </div>
                    <div class="_r1">
                        <p class="font-f1 text-5xl md:text-7xl leading-[1.1] text-eye">${d.p2}</p>
                    </div>
                    <div class="py-20 text-center _r1">
                        <h2 class="font-f1 text-7xl md:text-[10rem] italic _bg1">${mainTag}</h2>
                    </div>
                    <div class="_r1">
                        <p class="font-f1 text-5xl md:text-7xl leading-[1.1] text-eye _i1">${d.p3}</p>
                    </div>
                    <div class="_r1 text-center">
                        <p class="font-f2 text-[10px] tracking-[0.5em] uppercase text-c2">Fear Allah. Work Hard. Stay Strong.</p>
                    </div>
                `;

                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add("_a1")
                    })
                }, { threshold: .1 });
                
                document.querySelectorAll("._r1").forEach(el => observer.observe(el));
            }

            function updateTime() {
                const n = new Date();
                // Dynamic year fetching
                document.getElementById("a2").textContent = `${n.toLocaleDateString("en-US", { month: "long" }).toUpperCase()} ${n.toLocaleDateString("en-US", { day: "2-digit" })} / ${n.getFullYear()}`;
            }

            let lastScroll = 0;
            window.addEventListener("scroll", () => {
                const nav = document.getElementById("a1");
                const current = window.pageYOffset;
                current > 20 ? nav.classList.add("_s1") : nav.classList.remove("_s1");
                if (current > lastScroll && current > 100) nav.classList.add("_h1");
                else nav.classList.remove("_h1");
                lastScroll = current;
            });

            window.onload = () => {
                updateTime();
                render();
                setInterval(() => {
                    const now = new Date();
                    if (now.getHours() === 0 && now.getMinutes() === 0) location.reload();
                    updateTime(); // Keep the clock updated if needed
                }, 60000);
            };
        })();
    </script>
</body>
</html>
