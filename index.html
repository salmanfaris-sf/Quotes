<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#000000">
<title>Salman Faris | Daily Wisdom</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-P37159WTH1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-P37159WTH1');
</script>

<meta name="description" content="Master your mind. Honor your word. Value your time. Stay disciplined. Seek truth. This is the way.">
<meta name="author" content="Salman Faris">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#000000',c2:'#C5A059',eye:'#B8B8B0'}
    }
  }
}
</script>
<style>
html { 
  background-color: #000000; 
  scroll-behavior: smooth; 
  overscroll-behavior-y: contain; 
}

body { 
  margin: 0; 
  color: #d1d1d1; 
  font-smoothing: antialiased; 
  min-height: 100vh;
  overflow-x: hidden; 
  -webkit-overflow-scrolling: touch; 
  overscroll-behavior-y: contain; 
}

.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.z1{opacity:0;transform:translateY(40px);filter:blur(15px);transition:all 1.8s cubic-bezier(.16,1,.3,1)}
.z1.za{opacity:1;transform:none;filter:blur(0)}

.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}

.zs1{font-size:11px;letter-spacing:.8em;text-transform:uppercase;font-family:Inter,sans-serif;opacity:0.4;color:#fff}
.zb{color:#C5A059;opacity:0.9;text-shadow:0 0 30px rgba(197,160,89,0.3)}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,0.5)}
@keyframes flash{0%,100%{opacity:0.1}50%{opacity:0.7}}
.zf{animation:flash 2s ease-in-out infinite}
#sd{transition:opacity 0.5s ease,visibility 0.5s}

.hi{transition:color 0.6s ease,text-shadow 0.6s ease,opacity 0.6s ease;opacity:0.15;color:#B8B8B0;display:inline-block}
.hi.active{opacity:1 !important;color:#fff !important;text-shadow:0 0 15px rgba(255,255,255,0.4) !important}

.quote-container { width: 100%; max-width: 90vw; margin: 0 auto; text-align: center; }
.quote-line { font-family: 'Inter', sans-serif; font-size: clamp(12px, 3.8vw, 17px); font-weight: 400; line-height: 1.5; color: #ffffff; opacity: 0.9; margin: 0; }
.quote-stats { 
  font-family: 'Inter', sans-serif; 
  font-size: clamp(10px, 3vw, 14px); 
  color: #ffffff; 
  opacity: 0.5; 
  margin-top: 10px; 
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  -webkit-font-feature-settings: "tnum";
}

.quote-wrapper { padding-top: 100px; padding-bottom: 60px; }
footer { padding-top: 10px; padding-bottom: 40px; position: relative; }
</style>
</head>
<body oncontextmenu="return false;">

<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <div id="d0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">MONDAY</div>
  <div id="t0" class="text-[10px] uppercase tracking-[0.4em] text-white/80 font-f2">LOADING...</div>
</nav>

<main class="relative w-full">
  <section class="h-screen flex flex-col items-center justify-center px-6 relative z-10">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <h1 id="h0" class="font-f1 text-7xl sm:text-8xl md:text-[13rem] tracking-tighter leading-tight md:leading-none z1 text-white" style="transition-delay:0.2s"></h1>
    </div>
    <div id="sd" class="pb-40 md:pb-24 z1" style="transition-delay:0.8s">
      <div class="zs1 zf">Scroll Down</div>
    </div>
  </section>

  <article id="m0" class="max-w-screen-2xl mx-auto px-6 pt-40 pb-20 relative z-10 space-y-72"></article>

  <section class="relative z-10">
    <div class="z1 text-center px-6 quote-wrapper">
        <div class="quote-container">
            <p class="quote-line">You only have 1,440 minutes every day,</p>
            <p class="quote-line">don't let a single one go to waste.</p>
            <p id="live-stats" class="quote-stats"></p>
        </div>
    </div>
  </section>
</main>

<footer class="w-full flex justify-center px-6 relative z-10 z1">
  <div class="text-[9px] uppercase tracking-[0.8em] font-f2 text-white font-medium opacity-30">BY SALMAN FARIS</div>
</footer>

<script>
(function(){
  const dailyThemes = [
    {
      theme: 'Be Relentless',
      paragraphs: [
        "True strength is not measured by avoiding difficulty, but by maintaining character when faced with it. When difficult challenges stand in your way, meet them with steady perseverance and patience. Life will test your resolve, but disciplined effort overcomes every obstacle.",
        "Keep your focus clear and consistent every single day. Anyone can work hard when conditions are easy, but true maturity is staying committed when you feel exhausted. Turn every hardship into an opportunity for personal growth.",
        "To be relentless means to hold yourself to the highest moral and personal standards. Move forward with a calm mind, noble intention, and quiet determination. True success always belongs to the one who refuses to abandon their principles."
      ]
    },
    {
      theme: 'Zero Excuses',
      paragraphs: [
        "You know what responsibilities fall upon you today. The mind naturally seeks ease and distraction, but discipline requires you to rise above comfort. A person of integrity accepts responsibility and finishes the work at hand.",
        "Refrain from blaming external circumstances or difficult days for a lack of progress. You are accountable for your own path and actions. Stand tall, refine your intentions, and work with sincere effort without complaint.",
        "Character is built in quiet moments when no one is watching. It is forged in early mornings and silent hours of focus. Self-discipline protects you from future regret. Work with purpose today so you may rest with a clear conscience."
      ]
    },
    {
      theme: 'Hard Truths',
      paragraphs: [
        "The world yields results to action and integrity, not to mere words or idle wishes. Harboring grand goals while remaining idle is self-deception. Let your daily habits speak quietly for who you are.",
        "Time passes continuously and without pause. You are granted a limited window of opportunity each day. Once spent, time can never be reclaimed. Resist cheap distractions in favor of meaningful progress.",
        "Fear nothing in life except wasted potential, dishonesty, and neglect of duty. Protect your loved ones, honor your promises, and stand firmly upon truth. Walk through each day with clear moral clarity."
      ]
    },
    {
      theme: 'Stay Focused',
      paragraphs: [
        "Silence the excessive noise of the surrounding world. Distance yourself from trivial matters that consume your mental clarity and energy. Guard your attention with care, as your future is shaped by what you focus on.",
        "Dividing your attention among too many pursuits leads to mediocrity in all. Choose your primary purpose and dedicate your efforts toward it with consistency. Embrace the quiet, routine effort that leads to mastery.",
        "Learn the strength of turning away from immediate pleasures for long-term goodness. Establish daily habits that sharpen your mind and build sound character. Advance steadily like an unwavering force."
      ]
    },
    {
      theme: 'Never Give Up',
      paragraphs: [
        "When life brings heavy burdens and weariness sets in, giving up on your duties is not an option. Consider a craftsman shaping stone with repeated strikes. Small, steady efforts often show no immediate change, yet each strike contributes to the final outcome.",
        "Consistent effort and temporary sacrifice yield long-term peace, capability, and purpose. Accept the necessary effort today. Face life's trials with composure and address your difficulties with courage.",
        "Every day presents an opportunity to master your internal self. Win the struggle against weakness within your own mind first. Honor your name, bear trial with patience, and continue until the duty is fulfilled."
      ]
    },
    {
      theme: 'Take Action',
      paragraphs: [
        "Overthinking creates unnecessary hesitation and anxiety. Purposeful action is often the best remedy for uncertainty. Avoid looking for artificial shortcuts; meaningful achievement requires honest labor.",
        "Your current situation is influenced by choices made yesterday, while your future is shaped by your actions today. Do not wait for ideal conditions to begin. Take action now and let strength build through practice.",
        "Words remain hollow and commitments meaningless without consistent execution. Step forward, work diligently, avoid vanity, and carry out your responsibilities with humility."
      ]
    },
    {
      theme: 'Live Everyday',
      paragraphs: [
        "Approach today with complete presence and dedication. Direct your heart and effort toward what is beneficial right now, leaving no room for petty grievances or wasteful worry.",
        "The future is never guaranteed to anyone. Every morning you awaken is a gift—an opportunity to refine your character, help others, and grow stronger. Treat your time with deep reverence.",
        "When the day reaches its end, ensure your time was spent with purpose. Leave nothing meaningful neglected, and offer your best effort in every endeavor."
      ]
    },
    {
      theme: 'Believe In Yourself',
      paragraphs: [
        "You possess the capacity for goodness and capability if you direct your heart and mind properly. Do not allow self-doubt or fear to convince you that progress is impossible. You have resilience within you.",
        "Your mindset reflects what you continuously feed it. Replace self-limiting thoughts with beneficial knowledge and skill. Every wise leader began as a learner who remained steadfast.",
        "Walk with humility and trust in your ability to grow through trial. Move beyond comfort, for strength of character is expanded through challenges successfully navigated."
      ]
    },
    {
      theme: 'Do Not Waste Time',
      paragraphs: [
        "Time is among the most precious blessings bestowed upon you. Once a single hour passes, no wealth in existence can purchase it back. Treat every portion of your day as invaluable.",
        "Eliminate meaningless habits that consume your time without bringing benefit. Mindless consumption and chasing transient pleasure weaken the spirit. Utilize quiet hours to strengthen your intellect and body.",
        "Structure your day with clear, noble objectives. Rise early, fulfill your obligations, and conclude your day with peace. One who respects time demonstrates respect for life itself."
      ]
    },
    {
      theme: 'Build Your Mind',
      paragraphs: [
        "Your mind is your primary tool for navigating life. Feed it with beneficial wisdom, deep reflection, and sound moral principles. A well-cultivated mind guides one through physical and emotional hardship.",
        "Shield your mind from idle gossip, toxic commentary, and unnecessary conflict. Maintain an environment of internal calm. What you absorb consistently will shape your outlook.",
        "Govern your emotions so they do not govern your actions. When difficulties arise, maintain composure and sound reasoning. A patient and clear mind finds a righteous path through adversity."
      ]
    },
    {
      theme: 'Strong Character',
      paragraphs: [
        "Authentic character is revealed during hardship, not in times of ease. Displaying virtue when conditions are favorable is simple, but true integrity shines during the storm.",
        "Speak truth gently and honor your commitments faithfully. A person whose word is reliable earns genuine respect and trust from those around them.",
        "Conduct yourself with quiet confidence, humility, and self-restraint. True strength requires no loud declaration; let your conduct and character speak on your behalf."
      ]
    },
    {
      theme: 'Quiet Strength',
      paragraphs: [
        "True strength is often calm and soft-spoken. Cultivate the habit of listening carefully and speaking with wisdom rather than haste. Silence provides space for contemplation.",
        "Pursue your noble ambitions quietly without seeking public validation. Build meaningful work in silence and allow the wholesome outcome to speak for itself.",
        "Maintain inner tranquility when surrounding conditions seem chaotic. Restrain anger, breathe deeply, and act with deliberate wisdom and kindness."
      ]
    },
    {
      theme: 'Do Your Duty',
      paragraphs: [
        "Duty means doing what is upright for your family, community, and personal life, regardless of fluctuating feelings. Fulfilling your obligations is a pillar of honor.",
        "Emotions are temporary, but duty and truth endure. Rise above temporary moods and carry out your daily obligations with sincerity and thoroughness.",
        "Deep contentment arises from fulfilling obligations well. When you tend to your responsibilities with excellence, you establish a life anchored on solid ground."
      ]
    },
    {
      theme: 'Master Yourself',
      paragraphs: [
        "Before seeking to guide others, one must master oneself. Exercise discipline over your body, speech, and daily choices.",
        "Forego short-term indulgence for the sake of lasting wellbeing and spiritual clarity. The capacity to exercise self-restraint is central to moral and personal fulfillment.",
        "Take complete accountability for your path. When you govern your desires and actions, you live with true freedom and self-respect."
      ]
    },
    {
      theme: 'Embrace Pain',
      paragraphs: [
        "Hardship is not an enemy, but a powerful teacher. The trials you experience refine your heart, remove arrogance, and build genuine fortitude.",
        "Do not retreat from noble struggle or necessary effort. Step into challenges willingly, as true character matures through endurance.",
        "When you learn to bear discomfort with patience, temporary difficulties lose their power to dismay you. You grow wiser through every test life presents."
      ]
    },
    {
      theme: 'Clear Goals',
      paragraphs: [
        "A life without purposeful goals is like a vessel without a rudder, drifting aimlessly with the wind. Define your intentions clearly and seek what is beneficial.",
        "Outline your objectives and break them into manageable daily actions. Focus your energy on completing each step with quality and sincerity.",
        "Keep your focus fixed on what is good and enduring. Avoid being drawn away by minor distractions, and walk steadily toward your purpose."
      ]
    },
    {
      theme: 'Continuous Growth',
      paragraphs: [
        "Never settle for complacency or moral stagnation. Strive to improve your character, mind, health, and spirit by a small measure each day.",
        "Seek beneficial knowledge, cultivate useful capabilities, and discipline your body. Stagnation weakens human potential, while continuous learning enriches life.",
        "Measure your progress against who you were yesterday, rather than envying others. So long as you are growing in virtue and purpose daily, you are fulfilling your potential."
      ]
    },
    {
      theme: 'Unshakable Peace',
      paragraphs: [
        "Cultivate a serene heart that external events cannot easily disturb. While you cannot govern every external circumstance, you remain in control of your response.",
        "Avoid exhausting your emotional energy on trivial matters that bear no weight in the long run. Preserve your focus for what truly matters.",
        "Find tranquility in honest labor, ethical living, and sincere intention. When your conscience is clean, peace naturally resides within your heart."
      ]
    },
    {
      theme: 'Be The Example',
      paragraphs: [
        "Strive to be a source of wisdom, safety, and inspiration for your family and community. Lead through upright conduct rather than empty rhetoric.",
        "Maintain high standards for your work, health, honesty, and self-discipline. Demonstrate through your life what a person of principle looks like.",
        "When others observe your consistency, kindness, and strength, they are encouraged to seek good as well. Upright living benefits the entire community."
      ]
    },
    {
      theme: 'Overcome Fear',
      paragraphs: [
        "Fear is often an illusion magnified by an anxious mind. When you step forward with trust and determination toward what is right, fear loses its hold.",
        "Courage is not the absence of fear, but the resolve to do what is right despite it. Act with faith and take necessary, righteous action.",
        "Each time you overcome a fear through patience, you gain spiritual freedom. Move beyond comfortable boundaries and widen your capacity for good."
      ]
    },
    {
      theme: 'Be Grateful',
      paragraphs: [
        "Be deeply thankful for health, the air you breathe, and the gift of a new day. Countless souls did not receive this morning.",
        "Gratitude opens the heart and brings clarity. Rather than focusing on what you lack, utilize every resource and ability you currently possess to do good.",
        "Approach each dawn with humility, hunger for improvement, and a thankful heart. Live righteously, treat others with justice, and leave a lasting good impression."
      ]
    }
  ];

  const wrapWords = (text) => text.split(/\.\s*/).filter(s => s.trim().length > 0).map(s => `<span class="hi">${s.trim()}.</span> `).join("");

  const updateClockAndStats = () => {
    const now = new Date();
    
    // Top-left Day of the week
    const dayName = now.toLocaleDateString("en-US", { weekday: 'long' }).toUpperCase();
    document.getElementById("d0").textContent = dayName;

    // Top-right Date format
    document.getElementById("t0").textContent = `${now.toLocaleDateString("en-US",{month:"long"}).toUpperCase()} ${now.toLocaleDateString("en-US",{day:"2-digit"})} / ${now.getFullYear()}`;
    
    // Time with seconds for the bottom section
    const timeWithSeconds = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
    
    const totalMinutesInDay = 1440;
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const remainingMinutes = totalMinutesInDay - currentMinutes;
    const statsEl = document.getElementById('live-stats');
    if (statsEl) { statsEl.textContent = `Time: ${timeWithSeconds} • ${remainingMinutes} minutes remaining today`; }
  };

  const init = () => {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start + (start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000;
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    
    const currentTopic = dailyThemes[dayOfYear % dailyThemes.length];
    
    // Set clean heading without "The"
    document.getElementById("h0").textContent = currentTopic.theme;
    
    // Render content paragraphs
    document.getElementById("m0").innerHTML = `
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(currentTopic.paragraphs[0])}</p></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05]">${wrapWords(currentTopic.paragraphs[1])}</p></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(currentTopic.paragraphs[2])}</p></div>
    `;
    updateClockAndStats();
    
    const generalObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("za"); });
    }, { threshold: 0.05 });
    document.querySelectorAll(".z1").forEach(el => generalObserver.observe(el));
  };

  window.addEventListener("scroll", () => {
    const s = window.scrollY;
    document.getElementById("n0").classList.toggle("zs", s > 10);
    if(document.getElementById("sd")) document.getElementById("sd").style.opacity = s > 20 ? "0" : "1";
    
    const spans = document.querySelectorAll(".hi");
    let active = null, min = Infinity;
    spans.forEach(span => {
      const dist = Math.abs((span.getBoundingClientRect().top + span.getBoundingClientRect().height / 2) - (window.innerHeight * 0.5));
      if (dist < min) { min = dist; active = span; }
    });
    spans.forEach(span => { span === active && min < window.innerHeight * 0.4 ? span.classList.add("active") : span.classList.remove("active"); });
  }, { passive: true });

  window.onload = () => {
    init();
    setInterval(updateClockAndStats, 1000);
  };
})();
</script>
</body>
</html>
