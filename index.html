<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#000000">
<title>Salman Faris | Simple Wisdom</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#000000',c2:'#C5A059'}
    }
  }
}
</script>
<style>
html, body { 
  background-color: #000000; 
  scroll-behavior: auto; 
  overflow-x: hidden;
  width: 100%;
  position: relative;
  touch-action: pan-y; 
  -webkit-font-smoothing: antialiased;
}

body { margin: 0; color: #d1d1d1; }

.z0 { transition: background-color .4s ease, backdrop-filter .4s ease, border-bottom .4s ease; }
.z0.zs { background-color: rgba(0,0,0,.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,.08); }

.z1 { 
  opacity: 0; 
  transform: translateY(20px); 
  filter: blur(8px); 
  transition: opacity 1.2s cubic-bezier(.16,1,.3,1), transform 1.2s cubic-bezier(.16,1,.3,1), filter 1.2s cubic-bezier(.16,1,.3,1); 
  will-change: transform, opacity;
}
.z1.za { opacity: 1; transform: translateY(0); filter: blur(0); }

.full-width-text {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 6vw;
  text-align: left;
  word-spacing: -0.05em;
}

.hi { 
  transition: color 0.5s ease, opacity 0.5s ease; 
  opacity: 0.1; 
  color: #B8B8B0; 
  display: inline;
}
.hi.active { opacity: 1 !important; color: #fff !important; }

.v-grid { 
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  padding: 0 20px;
  max-width: 100%;
  margin: 0 auto;
}
@media(min-width: 768px) { .v-grid { grid-template-columns: repeat(2, 1fr); gap: 30px; padding: 0 40px; } }

.v-wrap { 
  aspect-ratio: 16/9; 
  position: relative; 
  background: #000000;
  overflow: hidden; 
  cursor: pointer;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border 0.3s ease;
  border-radius: 2px; 
  border: 1px solid rgba(255,255,255,0.08); 
}
.v-wrap:hover { transform: scale(1.01); border-color: #C5A059; }

.v-play-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 54px; height: 54px; 
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(10px); 
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  z-index: 10;
  border: 1px solid rgba(255,255,255,0.1);
}
.v-play-btn svg { fill: #fff; width: 16px; height: 16px; transform: translateX(1px); }

#fs-overlay {
    position: fixed; inset: 0; background: #000; z-index: 1000;
    display: none; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.15s ease-out;
}
#fs-overlay.active { display: flex; opacity: 1; }
#fs-video { width: 100%; height: 100%; object-fit: contain; background: #000; outline: none; }

.quote-wrapper { padding-top: 120px; padding-bottom: 24px; }
.quote-line { font-family: 'Inter', sans-serif; font-size: 15px; color: #ffffff; opacity: 1; margin: 0; font-weight: 400; letter-spacing: 0.01em; } 
.quote-stats { font-family: 'Inter', sans-serif; font-size: 11px; color: #ffffff; opacity: 0.3; margin-top: 8px; }

footer { padding-top: 32px; padding-bottom: 60px; }

.zd { color: #C5A059; }
.zb { color: #C5A059; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: #222; }
</style>
</head>
<body>

<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <div id="d0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">DAY 000</div>
  <div id="t0" class="text-[10px] uppercase tracking-[0.4em] text-white/80 font-f2">LOADING...</div>
</nav>

<div id="fs-overlay">
    <video id="fs-video" playsinline loop preload="auto" webkit-playsinline controls></video>
</div>

<main class="relative w-full">
  <section class="h-screen flex flex-col items-center justify-center px-6 relative z-10">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <h1 id="h0" class="font-f1 text-9xl md:text-[16rem] italic tracking-tighter leading-tight z1"></h1>
    </div>
    <div id="sd" class="pb-32 z1">
      <div class="text-[11px] uppercase tracking-[0.8em] font-f2 opacity-40 text-white animate-pulse">Scroll Down</div>
    </div>
  </section>

  <article id="m0" class="w-full pt-40 pb-20 relative z-10 space-y-72"></article>

  <section id="v-section" class="relative z-10 pt-40">
    <div class="z1 mb-20 text-center">
       <h3 class="font-f2 text-[10px] uppercase tracking-[0.8em] text-white/20">Recordings</h3>
    </div>
    <div id="video-list" class="v-grid"></div>
    
    <div class="z1 text-center quote-wrapper">
        <p class="quote-line">You only have 1,440 minutes every day,</p>
        <p class="quote-line">don't let a single one go to waste.</p>
        <p id="live-stats" class="quote-stats"></p>
    </div>
</main>

<footer class="w-full flex justify-center relative z-10 z1">
  <div class="text-[9px] uppercase tracking-[0.8em] font-f2 text-white font-medium opacity-15">BY SALMAN FARIS</div>
</footer>

<script>
(function(){
  const themes = ['Zero Excuses', 'Hard Truths', 'Full Focus', 'No Retreat', 'Pure Action'];
  const content = [
    "You know what must be done. You just hate the work. Your mind tells you to wait. It tells you to rest. These are lies. The hard path is the only way to become a man of value. Every day you waste makes the next day harder. Do the work now. Do not wait for a better mood. Your mood does not matter. Only your actions matter. Stick to the plan. Time is your only enemy. You have one thousand four hundred and forty minutes today. If you waste them, they never come back. Most people are weak and distracted. They choose comfort over growth. You must be different. Discipline is not a burden. It is the tool that sets you free. Be hard on yourself today so your future self can stand tall. Real strength is built when no one is looking. It is built in the early mornings and late nights. Success is not a gift. It is earned through sweat and pain. Stop looking for an easy way. There is no easy way. There is only the work. Do the boring work. Do it well. Do it every single day until it is done."
  ];

  const wrapWords = (text) => text.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0).map(s => `<span class="hi">${s.trim()}</span> `).join("");

  const updateClockAndStats = () => {
    const now = new Date();
    document.getElementById("d0").textContent = `DAY ${String(Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000)).padStart(3, "0")}`;
    const statsEl = document.getElementById('live-stats');
    if (statsEl) {
        const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
        const rem = 1440 - (now.getHours() * 60 + now.getMinutes());
        statsEl.innerHTML = `Time: ${timeStr} • ${rem} minutes remaining`;
    }
    document.getElementById("t0").textContent = `${now.toLocaleDateString("en-US",{month:"long"}).toUpperCase()} ${now.toLocaleDateString("en-US",{day:"2-digit"})} / ${now.getFullYear()}`;
  };

  const initVideos = () => {
    const list = document.getElementById('video-list');
    const fsOverlay = document.getElementById('fs-overlay');
    const fsVideo = document.getElementById('fs-video');
    const videoUrls = ["videos/1.mp4", "videos/2.mp4", "videos/3.mp4", "videos/4.mp4"];

    const openFS = (src) => {
        // 1. MUST be the first thing in the click stack for browsers to allow it
        fsVideo.src = src;
        fsVideo.load();
        
        // Immediate Fullscreen attempt
        const triggerFullscreen = (el) => {
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
            else if (el.webkitEnterFullscreen) el.webkitEnterFullscreen(); // iOS specific
        };

        fsOverlay.style.display = 'flex';
        
        // Play and Fullscreen
        fsVideo.play().then(() => {
            triggerFullscreen(fsVideo);
        }).catch((err) => {
            // If failed (maybe due to sound), mute and try again
            fsVideo.muted = true;
            fsVideo.play().then(() => triggerFullscreen(fsVideo));
        });

        requestAnimationFrame(() => {
          fsOverlay.classList.add('active');
        });
        
        document.body.style.overflow = 'hidden';
        window.history.pushState({ fs: true }, "");
    };

    const closeFS = () => {
        fsOverlay.classList.remove('active');
        fsVideo.pause();
        
        // Exit Fullscreen
        const exitFullscreen = () => {
            if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        };
        exitFullscreen();
        
        setTimeout(() => {
            fsOverlay.style.display = 'none';
            fsVideo.src = "";
            fsVideo.muted = false; // Reset for next time
        }, 150);
        document.body.style.overflow = '';
    };

    window.addEventListener('popstate', () => {
        if (fsOverlay.classList.contains('active')) closeFS();
    });

    fsOverlay.addEventListener('click', (e) => {
        // Prevent closing if clicking the video controls themselves
        if (e.target === fsOverlay) window.history.back();
    });

    // Close when exiting fullscreen via native button
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && fsOverlay.classList.contains('active')) {
            window.history.back();
        }
    });
    document.addEventListener('webkitfullscreenchange', () => {
        if (!document.webkitIsFullScreen && fsOverlay.classList.contains('active')) {
            window.history.back();
        }
    });

    videoUrls.forEach((url, index) => {
        const vWrap = document.createElement('div');
        vWrap.className = 'v-wrap z1';
        vWrap.innerHTML = `<div class="v-play-btn"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></div>`;
        vWrap.addEventListener('click', (e) => {
            e.preventDefault();
            openFS(url);
        });
        list.appendChild(vWrap);
    });
  };

  const init = () => {
    const now = new Date();
    const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
    const themeName = themes[dayOfYear % themes.length];
    document.getElementById("h0").innerHTML = `The <span class="text-white not-italic">${themeName}</span>`;
    
    document.getElementById("m0").innerHTML = `
      <div class="z1 full-width-text">
        <p class="font-f1 text-5xl md:text-8xl leading-[1.3]">${wrapWords(content[0])}</p>
      </div>
      <div class="py-24 text-center z1">
        <h2 class="font-f1 text-8xl md:text-[12rem] italic zb">${themeName.toUpperCase()}.</h2>
      </div>
    `;
    
    initVideos();
    updateClockAndStats();
    
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("za"); });
    }, { threshold: 0.05 });
    document.querySelectorAll(".z1").forEach(el => obs.observe(el));
  };

  window.addEventListener("scroll", () => {
    const scrollPos = window.scrollY;
    const nav = document.getElementById("n0");
    const hint = document.getElementById("sd");
    scrollPos > 10 ? nav.classList.add("zs") : nav.classList.remove("zs");
    if (hint) hint.style.opacity = scrollPos > 20 ? "0" : "1";
    
    const spans = document.querySelectorAll(".hi");
    const centerY = window.innerHeight * 0.5;
    spans.forEach(s => {
      const rect = s.getBoundingClientRect();
      const dist = Math.abs((rect.top + rect.height / 2) - centerY);
      s.classList.toggle("active", dist < window.innerHeight * 0.22);
    });
  }, { passive: true });

  window.onload = () => { init(); setInterval(updateClockAndStats, 1000); };
})();
</script>
</body>
</html>
