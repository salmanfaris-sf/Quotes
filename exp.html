<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P37159WTH1"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Quotes</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description" content="Forge an unbreakable mind. Obey Allah. Obey His Messenger. Be a man of your word. Don't waste time. Stay disciplined. Stay focused. This is the way.">
    <meta name="theme-color" content="#000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            user-select: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        ._f1 {
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        ._f1.v {
            opacity: 1;
        }

        ._c1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 600px;
            width: calc(100% - 48px);
            text-align: center;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform, opacity;
        }

        #_q_ {
            font-family: 'Inter', sans-serif;
            white-space: pre-wrap;
            margin-bottom: 12px; 
            color: #ffffff;
            display: inline-block;
            will-change: opacity;
            transition: opacity 0.35s ease-in-out;
            font-weight: 300;
            letter-spacing: -0.01em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            opacity: 0;
        }

        #_st_ {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #888888;
            font-weight: 400;
            letter-spacing: 0.03em;
            transition: opacity 0.35s ease;
            line-height: 1.6;
            margin-bottom: 4px;
            opacity: 0;
        }

        .nav-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: #525252; /* Premium dark grey */
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #_hint_ { 
            position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; 
            font-size: 10px; 
            color: #525252; /* Matching dark grey */
            text-transform: uppercase; 
            letter-spacing: 0.20em; 
            pointer-events: none; 
            font-weight: 500;
            opacity: 0; 
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Clean & Premium Top Center Text Indicator (No box) */
        #_popup_ {
            position: fixed;
            top: 32px; /* Positioned gracefully at the top center */
            left: 50%;
            transform: translate(-50%, 8px); /* Initial slide-up offset */
            color: #a3a3a3; /* Sophisticated medium-light grey */
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            white-space: nowrap;
            will-change: transform, opacity;
        }

        /* Slides upward gently and fades in */
        #_popup_.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* Transitions cleanly further upwards while fading out */
        #_popup_.fade-out-up {
            opacity: 0;
            transform: translate(-50%, -8px);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body>

    <!-- Minimalist Top Center Text Indicator -->
    <div id="_popup_">Autoplay on</div>

    <div class="_c1 _f1" id="_mc_">
        <h1 id="_q_" class="text-sm md:text-base lg:text-lg leading-relaxed tracking-wide"></h1>
        <div id="_st_"></div>
    </div>

    <div class="nav-hint hidden md:block">Tap / Swipe left or right to navigate</div>
    <div id="_hint_">Tap anywhere to view the next quote</div>

<script>
(function(){
    const _db = [
        { t: "Be better than you were yesterday." },
        { t: "Race one another in good deeds.\n(Qur'an 2:148)" },
        { t: "Don't waste time. You don't get it back." },
        { t: "Focus." },
        { t: "The problem is,\nyou think you have a lot of time to live." },
        { t: "Live everyday like it's your last day." },
        { t: "Consistency." },
        { t: "Big dreams need big sacrifices." },
        { t: "Practice makes perfect." },
        { t: "Do it even when you don't feel like it." },
        { t: "Nothing changes if nothing changes." },
        { t: "Stay different." },
        { t: "You only have 1,440 minutes every day,\ndon’t let a single one go to waste.", id: "t_q" },
        { t: "You can't have a million dollar dream with a minimum wage work ethic." },
        { t: "A real man protects and provides." },
        { t: "Don't follow the crowd. Follow the truth." },
        { t: "Never build your happiness on\n someone else's tears." },
        { t: "Eliminate the 'tomorrow' mindset today." },
        { t: "The strongest man is he who controls his anger." },
        { t: "Be a man of your word." },
        { t: "Your habits define your future self." },
        { t: "Hate Laziness." },
        { t: "Always speak the truth." },
        { t: "Time waits for no one." },
        { t: "Quality over quantity in everything." },
        { t: "Knowledge without action is useless." },
        { t: "Fear Allah. Not people." },
        { t: "Live with purpose." },
        { t: "A real man protects those who are vulnerable." },
        { t: "Every day is a second chance." },
        { t: "Now is the time." },
        { t: "Success is earned, not given." },
        { t: "Focus on your growth." },
        { t: "Stay Disciplined." },
        { t: "A heart connected to Allah is\n never truly broken." },
        { t: "He who is brave is free." },
        { t: "Growth begins outside comfort zones." },
        { t: "This is the way." },
        { t: "Hard days make strong people." },
        { t: "Keep showing up." },
        { t: "Strength is built through repetition." },
        { t: "Do the boring work well." },
        { t: "Consistency creates mastery." },
        { t: "Work now, Relax later." },
        { t: "Don't look back. You're not going that way."},
        { t: "Every day counts." },
        { t: "Habits decide outcomes." },
        { t: "Growth requires discomfort." },
        { t: "Sweat more in practice. Bleed less in war." },
        { t: "When you feel like nothing is going your way, look at a person breaking a rock. They can hit a big rock 100 times and it won’t even move. But with the hit at 101, it suddenly breaks into two pieces. It wasn’t just that last hit that broke it; it was the result of all the hits that happened before it." },
        { t: "It always seems impossible until it's done." },
        { t: "Focus is a superpower in a distracted world." },
        { t: "Weakness leaves when discipline enters." },
        { t: "Strength is built through patience." },
        { t: "Be strict with yourself." },
        { t: "Zero Excuses." },
        { t: "You already know what to do.\nYou just don’t like the cost." },
        { t: "The brain will invent reasons to avoid pain, even when pain is the only path forward." },
        { t: "Every wasted year makes the\n next one heavier." },
        { t: "Do it the moment you remember it." },
        { t: "Stick to the plan. Not your mood." },
        { t: "5  4  3  2  1\nTake action." },
        { t: "Indeed Shaytan is ever, to mankind,\na clear enemy.\n[Qur'an 17:53]"},
        { t: "Prophet Muhammad ﷺ said:\nThere are two blessings that many people are deceived into losing: health and free time.\n[Sahih al-Bukhari 6412]" },
        { t: "Prophet Muhammad ﷺ said:\nMake things easy for the people, and do not make it difficult for them.\n[Sahih al-Bukhari 6125]" },
        { t: "Prophet Muhammad ﷺ said:\nDo good deeds properly, sincerely and moderately.\n[Sahih al-Bukhari 6464]" },
        { t: "Prophet Muhammad ﷺ said:\nSpeak good or remain silent.\n[Riyad as-Salihin 1511]" },
        { t: "Prophet Muhammad ﷺ said:\nThe most beloved deed to Allah is the most regular and constant even if it were little.\n[Sahih al-Bukhari 6464]" },
        { t: "Character is who you are when no one is watching." },
        { t: "Keep moving forward." },
        { t: "If not now, Then when?" },
        { t: "Leave a legacy. Let your life be a story of courage, action, and impact." },
        { t: "NOW.\nWaiting won’t help.\nOverthinking won’t help.\nAction will.\nDo it." },
        { t: "Lower your gaze, guard your tongue, and protect your heart." },
        { t: "Your current life is the result of past actions. Your future will be the result of today's actions." },
        { t: "The man who keeps walking will eventually leave the place he hates." },
        { t: "A few years of sacrifice can create a lifetime of freedom." },
        { t: "Your future is built by what you do after a long tiring day." },
        { t: "Action may not always bring happiness, but there is no happiness without action." },
        { t: "Stand straight. Speak clearly. Fear none."},
        { t: "Its what's inside that matters." },
        { t: "Every pro was once a beginner."},
        { t: "Weak men wait for courage.\n Strong men create it through action."},
        { t: "Be the man who acts while others are still thinking."},
        { t: "Be so disciplined that even your bad days look like progress."},
        { t: "A strong man doesn’t need motivation.\nHe acts because he decided."},
        { t: "Pressure reveals the man within."}
    ];

    const _qx = document.getElementById('_q_');
    const _st = document.getElementById('_st_');
    const _mc = document.getElementById('_mc_');
    const _hint = document.getElementById('_hint_');
    const _popup = document.getElementById('_popup_');
    
    let _hintShown = false;
    let _initialized = false;
    
    let _l_i = null;
    let _startY = 0;
    let _startX = 0;
    let _currentY = 0;
    let _currentX = 0;
    let _isSwipe = false;

    // Autoplay states
    let _autoplayActive = false;
    let _autoplayTimeout = null;
    let _popupTimeout = null;

    // Long press states
    let _pressTimer = null;
    let _pressStartX = 0;
    let _pressStartY = 0;
    let _isLongPress = false;

    function _shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    let _currentPool = [];
    let _lastQuoteText = null;
    let _history = [];
    let _historyIndex = -1;

    function _getNextQuote() {
        if (_currentPool.length === 0) {
            let freshList = [..._db];
            _shuffle(freshList);
            if (freshList.length > 1 && freshList[freshList.length - 1].t === _lastQuoteText) {
                const head = freshList.pop();
                freshList.unshift(head);
            }
            _currentPool = freshList;
        }
        const choice = _currentPool.pop();
        _lastQuoteText = choice.t;
        return choice;
    }

    function _gs() {
        const n = new Date();
        let h = n.getHours();
        const m = n.getMinutes().toString().padStart(2, '0');
        const a = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        const e = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 23, 59, 59);
        const d = e - n;
        const ml = Math.floor(d / 60000);
        return { t: `${h}:${m} ${a}`, l: ml };
    }

    function _showQuote(nq) {
        _st.style.opacity = '0';
        if (_l_i) clearInterval(_l_i);

        _clearAutoplayTimer();

        _qx.style.transition = 'opacity 0.35s ease-in-out';
        _qx.style.opacity = '0';

        setTimeout(() => {
            _qx.innerText = nq.t;

            if (nq.id === "t_q") {
                const ux = () => {
                    const s = _gs();
                    _st.innerHTML = `Time: ${s.t} • ${s.l} minutes remaining today`;
                };
                ux();
                _st.style.opacity = '1';
                _l_i = setInterval(ux, 30000);
            } else {
                _st.innerHTML = "";
                _st.style.opacity = '0';
            }

            requestAnimationFrame(() => {
                _qx.style.transition = 'opacity 0.35s ease-in-out';
                _qx.style.opacity = '1';

                if (_autoplayActive) {
                    _startAutoplayTimer(nq);
                }
            });
        }, 350);
    }

    function _next() {
        if (!_hintShown) { 
            _hint.style.transition = 'opacity 0.3s ease';
            _hint.style.opacity = '0'; 
            _hintShown = true; 
        }
        if (_historyIndex < _history.length - 1) {
            _historyIndex++;
            _showQuote(_history[_historyIndex]);
        } else {
            const nq = _getNextQuote();
            _history.push(nq);
            _historyIndex = _history.length - 1;
            _showQuote(nq);
        }
    }

    function _prev() {
        if (_historyIndex > 0) {
            _historyIndex--;
            _showQuote(_history[_historyIndex]);
        }
    }

    function _startAutoplayTimer(quoteObj) {
        _clearAutoplayTimer();
        if (!_autoplayActive || !quoteObj) return;

        const wordsCount = quoteObj.t.split(/\s+/).length;
        const autoDelay = Math.min(22000, Math.max(4000, (wordsCount * 380) + 2000));

        _autoplayTimeout = setTimeout(() => {
            if (_autoplayActive) {
                _next();
            }
        }, autoDelay);
    }

    function _clearAutoplayTimer() {
        if (_autoplayTimeout) {
            clearTimeout(_autoplayTimeout);
            _autoplayTimeout = null;
        }
    }

    // Elegant rise and fade transition focused on top-center alignment
    function _showPopup(message) {
        if (_popupTimeout) clearTimeout(_popupTimeout);
        
        _popup.classList.remove('fade-out-up', 'visible');
        
        // Force layout engine reflow
        void _popup.offsetWidth; 

        _popup.innerText = message;
        _popup.classList.add('visible');

        _popupTimeout = setTimeout(() => {
            _popup.classList.add('fade-out-up');
            _popupTimeout = setTimeout(() => {
                _popup.classList.remove('visible', 'fade-out-up');
            }, 400); 
        }, 1600);
    }

    function _toggleAutoplay() {
        _autoplayActive = !_autoplayActive;
        if (_autoplayActive) {
            _showPopup("Autoplay on");
            _startAutoplayTimer(_history[_historyIndex]);
        } else {
            _showPopup("Autoplay off");
            _clearAutoplayTimer();
        }
    }

    function _startPress(x, y) {
        _pressStartX = x;
        _pressStartY = y;
        _isLongPress = false;

        _pressTimer = setTimeout(() => {
            _isLongPress = true;
            _toggleAutoplay();
        }, 600);
    }

    function _movePress(x, y) {
        if (Math.hypot(x - _pressStartX, y - _pressStartY) > 15) {
            _cancelPress();
        }
    }

    function _cancelPress() {
        if (_pressTimer) {
            clearTimeout(_pressTimer);
            _pressTimer = null;
        }
    }

    function _init() {
        if (_initialized) return;
        _initialized = true;

        const i = _getNextQuote();
        _history.push(i);
        _historyIndex = 0;
        
        _qx.innerText = i.t;
        _qx.style.opacity = '1';
        
        if (i.id === "t_q") {
            const s = _gs();
            _st.innerHTML = `Time: ${s.t} • ${s.l} minutes remaining today`;
            _st.style.opacity = '1';
        }

        requestAnimationFrame(() => {
            _mc.classList.add('v');
            
            setTimeout(() => {
                const navHint = document.querySelector('.nav-hint');
                if (navHint) navHint.style.opacity = '1'; 
                if (!_hintShown) {
                    _hint.style.opacity = '1';
                }
            }, 1200);
        });
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        _init();
    } else {
        document.addEventListener('DOMContentLoaded', _init);
        window.addEventListener('load', _init);
    }

    document.addEventListener('click', (e) => {
        if (_isSwipe) return;
        if (_isLongPress) {
            _isLongPress = false;
            return;
        }
        _next();
    });

    document.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        _startY = touch.clientY;
        _startX = touch.clientX;
        _currentY = _startY;
        _currentX = _startX;
        _isSwipe = false;

        _startPress(touch.clientX, touch.clientY);
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        _currentY = touch.clientY;
        _currentX = touch.clientX;

        _movePress(touch.clientX, touch.clientY);
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
        _cancelPress();

        const deltaX = _currentX - _startX;
        const deltaY = _currentY - _startY;

        if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY)) {
            _isSwipe = true;
            if (deltaX > 50) {
                _prev();
            } else if (deltaX < -50) {
                _next();
            }
        }

        if (_isSwipe) {
            setTimeout(() => {
                _isSwipe = false;
            }, 150);
        }
    }, { passive: true });

    document.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        _startPress(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', (e) => {
        _movePress(e.clientX, e.clientY);
    });

    document.addEventListener('mouseup', () => {
        _cancelPress();
    });

})();
</script>
</body>
</html>
