<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Salman Faris | Daily Wisdom</title>
  <link class="favicon" rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="Daily wisdom on discipline, focus, action, and personal growth.">
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            f1: ['"Cormorant Garamond"', 'serif'],
            f2: ['Inter', 'sans-serif']
          },
          colors: {
            c1: '#000000',
            c2: '#C5A059',
            eye: '#B8B8B0'
          }
        }
      }
    }
  </script>
  <style>
    html {
      background-color: #000000;
      scroll-behavior: smooth;
      overscroll-behavior-y: contain;
    }
    body {
      margin: 0;
      color: #d1d1d1;
      font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .z0 {
      transition: background-color .4s, backdrop-filter .4s, border-color .4s
    }
    .z0.zs {
      background-color: rgba(0, 0, 0, .85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, .08)
    }
    .z1 {
      opacity: 0;
      transform: translateY(40px);
      filter: blur(15px);
      transition: all 1.8s cubic-bezier(.16, 1, .3, 1)
    }
    .z1.za {
      opacity: 1;
      transform: none;
      filter: blur(0)
    }
    .zi {
      text-indent: 12rem
    }
    @media(max-width:768px) {
      .zi {
        text-indent: 0
      }
    }
    .zs1 {
      font-size: 11px;
      letter-spacing: .8em;
      text-transform: uppercase;
      font-family: Inter, sans-serif;
      opacity: 0.4;
      color: #fff
    }
    .zd {
      color: #C5A059;
      text-shadow: 0 0 15px rgba(197, 160, 89, 0.5)
    }
    @keyframes flash {
      0%,
      100% {
        opacity: 0.1
      }
      50% {
        opacity: 0.7
      }
    }
    .zf {
      animation: flash 2s ease-in-out infinite
    }
    #sd {
      transition: opacity 0.5s ease, visibility 0.5s
    }
    .hi {
      transition: color 0.6s ease, text-shadow 0.6s ease, opacity 0.6s ease;
      opacity: 0.15;
      color: #B8B8B0;
      display: inline-block
    }
    .hi.active {
      opacity: 1 !important;
      color: #fff !important;
      text-shadow: 0 0 25px rgba(255, 215, 120, 0.6) !important
    }
    .quote-container {
      width: 100%;
      max-width: 90vw;
      margin: 0 auto;
      text-align: center;
    }
    .quote-line {
      font-family: 'Inter', sans-serif;
      font-size: clamp(14px, 2.5vw, 20px);
      font-weight: 400;
      line-height: 1.6;
      color: #ffffff;
      opacity: 0.9;
      margin: 0;
    }
    .quote-stats {
      font-family: 'Inter', sans-serif;
      font-size: clamp(12px, 3vw, 18px);
      color: #ffffff;
      opacity: 0.5;
      margin-top: 15px;
      font-weight: 500;
    }
    .quote-wrapper {
      padding-top: 80px;
      padding-bottom: 40px;
    }
    footer {
      padding-top: 10px;
      padding-bottom: 40px;
      position: relative;
    }
    /* subtle glow for impactful words */
    .glow-word {
      display: inline-block;
      transition: all 0.3s ease;
    }
    .glow-word:hover {
      color: #C5A059;
      text-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
    }
    .theme-headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: clamp(1.8rem, 10vw, 5rem);
      color: #C5A059;
      text-shadow: 0 0 30px rgba(197, 160, 89, 0.15);
      opacity: 0.7;
      margin-bottom: 0.25em;
      line-height: 1.2;
    }
    @media (min-width: 768px) {
      .theme-headline {
        font-size: clamp(3rem, 12vw, 7rem);
      }
    }
  </style>
</head>
<body>
  <nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
    <div id="t0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium"></div>
    <div id="d0" class="text-white/90 text-[10px] uppercase tracking-[0.4em] font-f2 font-medium"></div>
  </nav>
  <main class="relative w-full">
    <section class="min-h-[85vh] flex flex-col items-center justify-center px-6 relative z-10 pt-24">
      <div class="text-center flex-grow flex flex-col justify-center items-center">
        <h1 id="h0" class="font-f1 text-[4.5rem] sm:text-[6.5rem] md:text-[9.5rem] not-italic tracking-tighter leading-none z1 text-white" style="transition-delay:0.2s"></h1>
      </div>
      <div id="sd" class="py-12 z1" style="transition-delay:0.8s">
        <div class="zs1 zf">Scroll Down</div>
      </div>
    </section>
    <article id="m0" class="max-w-screen-2xl mx-auto px-6 py-20 relative z-10 space-y-72"></article>
    <section class="relative z-10">
      <div class="z1 text-center px-6 quote-wrapper">
        <div class="quote-container pt-16">
          <p class="quote-line">You only have 1,440 minutes every day,</p>
          <p class="quote-line">don't let a single one go to waste.</p>
          <p id="live-stats" class="quote-stats"></p>
        </div>
      </div>
    </section>
  </main>
  <footer class="w-full flex justify-center px-6 relative z-10 z1">
    <div class="text-[9px] uppercase tracking-[0.8em] font-f2 text-white font-medium opacity-30">BY SALMAN FARIS</div>
  </footer>
  <script>
    (function() {
      // ——— MORE POWERFUL, INTERESTING QUOTES with multi-word thematic headings ———
      const data = [{
        theme: 'The Edge of Execution',
        paragraphs: [
          "The graveyard is the richest place on earth, full of books never written, companies never built, and lives never lived. Do not join them.",
          "Success is not a product of luck; it is a violent collision between preparation and relentless execution."
        ]
      }, {
        theme: 'The Iron Price of Discipline',
        paragraphs: [
          "Discipline is the bridge between goals and accomplishment. If you aren't paying the toll daily, you aren't crossing.",
          "Your emotions are irrelevant. If you only move when you feel like it, you are a slave to your own biology."
        ]
      }, {
        theme: 'The Architecture of Vision',
        paragraphs: [
          "If you don't build your own dream, someone will hire you to help build theirs. Decide who you are working for.",
          "Most people overestimate what they can do in a day but drastically underestimate what they can do in a decade. Play the long game."
        ]
      }, {
        theme: 'The Weight of Responsibility',
        paragraphs: [
          "You are 100% responsible for your current position in life. Blaming the system, the economy, or your parents is a strategy for the weak.",
          "When you stop complaining, you start winning. Energy spent on excuse-making is energy stolen from your output."
        ]
      }, {
        theme: 'The Art of Relentless Focus',
        paragraphs: [
          "You can do anything, but you cannot do everything. To say yes to the mission, you must say no to a thousand distractions.",
          "Deep work is the new IQ. While the world fights for attention, you must fight for concentration."
        ]
      }, {
        theme: 'The Forge of Growth',
        paragraphs: [
          "The moment you stop learning, you start dying. A mind that refuses to be stretched will eventually reach its breaking point.",
          "If you are the smartest person in the room, you are in the wrong room. Seek environments that intimidate you into excellence."
        ]
      }, {
        theme: 'The Fire of Ambition',
        paragraphs: [
          "Mediocrity is a death sentence. To be average in a world of opportunity is a choice, not a circumstance.",
          "Do not lower your price to make others feel better about their lack of value. Demand excellence from yourself and settle for nothing less."
        ]
      }, {
        theme: 'The Altar of Sacrifice',
        paragraphs: [
          "Greatness demands a sacrifice that most people are unwilling to pay. They want the result, but they hate the process.",
          "What you lose on the way to the top is the price of admission. Ensure the exchange is worth it."
        ]
      }, {
        theme: 'The Brutal Truth of Reality',
        paragraphs: [
          "The world does not care about your intentions; it only cares about your results. Deliver value or get replaced.",
          "Stop trying to be liked. Start trying to be respected. The former is easy, the latter is earned through relentless performance."
        ]
      }, {
        theme: 'The Warrior’s Courage',
        paragraphs: [
          "Fear is just a physiological reaction to something that hasn't happened yet. Walk through it until it becomes boring.",
          "The greatest risk is not taking any risks at all. In a world that is changing rapidly, the only strategy that is guaranteed to fail is not moving."
        ]
      }, {
        theme: 'The Anatomy of Resilience',
        paragraphs: [
          "It’s not about how hard you hit. It’s about how hard you can get hit and keep moving forward. That’s how winning is done.",
          "Fall down seven times, stand up eight. Your comeback is always stronger than your setback."
        ]
      }, {
        theme: 'The Obsession of Mastery',
        paragraphs: [
          "Amateurs practice until they get it right; professionals practice until they can't get it wrong. Mastery is a maniacal pursuit.",
          "The only way to be irreplaceable is to be so skilled that your absence creates a vacuum. Become the standard."
        ]
      }, {
        theme: 'The Shadow of Legacy',
        paragraphs: [
          "What you leave behind is not what is engraved in stone monuments, but what is woven into the lives of others.",
          "Build something that outlasts you. A life without legacy is a life without meaning."
        ]
      }, {
        theme: 'The Fortress of Mindset',
        paragraphs: [
          "The mind is everything. What you think you become. Guard your thoughts like a fortress.",
          "Limitations live only in our minds. If you can conceive it and believe it, you can achieve it."
        ]
      }, {
        theme: 'The Fury of Action',
        paragraphs: [
          "Inaction breeds doubt and fear. Action breeds confidence and courage. If you want to conquer fear, do not sit and think about it.",
          "The path to success is to take massive, determined action. Dreams remain dreams until you give them legs."
        ]
      }];

      const wrapWords = (text) => {
        // split by punctuation + space, keep punctuation
        return text.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0)
          .map(s => `<span class="hi">${s.trim()}</span>`)
          .join(" ");
      };

      const updateClockAndStats = () => {
        const now = new Date();
        const day = now.getDate();
        const month = now.toLocaleDateString("en-US", { month: 'long' }).toUpperCase();
        const year = now.getFullYear();
        document.getElementById("d0").textContent = `${day} ${month} ${year}`;
        const start = new Date(now.getFullYear(), 0, 0);
        const diff = now - start;
        const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById("t0").textContent = `DAY ${dayOfYear}`;
        const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        const remaining = 1440 - (now.getHours() * 60 + now.getMinutes());
        const statsEl = document.getElementById('live-stats');
        if (statsEl) statsEl.textContent = `Time: ${timeStr} • ${remaining} minutes remaining today`;
      };

      const init = () => {
        const startOfYear = new Date(new Date().getFullYear(), 0, 1);
        const today = new Date();
        const dayOfYear = Math.floor((today - startOfYear) / (1000 * 60 * 60 * 24));
        const item = data[dayOfYear % data.length];

        // set the main heading – now a multi-word, evocative phrase
        document.getElementById("h0").textContent = item.theme;

        // build the article with a thematic headline above each quote
        document.getElementById("m0").innerHTML = `
            <div class="z1 text-center mb-8">
              <div class="theme-headline">${item.theme}</div>
            </div>
            <div class="z1"><p class="font-f1 text-6xl sm:text-8xl md:text-[8.5rem] leading-[1.05] zi">${wrapWords(item.paragraphs[0])}</p></div>
            <div class="z1"><p class="font-f1 text-6xl sm:text-8xl md:text-[8.5rem] leading-[1.05]">${wrapWords(item.paragraphs[1])}</p></div>
          `;

        updateClockAndStats();

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) e.target.classList.add("za");
          });
        }, { threshold: 0.05 });
        document.querySelectorAll(".z1").forEach(el => observer.observe(el));
      };

      // scroll highlight
      window.addEventListener("scroll", () => {
        const s = window.scrollY;
        const nav = document.getElementById("n0");
        if (nav) nav.classList.toggle("zs", s > 10);
        const sd = document.getElementById("sd");
        if (sd) sd.style.opacity = s > 20 ? "0" : "1";

        const spans = document.querySelectorAll(".hi");
        let active = null,
          min = Infinity;
        spans.forEach(span => {
          const rect = span.getBoundingClientRect();
          const dist = Math.abs((rect.top + rect.height / 2) - (window.innerHeight * 0.5));
          if (dist < min) { min = dist;
            active = span; }
        });
        spans.forEach(span => {
          if (span === active && min < window.innerHeight * 0.4) {
            span.classList.add("active");
          } else {
            span.classList.remove("active");
          }
        });
      }, { passive: true });

      window.onload = () => {
        init();
        setInterval(updateClockAndStats, 1000);
      };
    })();
  </script>
</body>
</html>
