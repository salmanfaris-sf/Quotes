<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#000000">
<title>Salman Faris | Daily Wisdom</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1K1TKBQFFK"></script>

<meta name="description" content="Raw thoughts on discipline, focus, and the hard path.">
<meta name="author" content="Salman Faris">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#000000',c2:'#C5A059',eye:'#B8B8B0'}
    }
  }
}
</script>
<style>
html, body { 
  background-color: #000000; 
  scroll-behavior: auto; 
  overflow-x: hidden;
  width: 100%;
  position: relative;
  touch-action: pan-y; 
}

body { margin: 0; color: #d1d1d1; font-smoothing: antialiased; }

/* Loader styles */
#loader-screen {
  background-color: #000000;
  z-index: 100;
}

.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.z1{opacity:0;transform:translateY(40px);filter:blur(15px);transition:all 1.8s cubic-bezier(.16,1,.3,1)}
.z1.za{opacity:1;transform:translateY(0);filter:blur(0)}

.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}

.zs1{font-size:11px;letter-spacing:.8em;text-transform:uppercase;font-family:Inter,sans-serif;opacity:0.4;color:#fff}
.zb{color:#C5A059;opacity:0.9;text-shadow:0 0 30px rgba(197,160,89,0.3)}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,0.5)}
@keyframes flash{0%,100%{opacity:0.1}50%{opacity:0.7}}
.zf{animation:flash 2s ease-in-out infinite}
#sd{transition:opacity 0.5s ease,visibility 0.5s}

.hi{transition:color 0.6s ease,text-shadow 0.6s ease,opacity 0.6s ease;opacity:0.15;color:#B8B8B0;display:inline-block}
.hi.active{opacity:1 !important;color:#fff !important;text-shadow:0 0 15px rgba(255,255,255,0.4) !important}

.quote-container { width: 100%; max-width: 90vw; margin: 0 auto; text-align: center; }
.quote-line { font-family: 'Inter', sans-serif; font-size: clamp(12px, 3.8vw, 17px); font-weight: 400; line-height: 1.5; color: #ffffff; opacity: 0.9; margin: 0; }
.quote-stats { font-family: 'Inter', sans-serif; font-size: clamp(10px, 3vw, 14px); color: #ffffff; opacity: 0.5; margin-top: 10px; font-weight: 500; }

.quote-wrapper { padding-top: 100px; padding-bottom: 60px; }
footer { padding-top: 10px; padding-bottom: 40px; }
</style>
</head>
<body oncontextmenu="return false;" class="overflow-hidden">

<!-- Apple-Style Premium Loading Screen -->
<div id="loader-screen" class="fixed inset-0 flex flex-col items-center justify-center transition-opacity duration-1000 ease-in-out">
  <div class="w-40 flex flex-col items-center gap-8">
    <!-- Clean Minimalist Apple-like breathing dot indicator -->
    <div class="w-4 h-4 rounded-full bg-white opacity-80 animate-pulse"></div>
    <!-- Thin progress bar container -->
    <div class="w-full h-[2px] bg-neutral-900 rounded-full overflow-hidden">
      <div id="loader-progress" class="h-full w-0 bg-white rounded-full transition-all duration-300 ease-out"></div>
    </div>
  </div>
</div>

<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <!-- Left: Month and Year (Crisp pure white) -->
  <div id="d0" class="text-white/90 text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">LOADING...</div>
  <!-- Right: Day of the Week (Dynamic gold accent color) -->
  <div id="t0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">LOADING...</div>
</nav>

<main class="relative w-full">
  <section class="h-screen flex flex-col items-center justify-center px-6 relative z-10">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <!-- Massive typographic scale restored -->
      <h1 id="h0" class="font-f1 text-9xl md:text-[16rem] italic tracking-tighter leading-tight md:leading-none z1" style="transition-delay:0.2s"></h1>
    </div>
    <div id="sd" class="pb-40 md:pb-24 z1" style="transition-delay:0.8s">
      <div class="zs1 zf">Scroll Down</div>
    </div>
  </section>

  <article id="m0" class="max-w-screen-2xl mx-auto px-6 pt-40 pb-20 relative z-10 space-y-72"></article>

  <section class="relative z-10">
    <div class="z1 text-center px-6 quote-wrapper">
        <div class="quote-container border-t border-white/5 pt-16">
            <p class="quote-line">You only have 1,440 minutes every day,</p>
            <p class="quote-line">don't let a single one go to waste.</p>
            <p id="live-stats" class="quote-stats"></p>
        </div>
    </div>
  </section>
</main>

<footer class="w-full flex justify-center px-6 relative z-10 z1">
  <div class="text-[9px] uppercase tracking-[0.8em] font-f2 text-white font-medium opacity-30">BY SALMAN FARIS</div>
</footer>

<script>
(function(){
  // 15 Simple, raw, masculine daily titles
  const themes = [
    'Pure Action', 'Iron Will', 'Zero Delay', 'No Regret', 'Fast Work',
    'Hard Labor', 'Heavy Work', 'Big Drive', 'Cold Focus', 'Run Ahead',
    'Hard Pace', 'Start Now', 'Full Work', 'No Excuses', 'Real Force'
  ];
  
  // 15 sets of quotes using simple, action-oriented, direct English words
  const content = [
    [
      "You know what you must do. You just do not want to start. Your mind begs you to rest. It tells you to wait. These are all lies. The hard path is the only way to be strong. Do not wait for a good mood. Your mood does not matter. Only your work matters. Get up and do it now.",
      "Time is passing very fast. You have only one thousand four hundred and forty minutes today. If you waste them, they never come back. Most people are weak. They choose easy things. You must be different. Hard work is what makes you free. Be hard on yourself today so you can stand tall tomorrow.",
      "Real power is built when you are alone. It is built in the early mornings and late nights. Success is not a gift. You must earn it with sweat. Stop looking for an easy way. There is no easy way. There is only the work. Do the boring work. Do it every single day until it is done."
    ],
    [
      "Nothing changes if you do nothing. You cannot have big dreams but do small work. Your daily habits show who you really are. If you cannot control yourself, you cannot control your life. Stop talking about what you want to do. Start doing it now. Hate being lazy. Stand straight and work.",
      "What you know is nothing if you do not act. Fear nothing but a wasted life. Live with a clear goal. A real man protects his home. He works for the people he loves. He does not follow the crowd. He does not look back. The time to start is right now.",
      "When life gets hard, do not quit. Think of a man breaking a rock. He hits it a hundred times and nothing happens. On the next hit, it breaks. It was not just the last hit. It was all the hits before it. This is how success works. Every small step counts. Keep hitting the rock."
    ],
    [
      "Waiting will not save you. Thinking too much will only slow you down. Action is the only answer. Stop looking at things that distract you. Guard your mind from weak thoughts. Your life today is what you did yesterday. Your life tomorrow is what you do right now. Do the work.",
      "The man who keeps walking will win. A few years of hard work can give you a lifetime of power. But you must pay the price today. Speak less. Do more. Let your work make the noise. Fear no man. Only fear wasting the life you were given. This is the way.",
      "Every single second is a war against your own weakness. You must win this war. Do not let your family down. Be the one who changed the path of your name. Hard work is how you love yourself. Stop making excuses. Get up and get to work right now."
    ],
    [
      "If you let your feelings stop you, you have already lost. Your mind wants to keep you safe and comfortable. Your destiny demands fight, sweat, and tears. Stop talking to your weak side. When the alarm rings, your feet must touch the floor before you can make an excuse.",
      "The world is full of people who only watch and talk. Be the one who actually does the work. Do not take the easy road. Every easy choice makes you weak. If you cannot control your own body and your own time, you will never control your own life. Demand more from yourself.",
      "Look at your family. You carry their name. Do not make them ashamed of you by being average. You are the one who must build the future. Stand up, carry the heavy weight, and do your duty without complaining. Move forward and do not stop."
    ],
    [
      "A master does not wait for a beautiful day. He works in the mud, the cold, and the dark. You are waiting for a perfect day that will never come. The world will never be quiet. Your mind will never be fully ready. Do the hard work anyway.",
      "No one is coming to save you. No one will do the work for you. You are completely alone in this room. Accept this and feel free. You are the only one who can change your life. Build your own home block by block, every day, without fail.",
      "Being comfortable makes you weak. The moment you are happy with what you did yesterday is the moment you stop growing. Treat every win as a new start. Keep climbing because the climb is what makes you a real man. The work itself is the prize."
    ],
    [
      "Shut your mouth and let your work show. A man who talks about what he will do has done nothing yet. True power is quiet. Work in the dark. When you tell people your plans, you waste the energy you need to fight. Work hard, stay hidden, and show only results.",
      "You do not need to read more. You do not need more advice. You just need to start. You have enough thoughts in your head. Now use them. The path is simple, but you make it hard so you do not have to feel the pain of starting. Break the chain and move.",
      "A quiet life of big work is better than a loud life of zero results. Let others chase cheap attention. You belong to the old way of hard work, daily struggle, and finishing what you start. Do not talk. Do not promise. Just do the work."
    ],
    [
      "Do not complain about results you did not get from work you did not do. If you do not like your life, change it. If you want a strong body, build it. If you want a sharp mind, train it. Pain is not a sign to stop; it is a sign to grow. Use it and go faster.",
      "The biggest wins are won in the boring days of doing the same thing. The fun of a new goal always fades in a few days. What is left is pure discipline. If you can love the boring daily work, you will be unstoppable. Doing it again and again is how you win.",
      "Make your choice once, then never argue with yourself. If you said you would wake up at dawn, do not debate it when you open your eyes. The debate is where weakness wins. Be a soldier to your own plan. Your mind makes the map; your body must run it."
    ],
    [
      "Fear is the map that shows you where to go. If a task makes you scared, it is the exact task you must do. Do not run from the hard thing. Step right into the storm. The man who stays safe his whole life never knows how strong he is. Break the wall.",
      "Every distraction you allow to take your mind is a vote against your future. Guard your time like a king guards his crown. The world wants to keep you weak, distracted, and small. Turn off the noise, close the screens, and get to work.",
      "When the day ends, ask yourself: Did I go forward or did I slide back? There is no standing still. Every choice builds your house or burns it down. Be honest with yourself. If you failed today, own it, feel the sting, and get ready to work tomorrow."
    ],
    [
      "You are defined by what you allow. If you allow yourself to delay, to do half work, and to leave things unfinished, your life will be a mess. Raise your standards today. Demand the best effort from yourself before you ask anything from others. Start now.",
      "Stop looking for motivation. It is a fake friend that leaves when the day gets cold. Rely only on discipline. Discipline is the heavy coat that keeps you warm in the deep winter. It is what forces you to work when you absolutely hate it.",
      "Your life is ticking away. Every breath you take is a moment you will never get back. How can you waste hours looking at a phone screen? Wake up to the truth that you will die. Use your short time to build something real."
    ],
    [
      "The path to success is just doing the work day after day. You will fail, you will make mistakes, and you will fall. But the strong get back up fast. Do not spend three days feeling bad about one bad day. Clean your face and get back in the fight.",
      "Stay away from soft, lazy, aimless people. Their weakness will spread to you. Stay near people who demand your best and tell you the truth. If you are the hardest worker in your group, find a new group. Find giants who force you to grow.",
      "Your life is your own job. No one will carry your bags or do your work for you. Stop blaming your past, your parents, or your bad luck. The cards you have are the cards you must play. Play them like a master. Outwork your doubts until you win."
    ],
    [
      "While the rest of the world is sleeping and resting, you have a chance to win. The quiet hours of the night are your best time. Use this time to outwork everyone, to study, and to build. No notifications, no screens, just pure hard work.",
      "Do not let your tired body make your mind a coward. Your brain will tell you that you have done enough. It will tell you to finish the work tomorrow. This is the moment. Push for one more hour. This is how you separate yourself from the crowd.",
      "Night work is not about pain; it is about choosing your future over today's comfort. You are trading cheap fun for real freedom. Keep your head down, shut out the world, and let your results show when the morning comes."
    ],
    [
      "A strong mind cannot be distracted or stopped. You must build a fort in your own head that nothing can shake. When everything is crazy around you, stay calm, look at the facts, and do the next task. This is real power.",
      "Stop looking for praise from people you do not respect. Their words are empty. The only thing that matters is what you see in the mirror at the end of the day. Did you do the work you promised to do? If yes, be proud. If no, fix it.",
      "Your ego is your worst enemy. It wants to believe you are already great and that you do not need to work. Kill your ego every morning. Remain a student, stay hungry, and do the heavy work that others think they are too important to do."
    ],
    [
      "Keep the fire burning hot inside you, even when the wind is cold. There will be hard times when nothing goes right and every step is a fight. This is your test. Your fire must not need others to feed it. Burn your own fuel. Keep working.",
      "Your potential is a debt you owe to yourself. If you die without seeing what you can do, you have lived a wasted life. Do not rob yourself of the chance to see how strong you can be. Push your limits every single day.",
      "The difference between a wish and a goal is action. Stop wishing for a better body, a stronger mind, or a better life. Write down the daily work, and do it without fail. A goal without work is just a dream. Get up and do it."
    ],
    [
      "In the deepest quiet, you find the real plan for your life. People hate silence because it forces them to see their own failures. Do not run. Sit with your quiet mind, look at your progress, and listen to the voice that tells you what to do next.",
      "Noise is the ultimate distraction. Cut out the useless inputs. You do not need to know every news story, every trend, or every online fight. Focus completely on the work in front of you. Simplify your life so you can do more work.",
      "The most dangerous man is the one who says nothing but always does the work. He does not waste words trying to look good. He is watching, learning, and taking action. Be quiet and let your work make the noise."
    ],
    [
      "Forge your character like a hammer shapes hot metal. It takes heat, pressure, and hard blows. Do not run from the hard moments in life; they are what shape you into a strong man. Welcome the struggle. It is the only way to build steel.",
      "Your work ethic is your only real safety in this world. Money can be lost, but your drive remains yours forever. Guard your daily habits with your life. Never take the easy road. Stand firm, do the work, and be proud of your effort.",
      "You will not remember the days you spent sleeping and resting. You will remember the times you were tired, wanted to quit, but kept working anyway. These are the moments that build your soul. Give your future self a story of victory."
    ]
  ];

  // Helper to wrap sentences inside individual high-contrast fading interactive span blocks
  const wrapWords = (text) => text.split(/\.\s*/).filter(s => s.trim().length > 0).map(s => `<span class="hi">${s.trim()}.</span> `).join("");

  // Update clock dynamically & handle premium bottom countdown stats
  const updateClockAndStats = () => {
    const now = new Date();
    
    // Left navbar: Month & Year (Clean crisp white)
    const month = now.toLocaleDateString("en-US", { month: "long" }).toUpperCase();
    const year = now.getFullYear();
    document.getElementById("d0").textContent = `${month} ${year}`;
    
    // Right navbar: Day of the Week (Dynamic gold accent color)
    const weekday = now.toLocaleDateString("en-US", { weekday: "long" }).toUpperCase();
    document.getElementById("t0").textContent = weekday;

    // Time & Remaining Minutes calculations
    const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const totalMinutesInDay = 1440;
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const remainingMinutes = totalMinutesInDay - currentMinutes;
    
    const statsEl = document.getElementById('live-stats');
    if (statsEl) { 
      statsEl.textContent = `Time: ${timeStr} • ${remainingMinutes} minutes remaining today`; 
    }
  };

  const init = () => {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start + (start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000;
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    
    // Calculate rotational offsets so heading matches content in unique daily permutations
    const themeIndex = dayOfYear % themes.length;
    const contentIndex = dayOfYear % content.length;
    
    const activeTheme = themes[themeIndex];
    const activeParagraphs = content[contentIndex];

    // Set Main Hero Title (Massive size preserved)
    document.getElementById("h0").innerHTML = `The <span class="text-white not-italic">${activeTheme}</span>`;
    
    // Populate the Body Content with illuminated sentence splits
    document.getElementById("m0").innerHTML = `
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(activeParagraphs[0])}</p></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05]">${wrapWords(activeParagraphs[1])}</p></div>
      <div class="py-24 text-center z1"><h2 class="font-f1 text-8xl md:text-[12rem] italic zb">${activeTheme.toUpperCase()}.</h2></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(activeParagraphs[2])}</p></div>
    `;
    
    updateClockAndStats();
    
    // Smooth visibility revealing handler on scroll (IntersectionObserver)
    const generalObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { 
        if (entry.isIntersecting) {
          entry.target.classList.add("za"); 
        }
      });
    }, { threshold: 0.05 });
    
    document.querySelectorAll(".z1").forEach(el => generalObserver.observe(el));
  };

  window.addEventListener("scroll", () => {
    const scrollPos = window.scrollY;
    const nav = document.getElementById("n0");
    const scrollHint = document.getElementById("sd");
    
    // Dynamic Navbar visual blur toggle
    scrollPos > 10 ? nav.classList.add("zs") : nav.classList.remove("zs");
    if (scrollHint) { 
      scrollHint.style.opacity = scrollPos > 20 ? "0" : "1"; 
    }
    
    // Progressive Sentence Lighting Engine
    const spans = document.querySelectorAll(".hi");
    const centerY = window.innerHeight * 0.5;
    let activeSpan = null;
    let minDistance = Infinity;
    
    spans.forEach(span => {
      const rect = span.getBoundingClientRect();
      const dist = Math.abs((rect.top + rect.height / 2) - centerY);
      if (dist < minDistance) { 
        minDistance = dist; 
        activeSpan = span; 
      }
    });
    
    spans.forEach(span => {
      if (span === activeSpan && minDistance < window.innerHeight * 0.4) {
        span.classList.add("active");
      } else {
        span.classList.remove("active");
      }
    });
  }, { passive: true });

  // Intelligent Premium Apple-like Loading Sequence
  const startLoadingAnimation = () => {
    const progressEl = document.getElementById("loader-progress");
    const loaderScreen = document.getElementById("loader-screen");
    let progress = 0;

    // Simulate steady incremental loading
    const interval = setInterval(() => {
      if (progress < 85) {
        progress += Math.floor(Math.random() * 8) + 2;
        progressEl.style.width = `${Math.min(progress, 85)}%`;
      }
    }, 100);

    const finishLoading = () => {
      clearInterval(interval);
      progressEl.style.width = "100%";
      
      setTimeout(() => {
        // Fade loader screen away smoothly
        loaderScreen.style.opacity = "0";
        loaderScreen.style.pointerEvents = "none";
        
        // Restore page scrolling functionality once completely loaded
        document.body.classList.remove("overflow-hidden");
        
        // Initialize resources
        init();
        
        // Trigger scroll event manually to compute dynamic active states
        setTimeout(() => { 
          window.dispatchEvent(new Event('scroll')); 
          loaderScreen.remove(); // Remove loader entirely from DOM once done
        }, 150);
      }, 500);
    };

    if (document.readyState === "complete") {
      finishLoading();
    } else {
      window.addEventListener("load", finishLoading);
    }
  };

  window.onload = () => {
    startLoadingAnimation();
    setInterval(updateClockAndStats, 1000);
  };
})();
</script>
</body>
</html>
