<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Salman Faris | Daily Wisdom</title>
<link class="favicon" rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Daily wisdom on discipline, focus, action, and personal growth.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#000000',c2:'#C5A059',eye:'#B8B8B0'}
    }
  }
}
</script>
<style>
html { background-color: #000000; scroll-behavior: smooth; overscroll-behavior-y: contain; }
body { margin: 0; color: #d1d1d1; font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.z1{opacity:0;transform:translateY(40px);filter:blur(15px);transition:all 1.8s cubic-bezier(.16,1,.3,1)}
.z1.za{opacity:1;transform:none;filter:blur(0)}
.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}
.zs1{font-size:11px;letter-spacing:.8em;text-transform:uppercase;font-family:Inter,sans-serif;opacity:0.4;color:#fff}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,0.5)}
@keyframes flash{0%,100%{opacity:0.1}50%{opacity:0.7}}
.zf{animation:flash 2s ease-in-out infinite}
#sd{transition:opacity 0.5s ease,visibility 0.5s}
.hi{transition:color 0.6s ease,text-shadow 0.6s ease,opacity 0.6s ease;opacity:0.15;color:#B8B8B0;display:inline-block}
.hi.active{opacity:1 !important;color:#fff !important;text-shadow:0 0 15px rgba(255,255,255,0.4) !important}
.quote-container { width: 100%; max-width: 90vw; margin: 0 auto; text-align: center; }
.quote-line { font-family: 'Inter', sans-serif; font-size: clamp(14px, 2.5vw, 20px); font-weight: 400; line-height: 1.6; color: #ffffff; opacity: 0.9; margin: 0; }
.quote-stats { font-family: 'Inter', sans-serif; font-size: clamp(12px, 3vw, 18px); color: #ffffff; opacity: 0.5; margin-top: 15px; font-weight: 500; }
.quote-wrapper { padding-top: 100px; padding-bottom: 60px; }
footer { padding-top: 10px; padding-bottom: 40px; position: relative; }
</style>
</head>
<body>
<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <div id="t0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium"></div>
  <div id="d0" class="text-white/90 text-[10px] uppercase tracking-[0.4em] font-f2 font-medium"></div>
</nav>
<main class="relative w-full">
  <section class="min-h-[85vh] flex flex-col items-center justify-center px-6 relative z-10 pt-24">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <h1 id="h0" class="font-f1 text-[4.5rem] sm:text-[6.5rem] md:text-[9.5rem] not-italic tracking-tighter leading-none z1 text-white" style="transition-delay:0.2s"></h1>
    </div>
    <div id="sd" class="py-12 z1" style="transition-delay:0.8s">
      <div class="zs1 zf">Scroll Down</div>
    </div>
  </section>
  <article id="m0" class="max-w-screen-2xl mx-auto px-6 py-20 relative z-10 space-y-72"></article>
  <section class="relative z-10">
    <div class="z1 text-center px-6 quote-wrapper">
        <div class="quote-container pt-16">
            <p class="quote-line">You only have 1,440 minutes every day,</p>
            <p class="quote-line">don't let a single one go to waste.</p>
            <p id="live-stats" class="quote-stats"></p>
        </div>
    </div>
  </section>
</main>
<footer class="w-full flex justify-center px-6 relative z-10 z1">
  <div class="text-[9px] uppercase tracking-[0.8em] font-f2 text-white font-medium opacity-30">BY SALMAN FARIS</div>
</footer>
<script>
(function(){
  const data = [
    { theme: 'Take Action', paragraphs: ["Stop thinking and just start. Waiting for the perfect time will never help you.", "Do not wait. Count to three and start right now. Getting things done is the best way to live."] },
    { theme: 'Stay Active', paragraphs: ["Being too comfortable makes you weak. Get up and move your body.", "The longer you wait to start, the harder it becomes. Do your most difficult task first."] },
    { theme: 'Value Time', paragraphs: ["You get 1,440 minutes every day. Once they are gone, you cannot get them back.", "Be careful with your time. Do not use it on small things. Focus only on your main goals."] },
    { theme: 'No Fear', paragraphs: ["What others think of you does not matter. Do not make your dreams smaller just to please people.", "Fear is just a thought. Step forward and you will see that it disappears."] },
    { theme: 'Work Hard', paragraphs: ["Dreams mean nothing without real work. Success comes from trying every single day.", "Wake up with a plan. While others are sleeping, you should be working on your future."] },
    { theme: 'Stay Focused', paragraphs: ["You cannot do everything at once. Pick one thing and give it all your attention.", "Turn off your phone and block out the noise. Your focus is your strongest tool."] },
    { theme: 'Be Consistent', paragraphs: ["Do not rely on feeling motivated. Just do the work because it needs to be done.", "Show up even when you are tired. That is how you build a strong character."] },
    { theme: 'Set Goals', paragraphs: ["If you do not know where you are going, you will be lost. Decide what you want and write it down.", "Do not be afraid to set big goals. They force you to grow and do your best."] },
    { theme: 'Stay Confident', paragraphs: ["Doubt comes when you do nothing. The only way to stop doubting is to do your work.", "Your mind will find reasons to quit when you are lazy. Start moving and the doubts will go away."] },
    { theme: 'Move Forward', paragraphs: ["Stop looking at the past. Forget your old bad habits and focus on what is ahead.", "When you know there is no way back, you will find a way forward. Keep going."] },
    { theme: 'No Excuses', paragraphs: ["Your life is the result of your choices, not your luck. Stop blaming other people.", "You are the only one who can do the work. Take responsibility for your results today."] },
    { theme: 'Stay Tough', paragraphs: ["Being too comfortable makes you soft. Do something difficult every single day.", "Train your mind to handle struggle. When things get hard, you will be ready."] },
    { theme: 'Give Your Best', paragraphs: ["Do not do things halfway. If you start, give it your full effort.", "Work with energy. Put your heart into everything you do and finish strong."] },
    { theme: 'Move On', paragraphs: ["Learn from mistakes and leave the regret behind. You cannot change yesterday.", "Stop looking backward. Correct your path and keep walking. Focus on what you can do right now."] },
    { theme: 'Keep Trying', paragraphs: ["People might doubt you, but just keep showing them your results.", "If you get knocked down, get up again. Your persistence is more important than their opinions."] },
    { theme: 'Start Now', paragraphs: ["Waiting is the biggest mistake you can make. When you pause, you lose time.", "Make a decision and start. It is better to start and learn than to wait for perfection."] },
    { theme: 'Be Strong', paragraphs: ["Do not wait for others to join you. Trust your own path.", "It is better to walk alone in the right direction than to follow others who are lost."] },
    { theme: 'Win The Day', paragraphs: ["Control your schedule instead of letting it control you. Have a plan for your day.", "Win your morning and you win your day. Finish your biggest task first."] },
    { theme: 'Set High Standards', paragraphs: ["Never settle for average. How you do one thing is how you do everything.", "Ask more of yourself than anyone else does. Quality is a habit, not an accident."] },
    { theme: 'Keep Going', paragraphs: ["A slow start is okay, but keep moving. Build your rhythm day by day.", "Start fast and finish faster. Don't let your energy drop. Keep moving to the next task."] },
    { theme: 'Self Control', paragraphs: ["You are in charge of your own choices. Learn to say no to things that do not help you.", "Controlling your urges is the path to real power. Master your own mind."] },
    { theme: 'Stay True', paragraphs: ["Do not lower your standards to make others happy. Keep your quality high.", "Protect your energy. Walk away from gossip and waste. Focus on growth."] },
    { theme: 'Move Fast', paragraphs: ["The world moves quickly. Stop thinking and start doing. Speed is an advantage.", "Learn as you go. You create progress through movement, not just thinking."] },
    { theme: 'Push Further', paragraphs: ["Your limits are mostly in your head. When you feel done, you can usually do more.", "Push past your comfort zone. You are stronger than you think."] },
    { theme: 'Be Honest', paragraphs: ["Never pretend to be someone else to gain approval. Be real and honest.", "Live with integrity. Speak the truth and you will have nothing to fear."] },
    { theme: 'Outwork Everyone', paragraphs: ["Talent is okay, but hard work is better. While others rest, keep working.", "Work hard when nobody is looking. Real success is proven by what you do."] },
    { theme: 'Keep Learning', paragraphs: ["A lazy mind gets dull. Constantly read and learn new things.", "Train your mind to solve problems. Knowledge is a tool you can use every day."] },
    { theme: 'Be Decisive', paragraphs: ["Weak people take too long to decide. Choose quickly and stand by it.", "Trust your own judgment. Any clear decision is better than doing nothing at all."] },
    { theme: 'Rise Above', paragraphs: ["Gossip and drama are for people with nothing else to do. Keep your eyes on your goals.", "Your time is too valuable to spend on small talk. Let others talk while you move up."] },
    { theme: 'Take Ownership', paragraphs: ["Stop waiting for a lucky break. No one is coming to do the work for you.", "You are in control of your life. Carry your own weight and make it happen."] }
  ];

  const wrapWords = (text) => text.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0).map(s => `<span class="hi">${s.trim()}</span>`).join(" ");

  const updateClockAndStats = () => {
    const now = new Date();
    const day = now.getDate();
    const month = now.toLocaleDateString("en-US", { month: 'long' }).toUpperCase();
    const year = now.getFullYear();
    document.getElementById("d0").textContent = `${day} ${month} ${year}`;
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    document.getElementById("t0").textContent = `DAY ${dayOfYear}`;
    const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const remaining = 1440 - (now.getHours() * 60 + now.getMinutes());
    const statsEl = document.getElementById('live-stats');
    if (statsEl) statsEl.textContent = `Time: ${timeStr} • ${remaining} minutes remaining today`;
  };

  const init = () => {
    const startOfYear = new Date(new Date().getFullYear(), 0, 1);
    const today = new Date();
    const dayOfYear = Math.floor((today - startOfYear) / (1000 * 60 * 60 * 24));
    const item = data[dayOfYear % data.length];
    document.getElementById("h0").textContent = item.theme;
    document.getElementById("m0").innerHTML = `
      <div class="z1"><p class="font-f1 text-6xl sm:text-8xl md:text-[8.5rem] leading-[1.05] zi">${wrapWords(item.paragraphs[0])}</p></div>
      <div class="z1"><p class="font-f1 text-6xl sm:text-8xl md:text-[8.5rem] leading-[1.05]">${wrapWords(item.paragraphs[1])}</p></div>
    `;
    updateClockAndStats();
    const observer = new IntersectionObserver((entries) => { 
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("za"); }); 
    }, { threshold: 0.05 });
    document.querySelectorAll(".z1").forEach(el => observer.observe(el));
  };

  window.addEventListener("scroll", () => {
    const s = window.scrollY;
    document.getElementById("n0").classList.toggle("zs", s > 10);
    if(document.getElementById("sd")) document.getElementById("sd").style.opacity = s > 20 ? "0" : "1";
    const spans = document.querySelectorAll(".hi");
    let active = null, min = Infinity;
    spans.forEach(span => {
      const dist = Math.abs((span.getBoundingClientRect().top + span.getBoundingClientRect().height / 2) - (window.innerHeight * 0.5));
      if (dist < min) { min = dist; active = span; }
    });
    spans.forEach(span => { span === active && min < window.innerHeight * 0.4 ? span.classList.add("active") : span.classList.remove("active"); });
  }, { passive: true });
  window.onload = () => { init(); setInterval(updateClockAndStats, 1000); };
})();
</script>
</body>
</html>
