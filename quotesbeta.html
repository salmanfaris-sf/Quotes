<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P37159WTH1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-P37159WTH1');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>The Creed</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description" content="Forge an unbreakable mind. Obey Allah. Obey His Messenger. Be a man of your word. Don't waste time. Stay disciplined. Stay focused. This is the way.">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            user-select: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        ._f1 {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        ._f1.v {
            opacity: 1;
        }

        ._c1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 600px;
            width: calc(100% - 48px);
            text-align: center;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform, opacity;
        }

        #_q_ {
            font-family: 'Inter', sans-serif;
            white-space: pre-wrap;
            margin-bottom: 12px; 
            color: #ffffff;
            display: inline-block;
            will-change: opacity;
            transition: opacity 0.35s ease-in-out;
            font-weight: 300;
            letter-spacing: -0.01em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        #_st_ {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #888888;
            font-weight: 400;
            letter-spacing: 0.03em;
            transition: opacity 0.35s ease;
            line-height: 1.6;
            margin-bottom: 4px;
        }

        /* Subtle navigation cues at the bottom */
        .nav-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #444;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.33s ease;
        }

        /* Autoplay Status Text (Positioned top center) */
        #_ap_status_ {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #888888;
            font-weight: 400;
            letter-spacing: 0.05em;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            white-space: nowrap;
            transition: opacity 0.35s ease-in-out;
        }

        /* Topic Item Button Custom Styling */
        .topic-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
        }
        .topic-btn:hover, .topic-btn:active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .topic-btn.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Main Content Container -->
    <div class="_c1 _f1" id="_mc_">
        <h1 id="_q_" class="text-sm md:text-base lg:text-lg leading-relaxed tracking-wide opacity-0"></h1>
        <div id="_st_" class="opacity-0"></div>
    </div>

    <!-- Navigation Hint -->
    <div class="nav-hint hidden md:block">Swipe Up for Topics • Hold for Autoplay</div>

    <!-- Autoplay & Category Status Toast -->
    <div id="_ap_status_"></div>

    <!-- Topics Modal Overlay -->
    <div id="_topics_modal_" class="fixed inset-0 bg-black/85 backdrop-blur-md z-30 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
        <div class="w-full max-w-xs sm:max-w-sm px-6 text-center" onclick="event.stopPropagation()">
            <h2 class="text-xs uppercase tracking-widest text-neutral-400 mb-6 font-medium">Select Topic</h2>
            
            <div id="_topics_list_" class="flex flex-col gap-2.5">
                <!-- Topic buttons generated via JavaScript -->
            </div>

            <button id="_close_modal_btn_" class="mt-7 text-xs text-neutral-500 hover:text-neutral-300 tracking-widest transition-colors py-2 px-4 uppercase font-light">
                Close
            </button>
        </div>
    </div>

<script>
(function(){
    const _db = [
        { t: "Be better than you were yesterday." },
        { t: "Race one another in good deeds.\n(Qur'an 2:148)" },
        { t: "Don't waste time. You don't get it back." },
        { t: "Focus." },
        { t: "The problem is,\nyou think you have a lot of time to live." },
        { t: "Live everyday like it's your last day." },
        { t: "Consistency." },
        { t: "Big dreams need big sacrifices." },
        { t: "Practice makes perfect." },
        { t: "Do it even when you don't feel like it." },
        { t: "Nothing changes if nothing changes." },
        { t: "Stay different." },
        { t: "You only have 1,440 minutes every day,\ndon’t let a single one go to waste.", id: "t_q" },
        { t: "You can't have a million dollar dream with a minimum wage work ethic." },
        { t: "A real man protects and provides." },
        { t: "Don't follow the crowd. Follow the truth." },
        { t: "Never build your happiness on\n someone else's tears." },
        { t: "Eliminate the 'tomorrow' mindset today." },
        { t: "The strongest man is he who controls his anger." },
        { t: "Be a man of your word." },
        { t: "Your habits define your future self." },
        { t: "Hate Laziness." },
        { t: "Always speak the truth." },
        { t: "Time waits for no one." },
        { t: "Quality over quantity in everything." },
        { t: "Knowledge without action is useless." },
        { t: "Fear Allah. Not people." },
        { t: "Live with purpose." },
        { t: "Be a man of your word." },
        { t: "A real man protects those who are vulnerable." },
        { t: "Every day is a second chance." },
        { t: "Now is the time." },
        { t: "Success is earned, not given." },
        { t: "Focus on your growth." },
        { t: "Stay Disciplined." },
        { t: "A heart connected to Allah is\n never truly broken." },
        { t: "He who is brave is free." },
        { t: "Growth begins outside comfort zones." },
        { t: "This is the way." },
        { t: "Hard days make strong people." },
        { t: "Keep showing up." },
        { t: "Strength is built through repetition." },
        { t: "Be the change that you wish to see in the world." },
        { t: "Do the boring work well." },
        { t: "Consistency creates mastery." },
        { t: "Work now, Relax later." },
        { t: "Don't look back. You're not going that way."},
        { t: "Every day counts." },
        { t: "Habits decide outcomes." },
        { t: "Growth requires discomfort." },
        { t: "Sweat more in practice. Bleed less in war." },
        { t: "do it scared.\ndo it tired.\ndo it anyway." },
        { t: "When you feel like nothing is going your way, look at a person breaking a stone. They can hit a big rock 100 times and it won't even move. But on the 101st hit, it suddenly breaks into two pieces. It wasn't just that last hit that broke it,it was the result of all the hits that happened before it." },
        { t: "It always seems impossible until it's done." },
        { t: "Focus is a superpower in a distracted world." },
        { t: "Weakness leaves when discipline enters." },
        { t: "Strength is built through patience." },
        { t: "Be strict with yourself." },
        { t: "Zero Excuses." },
        { t: "You already know what to do.\nYou just don’t like the cost." },
        { t: "The brain will invent reasons to avoid pain, even when pain is the only path forward." },
        { t: "Every wasted year makes the\n next one heavier." },
        { t: "Do it the moment you remember it." },
        { t: "Stick to the plan. Not your mood." },
        { t: "Be the change that you wish to see in the world." },
        { t: "5,4,3,2,1. Act Now." },
        { t: "Indeed Shaitan is ever, to mankind,\na clear enemy.\n[Qur'an 17:53]"},
        { t: "Prophet Muhammad ﷺ said:\nThere are two blessings that many people are deceived into losing: health and free time.\n[Sahih al-Bukhari 6412]" },
        { t: "Prophet Muhammad ﷺ said:\nMake things easy for the people, and do not make it difficult for them.\n[Sahih al-Bukhari 6125]" },
        { t: "Prophet Muhammad ﷺ said:\nDo good deeds properly, sincerely and moderately.\n[Sahih al-Bukhari 6464]" },
        { t: "Prophet Muhammad ﷺ said:\nSpeak good or remain silent.\n[Riyad as-Salihin 1511]" },
        { t: "Prophet Muhammad ﷺ said:\nThe most beloved deed to Allah is the most regular and constant even if it were little.\n[Sahih al-Bukhari 6464]" },
        { t: "Character is who you are when no one is watching." },
        { t: "Keep moving forward." },
        { t: "If not now, Then when?" },
        { t: "Leave a legacy. Let your life be a story of courage, action, and impact." },
        { t: "NOW.\nWaiting won’t help.\nOverthinking won’t help.\nAction will.\nDo it." },
        { t: "Lower your gaze, guard your tongue, and protect your heart." },
        { t: "Your current life is the result of past actions. Your future will be the result of today's actions." },
        { t: "The man who keeps walking will eventually leave the place he hates." },
        { t: "A few years of sacrifice can create a lifetime of freedom." },
        { t: "Your future is built by what you do after a long tiring day." },
        { t: "Action may not always bring happiness, but there is no happiness without action." },
        { t: "Stand straight. Speak clearly. Fear none."},
        { t: "Its what's inside that matters." },
        { t: "Every pro was once a beginner."},
        { t: "Weak men wait for courage.\n Strong men create it through action."},
        { t: "Be the man who acts while others are still thinking."},
        { t: "Be so disciplined that even your bad days look like progress."},
        { t: "A strong man doesn’t need motivation.\nHe acts because he decided."},
        { t: "Pressure reveals the man within."}
    ];

    const _topics = [
        { id: "all", label: "All Quotes" },
        { id: "quran_sunnah", label: "Qur'an & Sunnah" },
        { id: "laziness", label: "Overcoming Laziness & Time" },
        { id: "brave", label: "Be Brave & Strong" },
        { id: "action", label: "Take Action & Work Hard" },
        { id: "focus", label: "Focus & Discipline" }
    ];

    let _selectedTopicId = "all";

    function _matchesTopic(q, topicId) {
        if (topicId === "all") return true;
        const text = q.t.toLowerCase();

        if (topicId === "quran_sunnah") {
            return /qur'an|prophet|sahih|riyad|allah|shaitan|gaze|anger|deeds/i.test(q.t);
        }
        if (topicId === "laziness") {
            return /laziness|tomorrow|waste|time|1,440|waiting|overthinking|minutes|year|relax|boredom/i.test(q.t);
        }
        if (topicId === "brave") {
            return /brave|courage|pressure|fear|scared|hard days|stone|strength|vulnerable|free|man within|protect/i.test(q.t);
        }
        if (topicId === "action") {
            return /act|action|do it|work|now|walk|walks|beginner|pro|sweat|repeat|excuses|cost|done|now\./i.test(q.t);
        }
        if (topicId === "focus") {
            return /focus|consistency|habits|discipline|mind|mastery|goal|plan|progress|learning|character/i.test(q.t);
        }
        return true;
    }

    const _qx = document.getElementById('_q_');
    const _st = document.getElementById('_st_');
    const _mc = document.getElementById('_mc_');
    const _apStatus = document.getElementById('_ap_status_');
    const _modal = document.getElementById('_topics_modal_');
    const _topicsListEl = document.getElementById('_topics_list_');
    const _closeBtn = document.getElementById('_close_modal_btn_');
    
    let _l_i = null;
    let _startY = 0;
    let _startX = 0;
    let _currentY = 0;
    let _currentX = 0;
    let _isSwipe = false;
    let _isModalOpen = false;

    // Autoplay & Long Press State
    let _isAutoplay = false;
    let _autoplayInterval = null;
    let _longPressTimer = null;
    let _isLongPress = false;
    let _statusTimeout = null;
    const AUTOPLAY_INTERVAL_MS = 20000;
    const LONG_PRESS_DELAY_MS = 550;

    function _shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    let _currentPool = [];
    let _lastQuoteText = null;
    let _history = [];
    let _historyIndex = -1;

    function _getNextQuote() {
        if (_currentPool.length === 0) {
            let freshList = _db.filter(q => _matchesTopic(q, _selectedTopicId));
            if (freshList.length === 0) freshList = [..._db]; // fallback safety
            _shuffle(freshList);
            if (freshList.length > 1 && freshList[freshList.length - 1].t === _lastQuoteText) {
                const head = freshList.pop();
                freshList.unshift(head);
            }
            _currentPool = freshList;
        }
        const choice = _currentPool.pop();
        if (choice) _lastQuoteText = choice.t;
        return choice || { t: "Stay Disciplined." };
    }

    function _gs() {
        const n = new Date();
        let h = n.getHours();
        const m = n.getMinutes().toString().padStart(2, '0');
        const a = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        const e = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 23, 59, 59);
        const d = e - n;
        const ml = Math.floor(d / 60000);
        return { t: `${h}:${m} ${a}`, l: ml };
    }

    function _showQuote(nq) {
        _st.classList.add('opacity-0');
        if (_l_i) clearInterval(_l_i);

        _qx.style.transition = 'opacity 0.35s ease-in-out';
        _qx.style.opacity = '0';

        setTimeout(() => {
            _qx.innerText = nq.t;

            if (nq.id === "t_q") {
                const ux = () => {
                    const s = _gs();
                    _st.innerHTML = `Time: ${s.t} • ${s.l} minutes remaining today`;
                };
                ux();
                _st.classList.remove('opacity-0');
                _l_i = setInterval(ux, 30000);
            } else {
                _st.innerHTML = "";
                _st.classList.add('opacity-0');
            }

            requestAnimationFrame(() => {
                _qx.style.transition = 'opacity 0.35s ease-in-out';
                _qx.style.opacity = '1';
            });
        }, 350);
    }

    function _next() {
        if (_historyIndex < _history.length - 1) {
            _historyIndex++;
            _showQuote(_history[_historyIndex]);
        } else {
            const nq = _getNextQuote();
            _history.push(nq);
            _historyIndex = _history.length - 1;
            _showQuote(nq);
        }
    }

    function _prev() {
        if (_historyIndex > 0) {
            _historyIndex--;
            _showQuote(_history[_historyIndex]);
        }
    }

    function _showStatus(text) {
        if (_statusTimeout) clearTimeout(_statusTimeout);
        
        _apStatus.style.transition = 'opacity 0.35s ease-in-out';
        _apStatus.style.opacity = '0';

        setTimeout(() => {
            _apStatus.innerText = text;
            requestAnimationFrame(() => {
                _apStatus.style.opacity = '1';
            });
        }, 350);

        _statusTimeout = setTimeout(() => {
            _apStatus.style.opacity = '0';
        }, 2200);
    }

    function _toggleAutoplay() {
        _isAutoplay = !_isAutoplay;
        
        if (_isAutoplay) {
            _showStatus("Autoplay on");
            
            if (_autoplayInterval) clearInterval(_autoplayInterval);
            _autoplayInterval = setInterval(() => {
                _next();
            }, AUTOPLAY_INTERVAL_MS);
        } else {
            _showStatus("Autoplay off");
            
            if (_autoplayInterval) {
                clearInterval(_autoplayInterval);
                _autoplayInterval = null;
            }
        }
    }

    function _renderTopics() {
        _topicsListEl.innerHTML = "";
        _topics.forEach(topic => {
            const btn = document.createElement('button');
            const isActive = topic.id === _selectedTopicId;
            btn.className = `topic-btn w-full py-3.5 px-5 rounded-xl text-xs text-left font-normal flex items-center justify-between tracking-wide ${isActive ? 'active' : 'text-neutral-300'}`;
            
            btn.innerHTML = `
                <span>${topic.label}</span>
                ${isActive ? '<span class="text-xs text-neutral-400">✓</span>' : ''}
            `;

            btn.onclick = (e) => {
                e.stopPropagation();
                _selectTopic(topic.id, topic.label);
            };

            _topicsListEl.appendChild(btn);
        });
    }

    function _openTopicsModal() {
        _renderTopics();
        _isModalOpen = true;
        _modal.classList.remove('pointer-events-none', 'opacity-0');
        _modal.classList.add('opacity-100');
    }

    function _closeTopicsModal() {
        _isModalOpen = false;
        _modal.classList.remove('opacity-100');
        _modal.classList.add('opacity-0', 'pointer-events-none');
    }

    function _selectTopic(topicId, topicLabel) {
        _selectedTopicId = topicId;
        _closeTopicsModal();
        _showStatus(`Topic: ${topicLabel}`);
        _currentPool = [];
        _history = [];
        _historyIndex = -1;
        _next();
    }

    function _startLongPressTimer() {
        _cancelLongPressTimer();
        _longPressTimer = setTimeout(() => {
            _isLongPress = true;
            _toggleAutoplay();
        }, LONG_PRESS_DELAY_MS);
    }

    function _cancelLongPressTimer() {
        if (_longPressTimer) {
            clearTimeout(_longPressTimer);
            _longPressTimer = null;
        }
    }

    window.onload = () => {
        const i = _getNextQuote();
        _history.push(i);
        _historyIndex = 0;
        
        _qx.innerText = i.t;
        _qx.style.opacity = '1';
        
        if (i.id === "t_q") {
            const s = _gs();
            _st.innerHTML = `Time: ${s.t} • ${s.l} minutes remaining today`;
            _st.classList.remove('opacity-0');
        }

        requestAnimationFrame(() => {
            _mc.classList.add('v');
        });
    };

    _modal.onclick = () => {
        _closeTopicsModal();
    };

    _closeBtn.onclick = (e) => {
        e.stopPropagation();
        _closeTopicsModal();
    };

    // Click navigation (ignored if modal is open, or click was part of swipe or long press)
    document.addEventListener('click', (e) => {
        if (_isModalOpen) return;
        if (_isSwipe || _isLongPress) {
            _isLongPress = false;
            return;
        }
        _next();
    });

    // Touch events setup
    document.addEventListener('touchstart', (e) => {
        _startY = e.touches[0].clientY;
        _startX = e.touches[0].clientX;
        _currentY = _startY;
        _currentX = _startX;
        _isSwipe = false;
        _isLongPress = false;

        if (!_isModalOpen) {
            _startLongPressTimer();
        }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
        _currentY = e.touches[0].clientY;
        _currentX = e.touches[0].clientX;
        const diffY = _startY - _currentY;
        const diffX = Math.abs(_startX - _currentX);

        if (Math.abs(diffY) > 10 || diffX > 10) {
            _cancelLongPressTimer();
        }

        if (diffY > 10 && e.cancelable) {
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('touchend', () => {
        _cancelLongPressTimer();

        const deltaX = _currentX - _startX;
        const deltaY = _currentY - _startY;

        if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY)) {
            _isSwipe = true;
            if (!_isModalOpen) {
                if (deltaX > 40) {
                    _prev(); // Swipe Right -> Previous
                } else if (deltaX < -40) {
                    _next(); // Swipe Left -> Next
                }
            }
        } else if (deltaY < -40 && Math.abs(deltaY) > Math.abs(deltaX)) {
            _isSwipe = true;
            if (!_isModalOpen) {
                _openTopicsModal(); // Swipe Up -> Open Topics Selector
            }
        } else if (deltaY > 40 && Math.abs(deltaY) > Math.abs(deltaX)) {
            if (_isModalOpen) {
                _isSwipe = true;
                _closeTopicsModal(); // Swipe Down -> Close Modal
            }
        }

        if (_isSwipe) {
            setTimeout(() => {
                _isSwipe = false;
            }, 150);
        }
    }, { passive: true });

    // Desktop Mouse support for long press toggle
    document.addEventListener('mousedown', (e) => {
        if (_isModalOpen || e.button !== 0) return;
        _startX = e.clientX;
        _startY = e.clientY;
        _isLongPress = false;
        _startLongPressTimer();
    });

    document.addEventListener('mousemove', (e) => {
        if (_longPressTimer) {
            const moveX = Math.abs(e.clientX - _startX);
            const moveY = Math.abs(e.clientY - _startY);
            if (moveX > 8 || moveY > 8) {
                _cancelLongPressTimer();
            }
        }
    });

    document.addEventListener('mouseup', () => {
        _cancelLongPressTimer();
    });

    // Keyboard navigation support
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Escape') {
            _closeTopicsModal();
            return;
        }
        if (_isModalOpen) return;

        if (e.code === 'Space' || e.code === 'ArrowRight') {
            _next();
        } else if (e.code === 'ArrowLeft') {
            _prev();
        } else if (e.code === 'ArrowUp' || e.code === 'KeyT') {
            _openTopicsModal();
        } else if (e.code === 'KeyA') {
            _toggleAutoplay();
        }
    });

})();
</script>
</body>
</html>
