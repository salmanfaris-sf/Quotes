<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salman Faris | Private Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #050505;
            --gold: #d4af37;
            --gold-muted: rgba(212, 175, 55, 0.4);
            --card-inner: #0a0a0a;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--obsidian);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .cursive {
            font-family: 'Dancing Script', cursive;
        }

        .serif {
            font-family: 'Playfair Display', serif;
        }

        /* Luxury Button Styling */
        .luxury-card {
            background: linear-gradient(145deg, #0f0f0f, #050505);
            border: 1px solid var(--border);
            position: relative;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            overflow: hidden;
            border-radius: 1rem;
        }

        .luxury-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.03), transparent);
            pointer-events: none;
        }

        .luxury-card:hover {
            border-color: var(--gold-muted);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .luxury-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Gold gradient text */
        .gold-text {
            background: linear-gradient(to bottom right, #fbf5b7 0%, #d4af37 50%, #a67c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Grain texture overlay */
        .grain {
            position: fixed;
            inset: 0;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.15;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-up {
            animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .gold-underline {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-muted), transparent);
            width: 100%;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-8 md:p-12 lg:p-20">
    <div class="grain"></div>

    <!-- Top Left Cursive Name -->
    <header class="w-full mb-24 animate-up" style="animation-delay: 0.1s;">
        <h1 class="cursive text-3xl md:text-4xl text-white">Salman Faris</h1>
        <div class="w-12 h-[1px] bg-white/20 mt-2"></div>
    </header>

    <main class="w-full max-w-4xl mx-auto flex-grow flex flex-col justify-center">
        <div class="mb-12">
            <h2 class="serif italic text-4xl md:text-5xl mb-2 opacity-90">Private Registry</h2>
            <div class="gold-underline"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Tally Counter -->
            <a href="/counter" class="luxury-card p-10 group animate-up" style="animation-delay: 0.2s;">
                <div class="mb-8">
                    <span class="text-[10px] tracking-[0.4em] uppercase opacity-30 font-bold">System 01</span>
                </div>
                <h3 class="serif text-3xl mb-4 group-hover:gold-text transition-all duration-500">Counter</h3>
                <p class="text-xs uppercase tracking-widest opacity-40 leading-loose">Precision session monitoring.</p>
                <div class="mt-8 opacity-0 group-hover:opacity-100 transition-opacity duration-700">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </a>

            <!-- Scooter KM Tracker -->
            <a href="/km" class="luxury-card p-10 group animate-up" style="animation-delay: 0.3s;">
                <div class="mb-8">
                    <span class="text-[10px] tracking-[0.4em] uppercase opacity-30 font-bold">System 02</span>
                </div>
                <h3 class="serif text-3xl mb-4 group-hover:gold-text transition-all duration-500">Mileage</h3>
                <p class="text-xs uppercase tracking-widest opacity-40 leading-loose">Odometer analytics hub.</p>
                <div class="mt-8 opacity-0 group-hover:opacity-100 transition-opacity duration-700">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </a>

            <!-- Quotes Hub -->
            <a href="/quotes" class="luxury-card p-10 group animate-up" style="animation-delay: 0.4s;">
                <div class="mb-8">
                    <span class="text-[10px] tracking-[0.4em] uppercase opacity-30 font-bold">System 03</span>
                </div>
                <h3 class="serif text-3xl mb-4 group-hover:gold-text transition-all duration-500">Quotes</h3>
                <p class="text-xs uppercase tracking-widest opacity-40 leading-loose">Philosophy and wisdom.</p>
                <div class="mt-8 opacity-0 group-hover:opacity-100 transition-opacity duration-700">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </a>

        </div>
    </main>

    <footer class="mt-24 w-full flex justify-between items-end animate-up" style="animation-delay: 0.5s;">
        <div class="flex flex-col gap-2">
            <span class="text-[9px] tracking-[0.5em] uppercase opacity-20">Authorized Access Only</span>
            <span class="text-[9px] tracking-[0.5em] uppercase opacity-20">EST. 2024</span>
        </div>
        <div class="serif italic text-sm opacity-40">
            S.F.
        </div>
    </footer>

</body>
</html>
