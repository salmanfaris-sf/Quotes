                try {
                    if (!wakeLock) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLock.addEventListener('release', () => {
                            wakeLock = null;
                        });
                    }
                } catch (err) {}
            }

            d.addEventListener('visibilitychange', () => {
                if (d.visibilityState === 'visible') {
                    _requestWakeLock();
                }
            });

            _requestWakeLock();

            // Configure dynamic web app manifest for standalone installation
            try {
                const manifest = {
                    name: 'Counter',
                    short_name: 'Counter',
                    description: 'Minimalist gesture tap counter',
                    start_url: location.href,
                    display: 'standalone',
                    background_color: '#000000',
                    theme_color: '#000000',
                    orientation: 'portrait',
                    icons: [
                        { src: new URL('favicon.png', location.href).href, sizes: '192x192', type: 'image/png' },
                        { src: new URL('favicon.png', location.href).href, sizes: '512x512', type: 'image/png' }
                    ]
                };
                const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
                const manifestLink = d.getElementById('manifest-link');
                if (manifestLink) manifestLink.href = URL.createObjectURL(manifestBlob);
            } catch (e) {}

            w.addEventListener('beforeinstallprompt', e => {
                e.preventDefault();
                deferredInstallPrompt = e;
                installMenu.style.display = 'flex';
            });

            w.addEventListener('appinstalled', () => {
                deferredInstallPrompt = null;
                installMenu.style.display = 'none';
            });

            installMenu.onclick = async e => {
                e.stopPropagation();
                md.classList.remove('active');
                if (deferredInstallPrompt) {
                    deferredInstallPrompt.prompt();
                    const { outcome } = await deferredInstallPrompt.userChoice;
                    if (outcome === 'accepted') {
                        deferredInstallPrompt = null;
                        installMenu.style.display = 'none';
                    }
                }
            };

            // Apply bottom gesture hint visibility state
            function _applyHintState() {
                if (hh) {
                    d.body.classList.add('hide-hints');
                    hintMenu.querySelector('span').textContent = 'Show Bottom Hint';
                } else {
                    d.body.classList.remove('hide-hints');
                    hintMenu.querySelector('span').textContent = 'Hide Bottom Hint';
                }
            }
            _applyHintState();

            // Temporarily hide prompt label while interacting
            function _u() {
                if (stt) clearTimeout(stt);
                i.classList.remove('v');
                stt = setTimeout(() => { if (!isLockout) i.classList.add('v') }, 5e3);
            }

            // Speak count aloud using SpeechSynthesis when sound mode is enabled
            function _p(textToSpeak) {
                if (sn) return;
                try {
                    if ('speechSynthesis' in w) {
                        w.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(textToSpeak.toString());
                        utterance.rate = 1.15;
                        utterance.pitch = 1.0;
                        utterance.volume = 1.0;
                        w.speechSynthesis.speak(utterance);
                    }
                } catch (err) {}
            }

            // Update circular goal progress ring
            function _up() {
                if (gl > 0) {
                    pc.classList.add('active');
                    const o = cr - (Math.min(v, gl) / gl) * cr;
                    rg.style.strokeDashoffset = o;
                    rg.style.opacity = v >= gl ? 1 : .3;
                    rg.style.stroke = v >= gl ? 'var(--accent)' : '#fff';
                } else {
                    pc.classList.remove('active');
                }
            }

            // Scale counter number font size smoothly for longer numbers
            function _updateNumberSize(formattedText) {
                const len = formattedText.length;
                if (len <= 4) {
                    f.style.fontSize = '18vw';
                } else if (len <= 6) {
                    f.style.fontSize = '14vw';
                } else if (len <= 9) {
                    f.style.fontSize = '10vw';
                } else {
                    f.style.fontSize = '7.5vw';
                }
            }

            // Refresh UI display for active counter
            function _w() {
                currentCounter = _getActiveCounter();
                currentCounter.v = v;
                currentCounter.st = st;
                currentCounter.gl = gl;

                x1Label.textContent = currentCounter.name;
                const formatted = v.toLocaleString('en-US');
                f.textContent = formatted;
                _updateNumberSize(formatted);

                if (st > 1) {
                    sd.textContent = 'Increment: ' + st;
                    sd.classList.add('v');
                } else {
                    sd.classList.remove('v');
                }

                if (gl > 0) {
                    gd.textContent = 'Goal: ' + gl.toLocaleString('en-US');
                    gd.classList.add('v');
                } else {
                    gd.classList.remove('v');
                }

                _up();
                if (cs.classList.contains('active')) {
                    _renderCounterSwitcher();
                }
            }

            // Persist all counters and settings to localStorage
            function _x() {
                try {
                    currentCounter = _getActiveCounter();
                    currentCounter.v = v;
                    currentCounter.st = st;
                    currentCounter.gl = gl;

                    localStorage.setItem(k.list, JSON.stringify(counters));
                    localStorage.setItem(k.active, activeId);
                    localStorage.setItem(k.c, v);
                    localStorage.setItem(k.s, sn);
                    localStorage.setItem(k.t, st);
                    localStorage.setItem(k.g, gl);
                    localStorage.setItem(k.h, hh);
                } catch (err) {}
            }

            // Show floating status pill message
            function _z(m, du) {
                if (rt) clearTimeout(rt);
                ht.textContent = m;
                h.classList.add('active');
                rt = setTimeout(() => {
                    h.classList.remove('active');
                    rt = null;
                }, du);
            }

            function _triggerGoalLockout() {
                if (rt) {
                    clearTimeout(rt);
                    rt = null;
                }
                h.classList.remove('active');
                isLockout = true;
                d.body.classList.add('lockout-active');
                gsh.style.transition = '';
                gsh.style.transform = 'translateX(0)';
                go.classList.add('active');
            }

            // Increment active counter and handle goal completion
            function _incrementCounter() {
                const p = v;
                v += st;
                if (gl > 0 && p < gl && v >= gl) {
                    _p(`${v}. Goal reached`);
                    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
                    _triggerGoalLockout();
                } else {
                    _p(v);
                }
                _w();
                _x();
            }

            // Switch to another counter by ID
            function _switchCounter(targetId) {
                const found = counters.find(item => item.id === targetId);
                if (!found) return;
                activeId = found.id;
                currentCounter = found;
                v = found.v;
                st = found.st;
                gl = found.gl;
                expandedCounterId = null;
                f.contentEditable = 'false';
                _w();
                _x();
            }

            // Create a new custom counter
            function _createCounter() {
                setTimeout(() => {
                    const nameInput = prompt('New Counter Name:', 'Counter ' + (counters.length + 1));
                    _dismissMobileKeyboard();
                    setTimeout(_dismissMobileKeyboard, 150);
                    setTimeout(_dismissMobileKeyboard, 350);
                    if (nameInput === null) return;

                    const cleanName = nameInput.trim() || ('Counter ' + (counters.length + 1));
                    const newCounter = {
                        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        name: cleanName,
                        permanent: false,
                        v: 0,
                        st: 1,
                        gl: 0
                    };
                    counters.push(newCounter);
                    _switchCounter(newCounter.id);
                    cs.classList.remove('active');
                    _z(`switched to ${cleanName}`, 2000);
                }, 60);
            }

            // Rename a non-permanent custom counter
            function _renameCounter(targetId) {
                const target = counters.find(item => item.id === targetId);
                if (!target || target.permanent || target.id === PERMANENT_ID) return;

                setTimeout(() => {
                    const nextName = prompt('Rename Counter:', target.name);
                    _dismissMobileKeyboard();
                    setTimeout(_dismissMobileKeyboard, 150);
                    setTimeout(_dismissMobileKeyboard, 350);
                    if (nextName === null) return;

                    const cleanName = nextName.trim();
                    if (cleanName) {
                        target.name = cleanName;
                        expandedCounterId = null;
                        _w();
                        _x();
                        _z(`renamed to ${cleanName}`, 2000);
                    }
                }, 60);
            }

            // Delete a non-permanent custom counter
            function _deleteCounter(targetId) {
                const target = counters.find(item => item.id === targetId);
                if (!target || target.permanent || target.id === PERMANENT_ID) return;
                if (!confirm(`Delete "${target.name}"?`)) return;

                counters = counters.filter(item => item.id !== targetId);
                if (expandedCounterId === targetId) {
                    expandedCounterId = null;
                }
                if (activeId === targetId) {
                    _switchCounter(PERMANENT_ID);
                } else {
                    _w();
                    _x();
                }
                _z(`deleted ${target.name}`, 2000);
            }

            // Render counter switcher rows and smooth long-press round Edit/Delete buttons
            function _renderCounterSwitcher() {
                cs.innerHTML = '';

                counters.forEach(item => {
                    const isPermanent = Boolean(item.permanent || item.id === PERMANENT_ID);
                    const isExpanded = !isPermanent && expandedCounterId === item.id;

                    const group = d.createElement('div');
                    group.className = 'counter-item-group';

                    const row = d.createElement('div');
                    row.className = 'counter-row' +
                        (item.id === activeId ? ' selected' : '') +
                        (isExpanded ? ' actions-open' : '');

                    const info = d.createElement('div');
                    info.className = 'counter-row-info';

                    const dot = d.createElement('span');
                    dot.className = 'counter-dot';

                    const nameEl = d.createElement('span');
                    nameEl.className = 'counter-row-name';
                    nameEl.textContent = item.name;

                    info.appendChild(dot);
                    info.appendChild(nameEl);

                    const countEl = d.createElement('span');
                    countEl.className = 'counter-row-count';
                    countEl.textContent = (parseInt(item.v) || 0).toLocaleString('en-US');

                    row.appendChild(info);
                    row.appendChild(countEl);

                    let holdTimer = null, holdTriggered = false, startX = 0, startY = 0;

                    const clearHold = () => {
                        if (holdTimer) {
                            clearTimeout(holdTimer);
                            holdTimer = null;
                        }
                        row.classList.remove('pressing');
                    };

                    row.addEventListener('touchstart', e => {
                        e.stopPropagation();
                        holdTriggered = false;
                        startX = e.touches[0].clientX;
                        startY = e.touches[0].clientY;
                        row.classList.add('active-touch');

                        if (!isPermanent) {
                            row.classList.add('pressing');
                            holdTimer = setTimeout(() => {
                                holdTriggered = true;
                                row.classList.remove('active-touch');
                                row.classList.remove('pressing');
                                expandedCounterId = expandedCounterId === item.id ? null : item.id;
                                if (navigator.vibrate) navigator.vibrate(40);
                                _renderCounterSwitcher();
                            }, 460);
                        }
                    }, { passive: true });

                    row.addEventListener('touchmove', e => {
                        if (!holdTimer) return;
                        const dx = Math.abs(e.touches[0].clientX - startX);
                        const dy = Math.abs(e.touches[0].clientY - startY);
                        if (dx > 10 || dy > 10) {
                            clearHold();
                            row.classList.remove('active-touch');
                        }
                    }, { passive: true });

                    row.addEventListener('touchend', e => {
                        const didHold = holdTriggered;
                        clearHold();
                        row.classList.remove('active-touch');

                        if (didHold) {
                            ignoreNextMouseClick = true;
                            if (e && e.cancelable) e.preventDefault();
                            return;
                        }

                        ignoreNextMouseClick = true;
                        _switchCounter(item.id);
                        cs.classList.remove('active');
                        _z(`switched to ${item.name}`, 1600);
                    });

                    row.addEventListener('touchcancel', () => {
                        clearHold();
                        row.classList.remove('active-touch');
                    });

                    row.addEventListener('mousedown', e => {
                        if (e.button !== 0 || isPermanent) return;
                        e.stopPropagation();
                        holdTriggered = false;
                        row.classList.add('pressing');
                        holdTimer = setTimeout(() => {
                            holdTriggered = true;
                            row.classList.remove('pressing');
                            expandedCounterId = expandedCounterId === item.id ? null : item.id;
                            _renderCounterSwitcher();
                        }, 460);
                    });

                    row.addEventListener('mouseup', clearHold);
                    row.addEventListener('mouseleave', clearHold);

                    row.onclick = e => {
                        e.stopPropagation();
                        if (ignoreNextMouseClick) {
                            ignoreNextMouseClick = false;
                            return;
                        }
                        if (holdTriggered) {
                            holdTriggered = false;
                            return;
                        }
                        _switchCounter(item.id);
                        cs.classList.remove('active');
                        _z(`switched to ${item.name}`, 1600);
                    };

                    group.appendChild(row);

                    if (!isPermanent) {
                        const actionsWrap = d.createElement('div');
                        actionsWrap.className = 'counter-round-actions-wrap' + (isExpanded ? ' open' : '');

                        const editBtn = d.createElement('button');
                        editBtn.type = 'button';
                        editBtn.className = 'counter-round-btn';
                        editBtn.setAttribute('aria-label', 'Rename counter');
                        editBtn.title = 'Rename';
                        editBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>`;
                        editBtn.onclick = e => {
                            e.stopPropagation();
                            ignoreNextMouseClick = true;
                            cs.classList.remove('active');
                            _renameCounter(item.id);
                        };

                        const delBtn = d.createElement('button');
                        delBtn.type = 'button';
                        delBtn.className = 'counter-round-btn';
                        delBtn.setAttribute('aria-label', 'Delete counter');
                        delBtn.title = 'Delete';
                        delBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path></svg>`;
                        delBtn.onclick = e => {
                            e.stopPropagation();
                            ignoreNextMouseClick = true;
                            cs.classList.remove('active');
                            _deleteCounter(item.id);
                        };

                        const doneBtn = d.createElement('span');
                        doneBtn.className = 'counter-round-label';
                        doneBtn.textContent = 'done';
                        doneBtn.onclick = e => {
                            e.stopPropagation();
                            ignoreNextMouseClick = true;
                            expandedCounterId = null;
                            _renderCounterSwitcher();
                        };

                        actionsWrap.appendChild(editBtn);
                        actionsWrap.appendChild(delBtn);
                        actionsWrap.appendChild(doneBtn);
                        group.appendChild(actionsWrap);
                    }

                    cs.appendChild(group);
                });

                const divider = d.createElement('div');
                divider.className = 'counter-divider';
                cs.appendChild(divider);

                const addRow = d.createElement('button');
                addRow.type = 'button';
                addRow.className = 'menu-item';
                addRow.style.padding = '12px 16px';
                addRow.style.fontSize = '0.85rem';
                addRow.innerHTML = '<span>+ New Counter</span>';
                addRow.onclick = e => {
                    e.stopPropagation();
                    ignoreNextMouseClick = true;
                    _createCounter();
                };
                cs.appendChild(addRow);
            }

            x1.onclick = e => {
                e.stopPropagation();
                ignoreNextMouseClick = true;
                md.classList.remove('active');
                _renderCounterSwitcher();
                cs.classList.toggle('active');
            };

            newCounterMenu.onclick = e => {
                e.stopPropagation();
                ignoreNextMouseClick = true;
                md.classList.remove('active');
                cs.classList.remove('active');
                _createCounter();
            };

            mb.onclick = e => {
                e.stopPropagation();
                ignoreNextMouseClick = true;
                cs.classList.remove('active');
                expandedCounterId = null;
                md.classList.toggle('active');
            };

            d.addEventListener('click', e => {
                if (!e.target.closest('.a2')) {
                    md.classList.remove('active');
                }
                if (!e.target.closest('#counter-switcher') && !e.target.closest('#x1')) {
                    expandedCounterId = null;
                    cs.classList.remove('active');
                }
            });

            d.querySelectorAll('.menu-item').forEach(btn => {
                btn.addEventListener('touchstart', () => {
                    btn.classList.add('active-touch');
                }, { passive: true });
                btn.addEventListener('touchend', () => {
                    btn.classList.remove('active-touch');
                }, { passive: true });
                btn.addEventListener('touchcancel', () => {
                    btn.classList.remove('active-touch');
                }, { passive: true });
            });

            hintMenu.onclick = e => {
                e.stopPropagation();
                ignoreNextMouseClick = true;
                md.classList.remove('active');
                hh = !hh;
                _applyHintState();
                _x();
                _z(hh ? 'bottom hint hidden' : 'bottom hint shown', 2000);
            };

            lbMenu.onclick = e => {
                e.stopPropagation();
                ignoreNextMouseClick = true;
                md.classList.remove('active');
                cs.classList.remove('active');
                expandedCounterId = null;
                lk = true;
                d.body.classList.add('locked');
                lo.classList.add('active');
                if (navigator.vibrate) navigator.vibrate(50);
            };

            fsMenu.onclick = e => {
                e.stopPropagation();
                ignoreNextMouseClick = true;
                md.classList.remove('active');
                if (!d.fullscreenElement) d.documentElement.requestFullscreen().catch(() => {});
                else d.exitFullscreen().catch(() => {});
            };

            function triggerSetGoal() {
                if (d.activeElement && typeof d.activeElement.blur === 'function') {
                    d.activeElement.blur();
                }
                setTimeout(() => {
                    const r = prompt('Set Target Goal (current: ' + (gl || 'none') + '). Enter 0 to remove.', gl || '');
                    _dismissMobileKeyboard();
                    setTimeout(_dismissMobileKeyboard, 150);
                    setTimeout(_dismissMobileKeyboard, 350);
                    if (r !== null) {
                        const n = parseInt(r);
                        if (!isNaN(n) && n >= 0) {
                            gl = n;
                            if (gl > 0) {
                                v = 0;
                                _z(`goal set to ${gl}`, 2000);
                            } else {
                                _z('goal removed', 2000);
                            }
                            _w();
                            _x();
                        }
                    }
                }, 60);
            }

            goalMenu.onclick = e => {
                e.stopPropagation();
                ignoreNextMouseClick = true;
                md.classList.remove('active');
                triggerSetGoal();
            };

            let sx = 0, cx = 0;
            sh.addEventListener('touchstart', e => {
                sx = e.touches[0].clientX;
                sh.style.transition = '';
            }, { passive: true });

            sh.addEventListener('touchmove', e => {
                const dx = e.touches[0].clientX - sx,
                    mx = lo.offsetWidth - sh.offsetWidth - 16;
                cx = Math.max(0, Math.min(dx, mx));
                sh.style.transform = `translateX(${cx}px)`;
                if (cx >= mx * .98) {
                    lk = false;
                    d.body.classList.remove('locked');
                    lo.classList.remove('active');
                    sh.style.transform = 'translateX(0)';
                    if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
                }
            }, { passive: true });

            sh.addEventListener('touchend', () => {
                if (lk) {
                    sh.style.transition = 'transform .4s cubic-bezier(.175,.885,.32,1.275)';
                    sh.style.transform = 'translateX(0)';
                }
            });

            let gsx = 0, gcx = 0, gDragging = false;

            function _completeGoalTurnOff() {
                gDragging = false;
                gl = 0;
                isLockout = false;
                d.body.classList.remove('lockout-active');
                go.classList.remove('active');
                gsh.style.transition = '';
                gsh.style.transform = 'translateX(0)';
                if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
                _w();
                _x();
                setTimeout(() => _z('goal removed', 2000), 200);
            }

            function _onGoalSlideStart(clientX) {
                if (!isLockout) return;
                gDragging = true;
                gsx = clientX;
                gsh.style.transition = '';
            }

            function _onGoalSlideMove(clientX) {
                if (!gDragging || !isLockout) return;
                const mx = go.offsetWidth - gsh.offsetWidth - 16;
                gcx = Math.max(0, Math.min(clientX - gsx, mx));
                gsh.style.transform = `translateX(${gcx}px)`;
                if (gcx >= mx * 0.96) {
                    _completeGoalTurnOff();
                }
            }

            function _onGoalSlideEnd() {
                if (!gDragging) return;
                gDragging = false;
                if (isLockout) {
                    gsh.style.transition = 'transform .4s cubic-bezier(.175,.885,.32,1.275)';
                    gsh.style.transform = 'translateX(0)';
                }
            }

            gsh.addEventListener('touchstart', e => {
                e.stopPropagation();
                _onGoalSlideStart(e.touches[0].clientX);
            }, { passive: true });

            gsh.addEventListener('touchmove', e => {
                e.stopPropagation();
                _onGoalSlideMove(e.touches[0].clientX);
            }, { passive: true });

            gsh.addEventListener('touchend', e => {
                e.stopPropagation();
                _onGoalSlideEnd();
            });

            gsh.addEventListener('mousedown', e => {
                e.stopPropagation();
                _onGoalSlideStart(e.clientX);
            });

            w.addEventListener('mousemove', e => {
                if (gDragging) _onGoalSlideMove(e.clientX);
            });

            w.addEventListener('mouseup', () => {
                if (gDragging) _onGoalSlideEnd();
            });

            f.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    f.blur();
                }
            });

            // Support mouse/trackpad/preview taps so clicking anywhere also increments reliably
            d.body.addEventListener('click', e => {
                if (lk || isLockout) return;
                if (ignoreNextMouseClick) {
                    ignoreNextMouseClick = false;
                    return;
                }
                if (e.target.closest('.a2') || e.target.closest('.a1') || e.target.closest('#counter-switcher') || e.target.closest('.b3') || e.target.closest('#lock-overlay') || e.target.closest('#goal-overlay')) return;
                if (f.contentEditable === 'true') return;
                _u();
                _incrementCounter();
            });

            d.addEventListener('fullscreenchange', () => {
                d.body.classList.toggle('f', !!d.fullscreenElement)
            });

            f.onblur = () => {
                f.contentEditable = 'false';
                let r = f.textContent.replace(/[^\d]/g, '');
                v = r === '' ? 0 : parseInt(r);
                _w(); _x(); _u()
            };

            _w();
            stt = setTimeout(() => { i.classList.add('v') }, 0)
        })()
    </script>

</body></html>
