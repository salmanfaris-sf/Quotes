<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#000000">
<title>Salman Faris | Simple Wisdom</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-1K1TKBQFFK"></script>

<meta name="description" content="Raw thoughts on discipline, focus, and the hard path.">
<meta name="author" content="Salman Faris">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{f1:['"Cormorant Garamond"','serif'],f2:['Inter','sans-serif']},
      colors:{c1:'#000000',c2:'#C5A059',eye:'#B8B8B0'}
    }
  }
}
</script>
<style>
html, body { 
  background-color: #000000; 
  scroll-behavior: auto; 
  overflow-x: hidden;
  width: 100%;
  position: relative;
  touch-action: pan-y; 
}

body { margin: 0; color: #d1d1d1; font-smoothing: antialiased; }

/* Hardware Acceleration for Smooth Scrolling */
.z1 {
  will-change: transform, opacity, filter;
  opacity:0;
  transform:translateY(30px);
  filter:blur(10px);
  transition: opacity 1.2s cubic-bezier(.16,1,.3,1), 
              transform 1.2s cubic-bezier(.16,1,.3,1), 
              filter 1.2s cubic-bezier(.16,1,.3,1);
}
.z1.za{opacity:1;transform:translateY(0);filter:blur(0)}

.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}

.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}

.zs1{font-size:11px;letter-spacing:.8em;text-transform:uppercase;font-family:Inter,sans-serif;opacity:0.4;color:#fff}
.zb{color:#C5A059;opacity:0.9;text-shadow:0 0 30px rgba(197,160,89,0.3)}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,0.5)}
@keyframes flash{0%,100%{opacity:0.1}50%{opacity:0.7}}
.zf{animation:flash 2s ease-in-out infinite}

.hi{transition:color 0.4s ease, opacity 0.4s ease; opacity:0.15; color:#B8B8B0; display:inline-block}
.hi.active{opacity:1 !important; color:#fff !important; text-shadow:0 0 15px rgba(255,255,255,0.4) !important}

.v-grid { 
  width: 100%; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 60px; 
}

.v-wrap { 
  width: 85vw; 
  aspect-ratio: 9/16; 
  max-width: 450px; 
  position: relative; 
  background: #0a0a0a; 
  overflow: hidden; 
  cursor: pointer;
  border-radius: 24px; 
  border: 1px solid rgba(255,255,255,0.05);
  display: none; 
}

.v-wrap.is-visible { display: block; }

/* Thumbnail Placeholder */
.v-thumb {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-size: cover;
  background-position: center;
  filter: brightness(0.5) blur(4px);
  transition: transform 0.8s ease, filter 0.5s ease;
}

.v-wrap video { 
  width: 100%; 
  height: 100%; 
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.v-wrap.is-playing video {
  opacity: 1;
  object-fit: contain;
}

.v-play-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 64px; height: 64px; 
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  z-index: 10; transition: all 0.4s ease;
}
.v-play-btn svg { fill: #fff; width: 20px; height: 20px; transform: translateX(2px); }

.v-info {
  position: absolute; top: 24px; left: 0; right: 0; z-index: 10;
  font-family: 'Inter', sans-serif; 
  opacity: 0.4; font-size: 8px; font-weight: 600;
  letter-spacing: 0.8em; color: #fff; text-transform: uppercase; text-align: center;
}

.v-wrap:hover .v-thumb { transform: scale(1.05); filter: brightness(0.6) blur(0px); }
.v-wrap.is-playing .v-play-btn, .v-wrap.is-playing .v-thumb { opacity: 0; pointer-events: none; }

.quote-container { width: 100%; max-width: 90vw; margin: 0 auto; text-align: center; }
.quote-line { font-family: 'Inter', sans-serif; font-size: clamp(12px, 3.8vw, 17px); font-weight: 400; line-height: 1.5; color: #ffffff; opacity: 0.9; margin: 0; }
.quote-stats { font-family: 'Inter', sans-serif; font-size: clamp(10px, 3vw, 14px); color: #ffffff; opacity: 0.5; margin-top: 10px; font-weight: 500; }
</style>
</head>
<body oncontextmenu="return false;">

<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <div id="d0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">DAY 000</div>
  <div id="t0" class="text-[10px] uppercase tracking-[0.4em] text-white/80 font-f2">LOADING...</div>
</nav>

<main class="relative w-full">
  <section class="h-screen flex flex-col items-center justify-center px-6 relative z-10">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <h1 id="h0" class="font-f1 text-9xl md:text-[16rem] italic tracking-tighter leading-tight md:leading-none z1"></h1>
    </div>
    <div id="sd" class="pb-40 md:pb-24 z1">
      <div class="zs1 zf">Scroll Down</div>
    </div>
  </section>

  <article id="m0" class="max-w-screen-2xl mx-auto px-6 pt-40 pb-20 relative z-10 space-y-72"></article>

  <section id="v-section" class="relative z-10">
    <div id="reflections-header" class="z1 mb-16 text-center px-6 opacity-0">
       <h3 class="font-f2 text-[9px] uppercase tracking-[0.8em] text-white/25">Reflections</h3>
    </div>
    <div id="video-list" class="v-grid"></div>
    
    <div class="z1 text-center px-6 py-20">
        <div class="quote-container">
            <p class="quote-line">You only have 1,440 minutes every day,</p>
            <p class="quote-line">don't let a single one go to waste.</p>
            <p id="live-stats" class="quote-stats"></p>
        </div>
    </div>
</main>

<footer class="w-full flex justify-center px-6 pb-20 relative z-10 z1">
  <div class="text-[9px] uppercase tracking-[0.8em] font-f2 text-white font-medium opacity-30">BY SALMAN FARIS</div>
</footer>

<script>
(function(){
  const themes = ['Zero Excuses', 'Hard Truths', 'Full Focus', 'No Retreat', 'Pure Action'];
  
  // Content arrays...
  const content = [
    ["You know what must be done. You just hate the work. Your mind tells you to wait. It tells you to rest. These are lies. The hard path is the only way to become a man of value. Every day you waste makes the next day harder. Do the work now. Do not wait for a better mood. Your mood does not matter. Only your actions matter. Stick to the plan.", "Time is your only enemy. You have one thousand four hundred and forty minutes today. If you waste them, they never come back. Most people are weak and distracted. They choose comfort over growth. You must be different. Discipline is not a burden. It is the tool that sets you free. Be hard on yourself today so your future self can stand tall.", "Real strength is built when no one is looking. It is built in the early mornings and late nights. Success is not a gift. It is earned through sweat and pain. Stop looking for an easy way. There is no easy way. There is only the work. Do the boring work. Do it well. Do it every single day until it is done."],
    ["Nothing changes if you do nothing. You cannot dream big and work small. Your habits show who you really are. A man who cannot control himself cannot control his life. Stop talking about what you want to do. Start doing it. Hate laziness like it is a disease. Always speak the truth. Stand straight and face your fears.", "Knowledge is nothing without action. Fear nothing but a life of regret. Live with a clear goal. A real man protects his family. He provides for those he loves. He does not follow the crowd. He follows the truth. Every morning is a new chance to fix your life. The time to start is right now. Do not look back.", "When life gets hard, do not quit. Think of a man breaking a rock. He hits it a hundred times and nothing happens. On the next hit, it breaks. It was not just the last hit. It was all the hits before it. This is how success works. Every small step counts. Keep moving forward. Never stop hitting the rock."]
  ];

  const wrapWords = (text) => text.split(/\.\s*/).filter(s => s.trim().length > 0).map(s => `<span class="hi">${s.trim()}.</span> `).join("");

  const updateClockAndStats = () => {
    const now = new Date();
    document.getElementById("t0").textContent = `${now.toLocaleDateString("en-US",{month:"long"}).toUpperCase()} ${now.toLocaleDateString("en-US",{day:"2-digit"})} / ${now.getFullYear()}`;
    const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const remainingMinutes = 1440 - (now.getHours() * 60 + now.getMinutes());
    const statsEl = document.getElementById('live-stats');
    if (statsEl) { statsEl.textContent = `Time: ${timeStr} • ${remainingMinutes} minutes remaining today`; }
  };

  const initVideos = () => {
    const list = document.getElementById('video-list');
    const header = document.getElementById('reflections-header');
    
    // We only create 10-15 video slots initially to keep DOM light, or load as needed
    // Using a more efficient approach:
    for(let i=1; i<=15; i++) {
      const vWrap = document.createElement('div');
      vWrap.className = 'v-wrap z1';
      vWrap.dataset.id = i;
      
      // Use a placeholder or a low-res frame if you have them. 
      // If not, we use a dark background first.
      vWrap.innerHTML = `
        <div class="v-thumb" style="background-image: url('thumbnails/${i}.jpg'), linear-gradient(#111, #000);"></div>
        <div class="v-play-btn"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></div>
        <div class="v-info">VIDEO &nbsp;${String(i).padStart(3, '0')}</div>
        <video preload="none" playsinline muted></video>
      `;
      
      list.appendChild(vWrap);
      
      // Simple existence check
      vWrap.classList.add('is-visible');
      header.classList.remove('opacity-0');
      header.classList.add('za');

      vWrap.addEventListener('click', function() {
        const video = this.querySelector('video');
        if (!video.src) {
            video.src = `videos/${this.dataset.id}.mp4`;
        }
        
        const fs = video.requestFullscreen || video.webkitRequestFullscreen;
        if (fs) {
          video.muted = false;
          this.classList.add('is-playing');
          fs.call(video).then(() => video.play());
        }
      });
    }

    // Observe for fade-in
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add("za");
            // Un-observe to save resources
            observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    
    document.querySelectorAll('.v-wrap').forEach(el => observer.observe(el));
  };

  const init = () => {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    
    document.getElementById("d0").textContent = `DAY ${String(dayOfYear).padStart(3, "0")}`;
    document.getElementById("h0").innerHTML = `The <span class="text-white not-italic">${themes[dayOfYear % 5]}</span>`;
    
    const setIdx = dayOfYear % content.length;
    document.getElementById("m0").innerHTML = `
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(content[setIdx][0])}</p></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05]">${wrapWords(content[setIdx][1])}</p></div>
      <div class="py-24 text-center z1"><h2 class="font-f1 text-8xl md:text-[12rem] italic zb">${themes[dayOfYear % 5].toUpperCase()}.</h2></div>
      <div class="z1"><p class="font-f1 text-6xl md:text-8xl leading-[1.05] zi">${wrapWords(content[setIdx][2])}</p></div>
    `;

    initVideos();
    updateClockAndStats();
    
    const generalObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("za"); });
    }, { threshold: 0.05 });
    document.querySelectorAll(".z1:not(.v-wrap)").forEach(el => generalObserver.observe(el));
  };

  // Scroll handler for highlighting text
  window.addEventListener("scroll", () => {
    const scrollPos = window.scrollY;
    document.getElementById("n0").classList.toggle("zs", scrollPos > 10);
    if (document.getElementById("sd")) document.getElementById("sd").style.opacity = scrollPos > 20 ? "0" : "1";
    
    const spans = document.querySelectorAll(".hi");
    const centerY = window.innerHeight * 0.5;
    let activeSpan = null;
    let minDistance = Infinity;
    
    spans.forEach(span => {
      const rect = span.getBoundingClientRect();
      const dist = Math.abs((rect.top + rect.height / 2) - centerY);
      if (dist < minDistance) { minDistance = dist; activeSpan = span; }
    });
    
    spans.forEach(span => {
      span.classList.toggle("active", span === activeSpan && minDistance < window.innerHeight * 0.4);
    });
  }, { passive: true });

  window.onload = () => {
    init();
    setInterval(updateClockAndStats, 1000);
  };
})();
</script>
</body>
</html>
