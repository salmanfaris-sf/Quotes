<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>salmanfaris.com</title>
    <meta name="description" content="Forge an unbreakable mind. Obey Allah. Obey His Messenger. Be a man of your word. Don't waste time. Stay disciplined. Stay focused. This is the way.">
    <meta name="theme-color" content="#000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --text: #ffffff; --subtext: #777777; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: var(--bg); overflow: hidden; touch-action: none; font-family: 'Inter', sans-serif; color: var(--text); user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        ._f1 { opacity: 0; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        ._f1.v { opacity: 1; }
        ._c1 { max-width: 600px; width: 100%; text-align: center; position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        #_q_ { font-weight: 300; transition: opacity 0.5s ease, color 0.45s ease; white-space: pre-wrap; margin-bottom: 8px; color: var(--text); }
        #_st_ { font-size: 13px; color: var(--subtext); font-weight: 300; letter-spacing: 0.02em; transition: opacity 0.5s ease; line-height: 1.6; margin-bottom: 4px; }
        #_nt_ { position: fixed; top: 40px; left: 50%; transform: translateX(-50%) translateY(-10px); background: rgba(22, 22, 22, 0.9); backdrop-filter: blur(12px); color: #ffffff; padding: 6px 14px; border-radius: 20px; font-size: 10px; font-weight: 400; letter-spacing: 0.02em; opacity: 0; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        #_nt_.s { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="_nt_"></div>

    <div class="_c1 _f1" id="_mc_">
        <h1 id="_q_" class="text-base md:text-lg font-light leading-relaxed tracking-wide"></h1>
        <div id="_st_" class="opacity-0"></div>
    </div>

<script>
(function(){
    const _db = [
        { t: "Be better than you were yesterday." },
        { t: "Race one another in good deeds.\n(Qur'an 2:148)" },
        { t: "Consistency." },
        { t: "Focus." },
        { t: "The problem is,\nyou think you have a lot of time to live." },
        { t: "This is the way." },
        { t: "You already know what to do.\nYou just don’t like the cost." },
        { t: "5… 4… 3… 2… 1. Take action." },
        { t: "Stay Disciplined." }
    ];

    const _qx = document.getElementById('_q_'), _st = document.getElementById('_st_'), _mc = document.getElementById('_mc_'), _nt = document.getElementById('_nt_');
    let _p = [], _l_i = null, _ap = false, _ti = null, _locked = false, _sx = 0, _sy = 0;

    function _gs() {
        const n = new Date();
        let h = n.getHours();
        const m = n.getMinutes().toString().padStart(2, '0');
        const a = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        const e = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 23, 59, 59);
        const ml = Math.floor((e - n) / 60000);
        return { t: `${h}:${m} ${a}`, l: ml };
    }

    function _sn(msg) { _nt.innerText = msg; _nt.classList.add('s'); setTimeout(() => _nt.classList.remove('s'), 1500); }

    function _up() {
        if (_locked) return;
        if (_p.length === 0) _p = [..._db].sort(() => Math.random() - 0.5);
        const nq = _p.pop();
        _qx.style.opacity = '0';
        _st.classList.add('opacity-0');
        setTimeout(() => {
            _qx.innerText = nq.t;
            _qx.style.opacity = '1';
        }, 300);
    }

    window.onload = () => { _p = [..._db].sort(() => Math.random() - 0.5); _qx.innerText = _p.pop().t; requestAnimationFrame(() => _mc.classList.add('v')); };

    document.addEventListener('touchstart', (e) => { _sx = e.touches[0].screenX; _sy = e.touches[0].screenY; }, { passive: true });
    document.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].screenX - _sx;
        const dy = e.changedTouches[0].screenY - _sy;
        
        if (Math.abs(dy) > Math.abs(dx)) {
            if (dy < -50) { // Swipe Up
                document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
                _sn("Fullscreen toggled");
            }
        } else {
            if (dx < -50) { // Swipe Left
                _ap = !_ap;
                if (_ap) { _ti = setInterval(_up, 4000); _sn("Autoplay on"); }
                else { clearInterval(_ti); _sn("Autoplay off"); }
            } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) { _up(); }
        }
    }, { passive: true });
})();
</script>
</body>
</html>
