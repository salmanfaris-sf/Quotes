<link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --b: #000;
            --t: #fff;
            --s: #fff;
            --m: rgba(28, 28, 30, 0.94);
            --accent: #34c759
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        body,
        html {
            overscroll-behavior-y: contain;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: var(--b);
            color: var(--t);
            font-family: -apple-system, system-ui, sans-serif;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center
        }

        .a1 {
            position: fixed;
            top: 35px;
            left: 25px;
            font-size: .75rem;
            letter-spacing: .15rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--s);
            z-index: 15;
            transition: opacity .4s;
            padding: 10px;
            margin: -10px;
            pointer-events: none; /* Disabled interaction entirely */
        }

        .a2 {
            position: fixed;
            top: 20px; /* Aligns with Counter text */
            right: 25px;
            display: flex;
            z-index: 101;
            transition: opacity .4s
        }

        .a2 button#menu-btn {
            background: none;
            border: none;
            color: var(--s);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .a2 button#menu-btn:active {
            opacity: 0.6;
            transform: scale(0.96);
        }

        .menu-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            background: var(--m);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: none;
            border-radius: 14px;
            padding: 0; /* Set to 0 so menu items touch the outer edges */
            display: none;
            flex-direction: column;
            min-width: 150px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            z-index: 200;
            overflow: hidden; /* Clips the background highlights to the outer border-radius */
            animation: fadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .menu-dropdown.active {
            display: flex;
        }

        .menu-item {
            background: none;
            border: none;
            color: var(--s);
            padding: 14px 20px; /* Perfectly balanced touch areas */
            font-size: 0.88rem;
            font-weight: 400;
            text-align: left;
            width: 100%;
            border-radius: 0; /* Edge-to-edge click reaction */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            transition: background 0.1s;
        }

        /* Instant touch active state classes */
        .menu-item:active,
        .menu-item.active-touch {
            background: rgba(255, 255, 255, 0.15);
        }

        .a3 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            pointer-events: none;
            position: relative
        }

        .a4 {
            position: absolute;
            width: 80vw;
            height: 80vw;
            max-width: 400px;
            max-height: 400px;
            pointer-events: none;
            display: none
        }

        .a4.active {
            display: block
        }

        .a5 {
            transform: rotate(-90deg)
        }

        .a6 {
            transition: stroke-dashoffset .35s;
            transform-origin: 50% 50%;
            stroke: var(--accent);
            opacity: .3
        }

        .a7 {
            font-size: .7rem;
            opacity: .5;
            letter-spacing: .1rem;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
            z-index: 5
        }

        .a8 {
            display: none
        }

        .a8.v {
            display: inline-block
        }

        .a9 {
            font-size: 18vw;
            line-height: 1;
            text-align: center;
            padding: 0 10px;
            pointer-events: auto;
            outline: none;
            word-break: break-all;
            max-width: 100%;
            z-index: 5
        }

        .b1 {
            font-size: 1rem;
            letter-spacing: .05rem;
            text-transform: uppercase;
            font-weight: 400;
            color: var(--s);

        .b1.v {

        .b2 {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: .65rem;
            letter-spacing: .01rem;

            color: var(--s);

        .b3 {

            color: var(--s);
            display: flex;
            align-items: stretch;
            overflow: hidden;
            width: max-content;
            max-width: 85vw;
            border-radius: 50px;
            border: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7)
        }

        .b3.active {
            pointer-events: auto;
            opacity: 1;
            top: 80px;
        }

        .b3 span {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            white-space: nowrap
        }

        .b3 button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 0 16px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            transition: background 0.2s;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: none;
        }

        .b3 button.visible {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #lock-overlay {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 85vw;
            max-width: 340px;
            height: 70px;
            background: var(--m);
            border-radius: 35px;
            display: none;
            align-items: center;
            padding: 8px;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5)
        }

        #lock-overlay.active {
            display: flex
        }

        .slider-track {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .slider-text {
            font-size: .85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: .6;
            pointer-events: none;
            font-weight: 500;
            animation: p 2s infinite
        }

        @keyframes p {
            0%, 100% { opacity: .3 }
            50% { opacity: .8 }
        }

        .slider-handle {
            position: absolute;
            left: 0;
            width: 54px;
            height: 54px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            touch-action: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .4);
            z-index: 2
        }

        body.locked .a2,
        body.locked .b2,
        body.locked .a1,
        body.locked .b1 {
            opacity: 0 !important;
            pointer-events: none !important
        }

        body.f .b2,
        body.f .a2,
        body.f .b1,
        body.f .a1 {
            opacity: 0 !important;
            pointer-events: none !important
        }

        body.lockout-active .a1,
        body.lockout-active .a2,
        body.lockout-active .b2,
        body.lockout-active #lock-overlay,
        body.lockout-active #x6,
        body.lockout-active .a7,
        body.lockout-active #y1 {
            display: none !important;
            pointer-events: none !important;
        }

        body.lockout-active #x9 {
            pointer-events: none !important;
        }
    </style>
</head>

<body oncontextmenu="return !1">
    <div class="a1" id="x1"><span>Counter</span></div>
    <div class="a2">
        <button id="menu-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="5" cy="12" r="1.8"></circle>
                <circle cx="12" cy="12" r="1.8"></circle>

            </svg>
        </button>
        <div class="menu-dropdown" id="menu-dropdown">
            <button class="menu-item" id="fs-btn-menu">Fullscreen</button>

        </div>
    </div>
    <div id="x3" class="b3">
        <span id="x4"></span>
        <button id="x5">turn off</button>
    </div>
    <div class="a3">
        <div id="x6" class="a4">

    </div>
    <div class="b2">
        <span>swipe up: edit</span>

            <span class="slider-text">Swipe to unlock</span>
            <div class="slider-handle" id="slider-handle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18l6-6-6-6" />
                </svg>
            </div>
        </div>
    </div>
    <script>
        (function () {
            const d = document, w = window, k = { c: '_n_c', b: '_n_b', s: '_m_s', t: '_n_step', g: '_n_goal' },
                f = d.getElementById('x9'), h = d.getElementById('x3'), i = d.getElementById('y1'),
                ht = d.getElementById('x4'), hb = d.getElementById('x5'), sd = d.getElementById('x7'), gd = d.getElementById('x8'),
                pc = d.getElementById('x6'), rg = d.querySelector('.a6'), 
                mb = d.getElementById('menu-btn'), md = d.getElementById('menu-dropdown'),
                lbMenu = d.getElementById('lock-btn-menu'), fsMenu = d.getElementById('fs-btn-menu'), goalMenu = d.getElementById('goal-btn-menu'),
                lo = d.getElementById('lock-overlay'), sh = d.getElementById('slider-handle');

            let v = parseInt(localStorage.getItem(k.c)) || 0,
                st = parseInt(localStorage.getItem(k.t)) || 1,
                gl = parseInt(localStorage.getItem(k.g)) || 0,
                bd = localStorage.getItem(k.b) === 'true',
                sn = localStorage.getItem(k.s) !== 'false',
                nx = 0, ny = 0, pt = null, qf = 0, rt = null, stt = null, lk = false, isLockout = false;

            const rd = rg.r.baseVal.value,
                cr = rd * 2 * Math.PI;

            rg.style.strokeDasharray = `${cr} ${cr}`;

            function _u() {
                if (stt) clearTimeout(stt);
                i.classList.remove('v');
                stt = setTimeout(() => { if(!isLockout) i.classList.add('v') }, 5e3)
            }

            // Web Speech API - Text to Speech function
            function _p(textToSpeak) {
                if (sn) return; // Mute if speech is turned off
                if ('speechSynthesis' in w) {
                    // Instantly cancel any ongoing speaking to prevent speech lag on rapid taps
                    w.speechSynthesis.cancel();
                    
                    const utterance = new SpeechSynthesisUtterance(textToSpeak.toString());
                    utterance.rate = 1.15; // Crisp, slightly fast speech for seamless counting
                    utterance.pitch = 1.0;
                    utterance.volume = 1.0;
                    
                    w.speechSynthesis.speak(utterance);
                }
            }

            function _up() {
                if (gl > 0) {
                    pc.classList.add('active');
                    const o = cr - (Math.min(v, gl) / gl) * cr;
                    rg.style.strokeDashoffset = o;
                    rg.style.opacity = v >= gl ? 1 : .3;
                    rg.style.stroke = v >= gl ? 'var(--accent)' : '#fff'
                } else pc.classList.remove('active')
            }

            function _w() {
                f.textContent = v.toLocaleString('en-US');
                f.style.fontWeight = bd ? '700' : '100';
                if (st > 1) {
                    sd.textContent = 'Increment: ' + st;
                    sd.classList.add('v')
                } else sd.classList.remove('v');

                if (gl > 0) {
                    gd.textContent = 'Goal: ' + gl.toLocaleString('en-US');
                    gd.classList.add('v')
                } else gd.classList.remove('v');
                _up()
            }

            function _x() {
                localStorage.setItem(k.c, v);
                localStorage.setItem(k.b, bd);
                localStorage.setItem(k.s, sn);
                localStorage.setItem(k.t, st);
                localStorage.setItem(k.g, gl)
            }

            function _z(m, du, showBtn = false) {
                if (rt) clearTimeout(rt);
                ht.textContent = m;
                if (showBtn) {
                    hb.classList.add('visible');
                    du = 9999999;
                    isLockout = true;
                    d.body.classList.add('lockout-active');
                } else {
                    hb.classList.remove('visible');
                }
                h.classList.add('active');
                rt = setTimeout(() => {
                    h.classList.remove('active');
                    rt = null
                }, du)
            }

            mb.onclick = e => {
                e.stopPropagation();
                md.classList.toggle('active');
            };

            d.addEventListener('click', e => {
                if (!e.target.closest('.a2')) {
                    md.classList.remove('active');
                }
            });

            // Instant touch responsiveness for all menu items
            d.querySelectorAll('.menu-item').forEach(btn => {
                btn.addEventListener('touchstart', () => {
                    btn.classList.add('active-touch');
                }, { passive: true });
                btn.addEventListener('touchend', () => {
                    btn.classList.remove('active-touch');
                }, { passive: true });
                btn.addEventListener('touchcancel', () => {
                    btn.classList.remove('active-touch');
                }, { passive: true });
            });

            lbMenu.onclick = e => {
                e.stopPropagation();
                md.classList.remove('active');
                lk = true;
                d.body.classList.add('locked');
                lo.classList.add('active');
                if (navigator.vibrate) navigator.vibrate(50)
            };

            fsMenu.onclick = e => {
                e.stopPropagation();
                md.classList.remove('active');
                if (!d.fullscreenElement) d.documentElement.requestFullscreen().catch(() => { });
                else d.exitFullscreen().catch(() => { })
            };

            function triggerSetGoal() {
                const r = prompt('Set Target Goal (current: ' + (gl || 'none') + '). Enter 0 to remove.', gl || '');
                if (r !== null) {
                    const n = parseInt(r);
                    if (!isNaN(n) && n >= 0) {
                        gl = n;
                        if (gl > 0) {
                            v = 0;
                            _z(`goal set to ${gl}`, 2000);
                        } else {
                            _z('goal removed', 2000);
                        }
                        _w();
                        _x();
                    }
                }
            }

            goalMenu.onclick = e => {
                e.stopPropagation();
                md.classList.remove('active');
                triggerSetGoal();
            };

            let sx = 0, cx = 0;
            sh.addEventListener('touchstart', e => {
                sx = e.touches[0].clientX;
                sh.style.transition = ''
            });

            sh.addEventListener('touchmove', e => {
                const dx = e.touches[0].clientX - sx,
                    mx = lo.offsetWidth - sh.offsetWidth - 16;
                cx = Math.max(0, Math.min(dx, mx));
                sh.style.transform = `translateX(${cx}px)`;
                if (cx >= mx * .98) {
                    lk = false;
                    d.body.classList.remove('locked');
                    lo.classList.remove('active');
                    sh.style.transform = 'translateX(0)';
                    if (navigator.vibrate) navigator.vibrate([10, 30, 10])
                }
            });

            sh.addEventListener('touchend', () => {
                if (lk) {
                    sh.style.transition = 'transform .4s cubic-bezier(.175,.885,.32,1.275)';
                    sh.style.transform = 'translateX(0)'
                }
            });

            f.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    f.blur()
                }
            });

            hb.onclick = e => {
                e.stopPropagation();
                gl = 0;
                isLockout = false;
                d.body.classList.remove('lockout-active');
                _w();
                _x();
                h.classList.remove('active');
                if (rt) clearTimeout(rt);
                setTimeout(() => _z('goal removed', 2000), 400);
            };

            d.body.addEventListener('touchstart', e => {
                if (lk || isLockout) return;
                _u();
                if (e.target.closest('.a2') || e.target.closest('.a1') || e.target.closest('.b3') || e.target.closest('#lock-overlay')) return;
                nx = e.touches[0].clientX;
                ny = e.touches[0].clientY;
                pt = setTimeout(() => {
                    sn = !sn;
                    qf = 1;
                    if (navigator.vibrate) navigator.vibrate(50);
                    _z(sn ? 'voice off' : 'voice on', 2000)
                }, 800)
            });

            d.body.addEventListener('touchend', e => {
                if (lk || isLockout) return;
                if (e.target.closest('.a2') || e.target.closest('.a1') || e.target.closest('.b3') || e.target.closest('#lock-overlay')) return;
                if (pt) { clearTimeout(pt); pt = null }
                if (qf) { qf = 0; return }
                if (f.contentEditable === 'true') { f.blur(); return }

                const dx = nx - e.changedTouches[0].clientX,
                    dy = ny - e.changedTouches[0].clientY;

                if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
                    const p = v;
                    v += st;
                    _p(v); // Speak new value
                    if (gl > 0 && p < gl && v >= gl) {
                        if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
                        _z('goal reached!', 9999999, true);
                    }
                    _w()
                } else if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 50) {
                        if (confirm('Reset counter to 0?')) {
                            if (navigator.vibrate) navigator.vibrate(40);
                            v = 0; _w(); _x(); _z('counter reset', 2000)
                        }
                    } else if (dx < -50) {
                        const r = prompt('Set Increment (current: ' + st + ')', st);
                        if (r !== null) {
                            const n = parseInt(r);
                            st = (!isNaN(n) && n > 0) ? n : 1;
                            _z(`increment set to ${st}`, 2000);
                            _w(); _x()
                        }
                    }
                } else {
                    if (dy > 50) {
                        f.contentEditable = 'true';
                        f.focus();
                        const r = d.createRange(), s = w.getSelection();
                        r.selectNodeContents(f); r.collapse(!1);
                        s.removeAllRanges(); s.addRange(r)
                    } else if (dy < -50) {
                        if (v > 0) {
                            if (confirm(`Subtract ${st} from counter?`)) {
                                if (navigator.vibrate) navigator.vibrate(40);
                                v = (v >= st) ? v - st : 0;
                                _p(v); // Speak new subtracted value
                                _w(); _x(); _z('number subtracted', 2000)
                            }
                        }
                    }
                }
            });

            d.addEventListener('fullscreenchange', () => {
                d.body.classList.toggle('f', !!d.fullscreenElement)
            });

            f.onblur = () => {
                f.contentEditable = 'false';
                let r = f.textContent.replace(/[^\d]/g, '');
                v = r === '' ? 0 : parseInt(r);
                _w(); _x(); _u()
            };

            _w();
            stt = setTimeout(() => { i.classList.add('v') }, 0)
        })()
    </script>
