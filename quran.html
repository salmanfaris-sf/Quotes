<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#000000">
<title>Qur'an Recitations</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{
        sans:['Inter', 'system-ui', '-apple-system', 'sans-serif']
      },
      colors:{c1:'#000000',c2:'#C5A059'}
    }
  }
}
</script>
<style>
html { background-color: #000000; scroll-behavior: smooth; }
body { 
    margin: 0; 
    background-color: #000000;
    color: #ffffff; 
    font-smoothing: antialiased; 
    overflow-x: hidden; 
}

/* Transitions */
.z1{opacity:0;transform:translateY(10px);transition:all 0.8s ease-out}
.z1.za{opacity:1;transform:translateY(0)}

/* Item Rows */
.audio-card {
    background: transparent;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding: 30px 0;
    transition: opacity 0.3s ease;
    cursor: pointer;
}
.audio-card:hover { opacity: 0.7; }
.audio-card.active { border-bottom-color: #C5A059; }

/* Search Input */
.search-input {
    background: transparent;
    color: white;
    font-size: 1.1rem;
    width: 100%;
    padding: 15px 0;
    outline: none;
    text-align: center;
    border: none;
}
.search-input::placeholder { color: rgba(255,255,255,0.3); }

/* Play Indicator */
.playing-indicator { display: flex; align-items: flex-end; gap: 3px; height: 12px; }
.playing-indicator span { width: 1.5px; background: #C5A059; animation: bar-up 0.8s ease-in-out infinite alternate; }
.playing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.playing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bar-up { 0% { height: 3px; } 100% { height: 12px; } }

/* Player Overlay */
#fs-player {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000000; z-index: 100;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.5s ease;
}
#fs-player.active { display: flex; opacity: 1; }

/* Timeline */
.progress-area { width: 100%; padding: 40px 0; cursor: pointer; }
.progress-container { width: 100%; height: 2px; background: rgba(255, 255, 255, 0.1); position: relative; }
.progress-bar { height: 100%; background: #C5A059; width: 0%; transition: width 0.1s linear; }

#yt-container { position: absolute; visibility: hidden; pointer-events: none; }
</style>
</head>
<body class="font-sans">

<main class="pt-20 pb-40 px-6">
    <section class="max-w-md mx-auto mb-16 z1">
        <div class="border-b border-white/10">
            <input type="text" id="search-bar" placeholder="Search recitations" class="search-input" oninput="filterLibrary()">
        </div>
    </section>

    <section id="library-grid" class="max-w-2xl mx-auto"></section>
</main>

<!-- Full Screen Player -->
<div id="fs-player">
    <div class="text-center w-full px-8">
        <h2 id="fs-title" class="text-4xl md:text-6xl font-medium tracking-tight mb-4"></h2>
        <p id="fs-reciter" class="text-sm tracking-widest uppercase text-white/40 mb-20"></p>
        
        <div class="flex items-center justify-center space-x-12 mb-20">
            <button onclick="seekRel(-10)" class="text-white/30 hover:text-white transition-colors">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
            </button>
            <button onclick="togglePlay()" class="w-20 h-20 rounded-full border border-white/20 flex items-center justify-center text-white hover:border-white transition-all">
                <svg id="fs-icon-svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5V19L19 12L8 5Z"/>
                </svg>
            </button>
            <button onclick="seekRel(10)" class="text-white/30 hover:text-white transition-colors">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            </button>
        </div>

        <div class="max-w-md mx-auto">
            <div class="progress-area" onclick="handleProgressBarClick(event)">
                <div class="progress-container">
                    <div id="fs-progress" class="progress-bar"></div>
                </div>
            </div>
            <div class="flex justify-between text-[10px] tracking-tighter opacity-30 mt-2 uppercase font-medium">
                <span id="fs-curr">00:00</span>
                <span id="fs-dur">00:00</span>
            </div>
        </div>
    </div>

    <button onclick="closeFS()" class="absolute top-10 right-10 text-white/20 hover:text-white text-xs uppercase tracking-widest transition-colors">Close</button>
</div>

<div id="yt-container"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player, activeId = null, progressInterval;

const recitationLibrary = [
    { title: "Surah Fatir (1-18)", reciter: "Abdul Basit Abdussamad", id: "2aUV7aA2Vs8" },
    { title: "Surah Yusuf", reciter: "Muhammad Hisham", id: "C0idKuUWdmU" },
    { title: "Surah Al-Baqarah", reciter: "Muhammad Hisham", id: "qfa9eYbyfWA" },
    { title: "Surah Al-Kahf", reciter: "Raad Al Kurdi", id: "jHZMsEinTwk" },
    { title: "Surah Al-Insan", reciter: "Omar Hisham", id: "JRn8Xc41nUI" },
    { title: "Surah Maryam", reciter: "Sherif Mostafa", id: "Jrtn8SPrMiw" }
];

function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-container', {
        height: '1', width: '1',
        playerVars: { 'autoplay': 0, 'controls': 0, 'modestbranding': 1, 'rel': 0, 'enablejsapi': 1, 'playsinline': 1 },
        events: {
            'onStateChange': (e) => {
                if (e.data == YT.PlayerState.PLAYING) {
                    startProgress();
                    updateIcons(true);
                    updateLibraryStatus();
                } else {
                    clearInterval(progressInterval);
                    updateIcons(false);
                    updateLibraryStatus();
                }
            }
        }
    });
}

function renderLibrary(list = recitationLibrary) {
    const grid = document.getElementById('library-grid');
    grid.innerHTML = list.map(item => `
        <div class="audio-card z1 ${activeId === item.id ? 'active' : ''}" data-id="${item.id}" onclick='openFS(${JSON.stringify(item)})'>
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="text-xl font-normal text-white/90">${item.title}</h3>
                    <p class="text-[10px] tracking-widest uppercase text-white/30 mt-1">${item.reciter}</p>
                </div>
                <div class="status-indicator"></div>
            </div>
        </div>
    `).join('');
    
    setTimeout(() => {
        const obs = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('za'); }), { threshold: 0.1 });
        document.querySelectorAll('.z1').forEach(el => obs.observe(el));
    }, 50);
    updateLibraryStatus();
}

function filterLibrary() {
    const query = document.getElementById('search-bar').value.toLowerCase();
    const filtered = recitationLibrary.filter(i => i.title.toLowerCase().includes(query) || i.reciter.toLowerCase().includes(query));
    renderLibrary(filtered);
}

function openFS(item) {
    document.getElementById('fs-title').textContent = item.title;
    document.getElementById('fs-reciter').textContent = item.reciter;
    const fs = document.getElementById('fs-player');
    fs.style.display = 'flex';
    setTimeout(() => fs.classList.add('active'), 10);
    
    if (activeId !== item.id) {
        activeId = item.id;
        player.loadVideoById(item.id);
    } else {
        player.playVideo();
    }
}

function closeFS() {
    const fs = document.getElementById('fs-player');
    fs.classList.remove('active');
    setTimeout(() => fs.style.display = 'none', 500);
}

function updateLibraryStatus() {
    document.querySelectorAll('.audio-card').forEach(card => {
        const id = card.getAttribute('data-id');
        const indicator = card.querySelector('.status-indicator');
        const isPlaying = activeId === id && player && player.getPlayerState() === 1;
        card.classList.toggle('active', activeId === id);
        indicator.innerHTML = isPlaying ? `<div class="playing-indicator"><span></span><span></span><span></span></div>` : '';
    });
}

function togglePlay() {
    if (player.getPlayerState() === 1) player.pauseVideo();
    else player.playVideo();
}

function seekRel(sec) {
    player.seekTo(player.getCurrentTime() + sec, true);
}

function handleProgressBarClick(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const p = (e.clientX - rect.left) / rect.width;
    player.seekTo(player.getDuration() * p, true);
}

function startProgress() {
    clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        const time = player.getCurrentTime(), dur = player.getDuration();
        if (dur > 0) {
            document.getElementById('fs-progress').style.width = (time / dur * 100) + '%';
            document.getElementById('fs-curr').textContent = formatTime(time);
            document.getElementById('fs-dur').textContent = formatTime(dur);
        }
    }, 500);
}

function formatTime(s) {
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

function updateIcons(playing) {
    document.getElementById('fs-icon-svg').innerHTML = playing ? '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>' : '<path d="M8 5V19L19 12L8 5Z"/>';
}

window.onload = () => renderLibrary();
</script>
</body>
</html>
