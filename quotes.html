<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Quotes.</title>
    <meta name="theme-color" content="#000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1K1TKBQFFK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1K1TKBQFFK');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --text: #e5e7eb;
            --glass: rgba(25, 25, 25, 0.9);
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .fade-entrance {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-entrance.visible {
            opacity: 1;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-10px);
        }

        #g4x_txt {
            transition: opacity 0.5s ease;
            white-space: pre-wrap;
            margin-bottom: 8px; 
        }

        #live_info {
            font-size: 13px;
            color: #888;
            font-weight: 300;
            letter-spacing: 0.05em;
            transition: opacity 0.5s ease;
            line-height: 1.6;
            margin-bottom: 2px;
        }

        .tap-hint {
            font-size: 10px;
            color: #444;
            transition: opacity 0.8s ease;
            white-space: nowrap;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            pointer-events: none;
            min-height: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 6px; /* Reduced distance */
        }

        .hidden-hint {
            opacity: 0 !important;
            pointer-events: none;
        }

        #notification {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 3000;
        }

        #notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #menu_panel {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%) translateY(180%);
            width: fit-content;
            min-width: 260px;
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
            border: none;
            z-index: 2000;
            padding: 6px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.9);
        }

        #menu_panel.open {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .menu-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.08);
            margin: 0 4px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            border-radius: 100px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
            white-space: nowrap;
        }

        .menu-item:active {
            background: rgba(255, 255, 255, 0.06);
            transform: scale(0.95);
        }

        .menu-label {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .menu-action {
            font-size: 11px;
            color: #fff;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        #swipe_indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: #333;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transition: opacity 0.8s ease;
            pointer-events: none;
            white-space: nowrap;
            opacity: 0;
        }

        /* Menu Overlay - No background dimming requested */
        #menu_overlay {
            position: fixed;
            inset: 0;
            background: transparent;
            visibility: hidden;
            z-index: 1500;
        }
        #menu_overlay.visible {
            visibility: visible;
        }
    </style>
</head>
<body id="body">

    <div id="notification">Action Performed</div>
    <div id="menu_overlay"></div>

    <div class="container fade-entrance" id="main_content">
        <h1 id="g4x_txt" class="text-base md:text-lg font-light leading-relaxed tracking-wide"></h1>
        <div id="live_info" class="opacity-0"></div>
        <div id="hint" class="tap-hint opacity-0">TAP TO VIEW NEXT QUOTE</div>
    </div>

    <div id="swipe_indicator">Swipe up for menu</div>

    <div id="menu_panel">
        <div class="menu-item" id="btn_autoplay">
            <span class="menu-label">Autoplay</span>
            <span class="menu-action" id="autoplay_status">OFF</span>
        </div>

        <div class="menu-divider"></div>

        <div class="menu-item" id="btn_fullscreen">
            <span class="menu-label">Display</span>
            <span class="menu-action" id="fs_status">FULLSCREEN</span>
        </div>
    </div>

<script>
(function(){
    const quotes = [
        { t: "Be better than you were yesterday." },
        { t: "So race one another in good deeds.\n(Qur'an 2:148)" },
        { t: "Don't waste time. You don't get it back." },
        { t: "Focus." },
        { t: "The problem is,\nyou think you have a lot of time to live." },
        { t: "Live everyday like it's your last day." },
        { t: "Consistency." },
        { t: "Big dreams need big sacrifices." },
        { t: "Practice makes perfect." },
        { t: "Do it even when you don't feel like it." },
        { t: "Nothing changes if nothing changes." },
        { t: "Stay different." },
        { t: "You only have 1,440 minutes every day, don’t let a single one go to waste.", id: "time_quote" },
        { t: "You can't have a million-dollar dream with a minimum-wage work ethic." },
        { t: "A real man protects and provides." },
        { t: "Don't follow the crowd. Follow the truth." },
        { t: "Never build your happiness on someone else's tears." },
        { t: "Eliminate the 'tomorrow' mindset today." },
        { t: "The strongest man is he who controls his anger." },
        { t: "Be a man of your word." },
        { t: "Your habits define your future self." },
        { t: "Hate Laziness." },
        { t: "Always speak the truth." },
        { t: "Time waits for no one." },
        { t: "Quality over quantity in everything." },
        { t: "Knowledge without action is useless." },
        { t: "Fear Allah. Not people." },
        { t: "Live with purpose." },
        { t: "Be a man of honor." },
        { t: "A real man protects those who are vulnerable." },
        { t: "Every day is a second chance." },
        { t: "Now is the time." },
        { t: "Success is earned, not given." },
        { t: "Focus on your growth." },
        { t: "Stay Disciplined." },
        { t: "A heart connected to Allah is never truly broken." },
        { t: "Growth begins outside comfort zones." },
        { t: "This is the way." },
        { t: "Hard days make strong people." },
        { t: "Keep showing up." },
        { t: "Strength is built through repetition." },
        { t: "Do the boring work well." },
        { t: "Consistency creates mastery." },
        { t: "Work now, Relax later." },
        { t: "Don't look back. You're not going that way."},
        { t: "Every day counts." },
        { t: "Habits decide outcomes." },
        { t: "Growth requires discomfort." },
        { t: "Sweat more in practice. Bleed less in war." },
        { t: "Consistency is key." },
        { t: "It always seems impossible until it's done." },
        { t: "Focus is a superpower in a distracted world." },
        { t: "Weakness leaves when discipline enters." },
        { t: "Strength is built through patience." },
        { t: "Be strict with yourself." },
        { t: "Zero Excuses." },
        { t: "You already know what to do. You just don’t like the cost." },
        { t: "The brain will invent reasons to avoid pain, even when pain is the only path forward." },
        { t: "Every wasted year makes the next one heavier." },
        { t: "Do it the moment you remember it." },
        { t: "Stick to the plan. Not your mood." },
        { t: "5… 4… 3… 2… 1. Take action." },
        { t: "Indeed Shaytan is ever, to mankind, a clear enemy.\n- Surah Al-Isra: 53"},
        { t: "Prophet Muhammad ﷺ said:\nThere are two blessings that many people are deceived into losing: health and free time.\n- Sahih al-Bukhari 6412" },
        { t: "If not now, Then when?" },
        { t: "Leave a legacy. Let your life be a story of courage, action, and impact." },
        { t: "NOW.\nWaiting won’t help.\nOverthinking won’t help.\nAction will.\nDo it." },
        { t: "Lower your gaze, guard your tongue, and protect your heart." },
        { t: "Your current life is the result of past actions. Your future will be the result of today's actions." },
        { t: "The man who keeps walking will eventually leave the place he hates." },
        { t: "A few years of sacrifice can create a lifetime of freedom." },
        { t: "Your future is built by what you do after a long tiring day." },
        { t: "Speak clearly. Stand straight. Fear none."},
        { t: "Its what's inside that matters." }
    ];

    const display = document.getElementById('g4x_txt');
    const hintArea = document.getElementById('hint');
    const infoDisplay = document.getElementById('live_info');
    const mainContent = document.getElementById('main_content');
    const notification = document.getElementById('notification');
    const menu = document.getElementById('menu_panel');
    const overlay = document.getElementById('menu_overlay');
    const apStatus = document.getElementById('autoplay_status');
    const fsStatus = document.getElementById('fs_status');
    const swipeIndicator = document.getElementById('swipe_indicator');
    
    let firstInteraction = true;
    let quotePool = [];
    let liveInterval = null;
    let autoplayActive = false;
    let autoplayInterval = null;
    const AUTOPLAY_DURATION = 5000; 

    let touchStartY = 0;
    let isMenuOpen = false;

    function getLiveStats() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        const timeStr = `${hours}:${minutes} ${ampm}`;
        const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
        const diff = endOfDay - now;
        const minsLeft = Math.floor(diff / 1000 / 60);
        return { time: timeStr, left: minsLeft };
    }

    function refreshPool() {
        const lastQuoteText = display.innerText;
        quotePool = [...quotes].sort(() => Math.random() - 0.5);
        if (quotePool.length > 1 && quotePool[quotePool.length - 1].t === lastQuoteText) {
             const sameOne = quotePool.pop();
             quotePool.unshift(sameOne);
        }
    }

    function showNotification(text) {
        notification.innerText = text;
        notification.classList.add('show');
        setTimeout(() => notification.classList.remove('show'), 1800);
    }

    function updateDisplay() {
        if (quotePool.length === 0) refreshPool();

        const nextQuote = quotePool.pop();
        display.style.opacity = '0';
        infoDisplay.classList.add('opacity-0');
        
        if (firstInteraction) {
            hintArea.classList.add('hidden-hint');
            swipeIndicator.style.opacity = '0'; 
        }
        
        if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }

        setTimeout(() => {
            display.innerText = nextQuote.t;
            display.style.opacity = '1';
            firstInteraction = false;

            if (nextQuote.id === "time_quote") {
                const updateUI = () => {
                    const stats = getLiveStats();
                    infoDisplay.innerHTML = `Time: ${stats.time} • ${stats.left} minutes remaining today`;
                };
                updateUI();
                infoDisplay.classList.remove('opacity-0');
                liveInterval = setInterval(updateUI, 30000);
            } else {
                infoDisplay.innerHTML = "";
                infoDisplay.classList.add('opacity-0');
            }
        }, 300);
    }

    function openMenu() {
        isMenuOpen = true;
        menu.classList.add('open');
        overlay.classList.add('visible');
        swipeIndicator.style.opacity = '0'; 
    }

    function closeMenu() {
        isMenuOpen = false;
        menu.classList.remove('open');
        overlay.classList.remove('visible');
    }

    function toggleAutoplay(e) {
        e.stopPropagation();
        autoplayActive = !autoplayActive;
        apStatus.innerText = autoplayActive ? "ON" : "OFF";
        apStatus.style.color = autoplayActive ? "#4ADE80" : "#FFF";
        if (autoplayActive) {
            autoplayInterval = setInterval(updateDisplay, AUTOPLAY_DURATION);
            showNotification("Autoplay Started");
        } else {
            clearInterval(autoplayInterval);
            showNotification("Autoplay Stopped");
        }
    }

    function toggleFullscreen(e) {
        e.stopPropagation();
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {
                showNotification("Denied");
            });
            fsStatus.innerText = "EXIT";
        } else {
            document.exitFullscreen();
            fsStatus.innerText = "FULLSCREEN";
        }
    }

    document.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
        const touchEndY = e.changedTouches[0].clientY;
        const deltaY = touchStartY - touchEndY;

        if (deltaY > 60 && !isMenuOpen) {
            openMenu();
            return;
        }

        if (deltaY < -60 && isMenuOpen) {
            closeMenu();
            return;
        }

        if (Math.abs(deltaY) < 10) {
            if (isMenuOpen) {
                if (!menu.contains(e.target)) {
                    closeMenu();
                }
            } else {
                updateDisplay();
            }
        }
    }, { passive: true });

    overlay.onclick = closeMenu;
    document.getElementById('btn_autoplay').onclick = toggleAutoplay;
    document.getElementById('btn_fullscreen').onclick = toggleFullscreen;

    window.onload = () => {
        refreshPool();
        const initial = quotePool.pop();
        display.innerText = initial.t;
        
        if (initial.id === "time_quote") {
            const stats = getLiveStats();
            infoDisplay.innerHTML = `Time: ${stats.time} • ${stats.left} minutes remaining today`;
            infoDisplay.classList.remove('opacity-0');
        }

        requestAnimationFrame(() => {
            mainContent.classList.add('visible');
            setTimeout(() => {
                if (firstInteraction) {
                    hintArea.classList.remove('opacity-0');
                    swipeIndicator.style.opacity = '1'; 
                }
            }, 1000);
        });
    };

    // Update button text if fullscreen state changes via system/keys
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            fsStatus.innerText = "FULLSCREEN";
        } else {
            fsStatus.innerText = "EXIT";
        }
    });

})();
</script>
</body>
</html>
