<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Powerful Quotes.</title>
    <meta name="theme-color" content="#000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1K1TKBQFFK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1K1TKBQFFK');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --text: #ffffff; 
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Adjusted for bottom alignment */
            padding: 60px 20px 40px 20px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .fade-entrance {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-entrance.visible {
            opacity: 1;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1; /* Pushes content to occupy space */
            justify-content: center; /* Keeps quote vertically centered in its space */
        }

        #g4x_txt {
            transition: opacity 0.5s ease;
            white-space: pre-wrap;
            margin-bottom: 8px; 
            text-transform: uppercase;
            font-size: 0.72rem; 
            letter-spacing: 0.08em;
            font-weight: 500;
            line-height: 2.2;
        }

        @media (min-width: 768px) {
            #g4x_txt { font-size: 0.82rem; }
        }

        #live_info {
            font-size: 11px;
            color: #777;
            font-weight: 300;
            letter-spacing: 0.05em;
            transition: opacity 0.5s ease;
            line-height: 1.6;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .tap-hint {
            font-size: 10px;
            color: #666; /* Brightened from #444 */
            transition: opacity 0.8s ease;
            white-space: nowrap;
            letter-spacing: 0.15em;
            text-transform: uppercase; /* Forced Capitalization */
            pointer-events: none;
            width: 100%;
            text-align: center;
            margin-top: auto; /* Push to bottom of container */
        }

        .hidden-hint {
            opacity: 0 !important;
            pointer-events: none;
        }

        #notification {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 100;
        }

        #notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="notification">Autoplay On</div>

    <div class="container fade-entrance" id="main_content">
        <h1 id="g4x_txt"></h1>
        <div id="live_info" class="opacity-0"></div>
    </div>
    
    <div id="hint" class="tap-hint opacity-0 fade-entrance">Tap anywhere to view next quote</div>

<script>
(function(){
    const quotes = [
        { t: "BE BETTER THAN YOU WERE YESTERDAY." },
        { t: "SO RACE ONE ANOTHER IN GOOD DEEDS.\n(QUR'AN 2:148)" },
        { t: "DON'T WASTE TIME.\nYOU DON'T GET IT BACK." },
        { t: "FOCUS." },
        { t: "THE PROBLEM IS,\nYOU THINK YOU HAVE A LOT OF TIME TO LIVE." },
        { t: "LIVE EVERYDAY LIKE IT'S YOUR LAST DAY." },
        { t: "CONSISTENCY." },
        { t: "BIG DREAMS NEED BIG SACRIFICES." },
        { t: "PRACTICE MAKES PERFECT." },
        { t: "DO IT EVEN WHEN YOU DON'T FEEL LIKE IT." },
        { t: "NOTHING CHANGES IF NOTHING CHANGES." },
        { t: "STAY DIFFERENT." },
        { t: "YOU ONLY HAVE 1,440 MINUTES EVERY DAY.\nDON’T LET A SINGLE ONE GO TO WASTE.", id: "time_quote" },
        { t: "YOU CAN'T HAVE A MILLION-DOLLAR DREAM\nWITH A MINIMUM-WAGE WORK ETHIC." },
        { t: "A REAL MAN PROTECTS AND PROVIDES." },
        { t: "DON'T FOLLOW THE CROWD.\nFOLLOW THE TRUTH." },
        { t: "NEVER BUILD YOUR HAPPINESS ON\n SOMEONE ELSE'S TEARS." },
        { t: "ELIMINATE THE 'TOMORROW' MINDSET TODAY." },
        { t: "THE STRONGEST MAN IS HE WHO CONTROLS HIS ANGER." },
        { t: "BE A MAN OF YOUR WORD." },
        { t: "YOUR HABITS DEFINE YOUR FUTURE SELF." },
        { t: "HATE LAZINESS." },
        { t: "ALWAYS SPEAK THE TRUTH." },
        { t: "TIME WAITS FOR NO ONE." },
        { t: "QUALITY OVER QUANTITY IN EVERYTHING." },
        { t: "KNOWLEDGE WITHOUT ACTION IS USELESS." },
        { t: "FEAR ALLAH.\nNOT PEOPLE." },
        { t: "LIVE WITH PURPOSE." },
        { t: "BE A MAN OF HONOR." },
        { t: "A REAL MAN PROTECTS THOSE WHO ARE VULNERABLE." },
        { t: "EVERY DAY IS A SECOND CHANCE." },
        { t: "NOW IS THE TIME." },
        { t: "SUCCESS IS EARNED, NOT GIVEN." },
        { t: "FOCUS ON YOUR GROWTH." },
        { t: "STAY DISCIPLINED." },
        { t: "A HEART CONNECTED TO ALLAH IS\n NEVER TRULY BROKEN." },
        { t: "GROWTH BEGINS OUTSIDE COMFORT ZONES." },
        { t: "THIS IS THE WAY." },
        { t: "HARD DAYS MAKE STRONG PEOPLE." },
        { t: "KEEP SHOWING UP." },
        { t: "STRENGTH IS BUILT THROUGH REPETITION." },
        { t: "DO THE BORING WORK WELL." },
        { t: "CONSISTENCY CREATES MASTERY." },
        { t: "WORK NOW.\nRELAX LATER." },
        { t: "DON'T LOOK BACK.\nYOU'RE NOT GOING THAT WAY."},
        { t: "EVERY DAY COUNTS." },
        { t: "HABITS DECIDE OUTCOMES." },
        { t: "GROWTH REQUIRES DISCOMFORT." },
        { t: "SWEAT MORE IN PRACTICE.\nBLEED LESS IN WAR." },
        { t: "WHEN YOU FEEL LIKE NOTHING IS GOING YOUR WAY, LOOK AT A PERSON BREAKING A STONE.\nTHEY CAN HIT A BIG ROCK 100 TIMES AND IT WON'T EVEN MOVE.\nBUT ON THE 101ST HIT, IT SUDDENLY BREAKS INTO TWO PIECES.\nIT WASN'T JUST THAT LAST HIT THAT BROKE IT—IT WAS THE RESULT OF ALL THE HITS THAT HAPPENED BEFORE IT." },
        { t: "IT ALWAYS SEEMS IMPOSSIBLE UNTIL IT'S DONE." },
        { t: "FOCUS IS A SUPERPOWER IN A\n DISTRACTED WORLD." },
        { t: "WEAKNESS LEAVES WHEN DISCIPLINE ENTERS." },
        { t: "STRENGTH IS BUILT THROUGH PATIENCE." },
        { t: "BE STRICT WITH YOURSELF." },
        { t: "ZERO EXCUSES." },
        { t: "YOU ALREADY KNOW WHAT TO DO.\nYOU JUST DON’T LIKE THE COST." },
        { t: "THE BRAIN WILL INVENT REASONS TO AVOID PAIN, EVEN WHEN PAIN IS THE ONLY PATH FORWARD." },
        { t: "EVERY WASTED YEAR MAKES THE NEXT ONE HEAVIER." },
        { t: "DO IT THE MOMENT YOU REMEMBER IT." },
        { t: "STICK TO THE PLAN.\nNOT YOUR MOOD." },
        { t: "5… 4… 3… 2… 1.\nTAKE ACTION." },
        { t: "INDEED SHAYTAN IS EVER, TO MANKIND,\nA CLEAR ENEMY.\n(QUR'AN 17:53)"},
        { t: "PROPHET MUHAMMAD ﷺ SAID:\nTHERE ARE TWO BLESSINGS THAT MANY PEOPLE ARE DECEIVED INTO LOSING: HEALTH AND FREE TIME.\n- SAHIH AL-BUKHARI 6412" },
        { t: "IF NOT NOW, THEN WHEN?" },
        { t: "LEAVE A LEGACY.\nLET YOUR LIFE BE A STORY OF COURAGE, ACTION, AND IMPACT." },
        { t: "NOW.\nWAITING WON’T HELP.\nOVERTHINKING WON’T HELP.\nACTION WILL.\nDO IT." },
        { t: "LOWER YOUR GAZE.\nGUARD YOUR TONGUE.\nAND PROTECT YOUR HEART." },
        { t: "YOUR CURRENT LIFE IS THE RESULT OF PAST ACTIONS.\nYOUR FUTURE WILL BE THE RESULT OF TODAY'S ACTIONS." },
        { t: "THE MAN WHO KEEPS WALKING WILL EVENTUALLY LEAVE THE PLACE HE HATES." },
        { t: "A FEW YEARS OF SACRIFICE CAN CREATE a LIFETIME OF FREEDOM." },
        { t: "YOUR FUTURE IS BUILT BY WHAT YOU DO\nAFTER A LONG TIRING DAY." },
        { t: "SPEAK CLEARLY.\nSTAND STRAIGHT.\nFEAR NONE."},
        { t: "ITS WHAT'S INSIDE THAT MATTERS." },
        { t: "WEAK MEN WAIT FOR COURAGE.\n STRONG MEN CREATE IT THROUGH ACTION."},
        { t: "BE THE MAN WHO ACTS WHILE OTHERS ARE STILL THINKING."},
        { t: "BE SO DISCIPLINED THAT EVEN YOUR BAD DAYS LOOK LIKE PROGRESS."},
        { t: "A STRONG MAN DOESN’T NEED MOTIVATION.\nHE ACTS BECAUSE HE DECIDED."},
        { t: "PRESSURE REVEALS THE MAN WITHIN."}
    ];

    const display = document.getElementById('g4x_txt');
    const hintArea = document.getElementById('hint');
    const infoDisplay = document.getElementById('live_info');
    const mainContent = document.getElementById('main_content');
    const notification = document.getElementById('notification');
    
    let firstInteraction = true;
    let quotePool = [];
    let liveInterval = null;
    let autoplayActive = false;
    let autoplayInterval = null;
    let pressTimer = null;
    let longPressed = false;
    const AUTOPLAY_DURATION = 5000; 

    function getLiveStats() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        const timeStr = `${hours}:${minutes} ${ampm}`;
        const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
        const diff = endOfDay - now;
        const minsLeft = Math.floor(diff / 1000 / 60);
        return { time: timeStr, left: minsLeft };
    }

    function refreshPool() {
        const lastQuoteText = display.innerText;
        quotePool = [...quotes].sort(() => Math.random() - 0.5);
        if (quotePool.length > 1 && quotePool[quotePool.length - 1].t === lastQuoteText) {
             const sameOne = quotePool.pop();
             quotePool.unshift(sameOne);
        }
    }

    function showNotification(text) {
        notification.innerText = text;
        notification.classList.add('show');
        setTimeout(() => {
            notification.classList.remove('show');
        }, 1800);
    }

    function updateDisplay() {
        if (quotePool.length === 0) {
            refreshPool();
        }

        const nextQuote = quotePool.pop();
        display.style.opacity = '0';
        infoDisplay.classList.add('opacity-0');
        
        if (firstInteraction) {
            hintArea.classList.add('hidden-hint');
        }
        
        if (liveInterval) {
            clearInterval(liveInterval);
            liveInterval = null;
        }

        setTimeout(() => {
            display.innerText = nextQuote.t;
            display.style.opacity = '1';
            firstInteraction = false;

            if (nextQuote.id === "time_quote") {
                const updateUI = () => {
                    const stats = getLiveStats();
                    infoDisplay.innerHTML = `TIME: ${stats.time} • ${stats.left} MINUTES REMAINING`;
                };
                updateUI();
                infoDisplay.classList.remove('opacity-0');
                liveInterval = setInterval(updateUI, 30000);
            } else {
                infoDisplay.innerHTML = "";
                infoDisplay.classList.add('opacity-0');
            }
        }, 300);
    }

    function toggleAutoplay() {
        autoplayActive = !autoplayActive;
        if (autoplayActive) {
            showNotification("Autoplay On");
            if (autoplayInterval) clearInterval(autoplayInterval);
            autoplayInterval = setInterval(updateDisplay, AUTOPLAY_DURATION);
        } else {
            showNotification("Autoplay Off");
            if (autoplayInterval) clearInterval(autoplayInterval);
        }
    }

    function startPressTimer() {
        longPressed = false;
        pressTimer = setTimeout(() => {
            longPressed = true;
            toggleAutoplay();
            pressTimer = null;
        }, 600); 
    }

    function endPressTimer() {
        if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
        }

        if (!longPressed && !autoplayActive) {
            updateDisplay();
        }
        longPressed = false;
    }

    window.onload = () => {
        refreshPool();
        const initial = quotePool.pop();
        display.innerText = initial.t;
        
        if (initial.id === "time_quote") {
            const stats = getLiveStats();
            infoDisplay.innerHTML = `TIME: ${stats.time} • ${stats.left} MINUTES REMAINING`;
            infoDisplay.classList.remove('opacity-0');
        }

        requestAnimationFrame(() => {
            mainContent.classList.add('visible');
            hintArea.classList.add('visible');
            setTimeout(() => {
                if (firstInteraction) {
                    hintArea.classList.remove('opacity-0');
                }
            }, 1000);
        });
    };

    document.addEventListener('mousedown', (e) => { if (e.button === 0) startPressTimer(); });
    document.addEventListener('mouseup', endPressTimer);
    document.addEventListener('touchstart', startPressTimer, { passive: true });
    document.addEventListener('touchend', endPressTimer, { passive: true });

})();
</script>
</body>
</html>
