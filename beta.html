<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#000000">
<title>Salman Faris | Daily Wisdom</title>
<link rel="icon" type="image/png" href="favicon.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P37159WTH1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-P37159WTH1');
</script>

<meta name="description" content="Build strong discipline. Keep your word. Do not waste time. Stay honest. Live with purpose.">
<meta name="author" content="Salman Faris">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config={
  theme:{
    extend:{
      fontFamily:{
        f1:['Inter','sans-serif'],
        f2:['Inter','sans-serif']
      },
      colors:{c1:'#000000',c2:'#C5A059',eye:'#B8B8B0'}
    }
  }
}
</script>
<style>
html { 
  background-color: #000000; 
  scroll-behavior: smooth; 
  overscroll-behavior-y: contain; 
}

body { 
  margin: 0; 
  color: #d1d1d1; 
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-smoothing: antialiased; 
  min-height: 100vh;
  overflow-x: hidden; 
  -webkit-overflow-scrolling: touch; 
  overscroll-behavior-y: contain;
}

/* Custom class to force straight rendering for hyphens */
.st-hyphen {
  font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
  font-weight: 400 !important;
  display: inline-block;
  transform: scaleX(1.05);
  vertical-align: baseline;
}

.z0{transition:background-color .4s,backdrop-filter .4s,border-color .4s}
.z0.zs{background-color:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.z1{opacity:0;transform:translateY(40px);filter:blur(15px);transition:all 1.8s cubic-bezier(.16,1,.3,1)}
.z1.za{opacity:1;transform:none;filter:blur(0)}

.zi{text-indent:12rem}
@media(max-width:768px){.zi{text-indent:0}}

.zs1{font-size:11px;letter-spacing:.8em;text-transform:uppercase;font-family:Inter,sans-serif;opacity:0.4;color:#fff;font-weight:600}
.zb{color:#C5A059;opacity:0.9;text-shadow:0 0 30px rgba(197,160,89,0.3)}
.zd{color:#C5A059;text-shadow:0 0 15px rgba(197,160,89,0.5)}
@keyframes flash{0%,100%{opacity:0.1}50%{opacity:0.7}}
.zf{animation:flash 2s ease-in-out infinite}
#sd{transition:opacity 0.5s ease,visibility 0.5s}

.hi{transition:color 0.6s ease,text-shadow 0.6s ease,opacity 0.6s ease;opacity:0.2;color:#B8B8B0;display:inline-block}
.hi.active{opacity:1 !important;color:#fff !important;text-shadow:0 0 20px rgba(255,255,255,0.5) !important}

.quote-container { width: 100%; max-width: 90vw; margin: 0 auto; text-align: center; }
.quote-line { font-family: 'Inter', sans-serif; font-size: clamp(12px, 3.8vw, 17px); font-weight: 400; line-height: 1.5; color: #ffffff; opacity: 0.9; margin: 0; }
.quote-stats { 
  font-family: 'Inter', sans-serif; 
  font-size: clamp(10px, 3vw, 14px); 
  color: #ffffff; 
  opacity: 0.5; 
  margin-top: 10px; 
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  -webkit-font-feature-settings: "tnum";
}

.quote-wrapper { padding-top: 100px; padding-bottom: 60px; }
footer { padding-top: 10px; padding-bottom: 40px; position: relative; }
</style>
</head>
<body oncontextmenu="return false;">

<nav id="n0" class="z0 fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center border-b border-transparent">
  <div id="d0" class="zd text-[10px] uppercase tracking-[0.4em] font-f2 font-medium">MONDAY</div>
  <div id="t0" class="text-[10px] uppercase tracking-[0.4em] text-white/80 font-f2 font-medium">LOADING...</div>
</nav>

<main class="relative w-full">
  <section class="h-screen flex flex-col items-center justify-center px-6 relative z-10">
    <div class="text-center flex-grow flex flex-col justify-center items-center">
      <!-- Reverted topic heading font size back to original -->
      <h1 id="h0" class="font-f1 font-bold text-6xl sm:text-8xl md:text-[11rem] lg:text-[14rem] tracking-tight leading-tight md:leading-none z1 text-white" style="transition-delay:0.2s"></h1>
    </div>
    <div id="sd" class="pb-40 md:pb-24 z1" style="transition-delay:0.8s">
      <div class="zs1 zf">Scroll Down</div>
    </div>
  </section>

  <article id="m0" class="max-w-screen-2xl mx-auto px-6 pt-40 pb-20 relative z-10 space-y-72"></article>

  <section class="relative z-10">
    <div class="z1 text-center px-6 quote-wrapper">
        <div class="quote-container">
            <p class="quote-line">You only have 1,440 minutes every day,</p>
            <p class="quote-line">do not let a single one go to waste.</p>
            <p id="live-stats" class="quote-stats"></p>
        </div>
    </div>
  </section>
</main>

<footer class="w-full flex justify-center px-6 relative z-10 z1">
  <div class="text-[9px] uppercase tracking-[0.8em] font-f2 text-white font-medium opacity-30">BY SALMAN FARIS</div>
</footer>

<script>
(function(){
  const dailyThemes = [
    {
      theme: 'Be Relentless',
      paragraphs: [
        "Stop asking for an easy life. Hard work separates strong people from weak people. Face your daily struggles and never back down.",
        "Discipline means doing the work even when you are tired. Anyone can work when they feel like it. Real strength shows when you push through pain.",
        "Demand the best from yourself today. Stay calm, stay quiet, and keep moving forward. Victory always goes to the person who refuses to quit."
      ]
    },
    {
      theme: 'Zero Excuses',
      paragraphs: [
        "Your body wants to rest, but rest builds nothing. Stop making excuses and do what you need to do. Attack your tasks right now.",
        "Nobody is coming to save you. Nobody cares about your problems. Own your life, stop complaining, and get the job done.",
        "Real character is built when no one is watching. Rise early, work hard in silence, and let your results speak for you."
      ]
    },
    {
      theme: 'Hard Truths',
      paragraphs: [
        "The world only respects hard work, not big talk. Big dreams without daily action are just lies you tell yourself. Let your actions prove who you are.",
        "Time is slipping away every single second. You do not have forever. Stop wasting hours on useless things and start making real progress today.",
        "Do not fear hard work or hard times. Fear wasted days and empty promises. Stand tall, protect your family, and crush your goals."
      ]
    },
    {
      theme: 'Stay Focused',
      paragraphs: [
        "Shut off the noise. Put away your phone and stop looking for cheap fun. Guard your focus because your future depends on it.",
        "Do not try to do ten things at once. Pick your main goal, focus 100% of your power on it, and master it step by step.",
        "Learn to enjoy quiet, hard work. Say no to foolish distractions today so you can win big tomorrow."
      ]
    },
    {
      theme: 'Never Give Up',
      paragraphs: [
        "Quitting is not an option. If you hit a rock a hundred times and it does not break, the next hit will shatter it. Keep hitting.",
        "Pain is temporary, but regret lasts forever. Suffer today through hard work so you can stand proud for the rest of your life.",
        "Win the battle inside your own mind first. Face every problem with courage, keep your head up, and finish what you started."
      ]
    },
    {
      theme: 'Take Action',
      paragraphs: [
        "Thinking too much breeds fear. Doing the work kills fear immediately. Do not overthink—just step forward and start working.",
        "Where you are today comes from what you did yesterday. Where you will be tomorrow depends on what you do right now. Act today.",
        "Talk is cheap and words mean nothing. Put your head down, work harder than everyone else, and let your success speak."
      ]
    },
    {
      theme: 'Live Everyday',
      paragraphs: [
        "Attack today like it is your only chance. Give 100% of your energy to this moment right now. Leave nothing undone.",
        "Tomorrow is never promised to anyone. Waking up today is a blessing. Do not waste this gift on anger or lazy habits.",
        "When you go to sleep tonight, make sure you gave your absolute best. Sleep with peace knowing you worked as hard as you could."
      ]
    },
    {
      theme: 'Believe In Yourself',
      paragraphs: [
        "You have strong power inside you. Kill self-doubt before it ruins your mind. You are built to handle hard things.",
        "Your mind grows strong when you feed it good things. Stop thinking weak thoughts. Learn hard skills and improve every day.",
        "Walk with calm confidence. Step out of your comfortable zone, because strength only grows when things get tough."
      ]
    },
    {
      theme: 'Do Not Waste Time',
      paragraphs: [
        "Time is your most valuable gift. Once a minute is gone, no money in the world can buy it back. Treat every hour like gold.",
        "Cut out bad habits that waste your life. Mindless scrolling keeps you weak and lazy. Use your quiet time to build your body and mind.",
        "Plan your day with clear goals. Wake up early, finish your work, and live with strong discipline."
      ]
    },
    {
      theme: 'Build Your Mind',
      paragraphs: [
        "Your mind is your best weapon. Train it every day with hard work, good books, and strong control over your emotions.",
        "Keep your mind clean from rumors, fights, and useless entertainment. What you pay attention to shapes your life.",
        "Control your anger before it controls you. Anyone can get angry, but remaining calm under pressure is true power."
      ]
    },
    {
      theme: 'Strong Character',
      paragraphs: [
        "Who you really are shows up when life gets tough. Being nice when everything is easy is simple; standing honest in a storm is real strength.",
        "Always tell the truth and keep your word. When people know your word is iron, you earn real respect that lasts.",
        "Walk with quiet power. You do not need to shout or brag; let your solid work and good character show your value."
      ]
    },
    {
      theme: 'Quiet Strength',
      paragraphs: [
        "Real power is quiet and simple. Listen more than you speak. Silence gives you time to think clearly and make smart moves.",
        "Build your skills in secret without asking for praise from others. Work quietly in the dark and let your results shine in the light.",
        "Stay peaceful when everything around you is crazy. Take a deep breath, stay calm, and make wise choices."
      ]
    },
    {
      theme: 'Do Your Duty',
      paragraphs: [
        "Duty means doing what is right even when you feel tired or lazy. Honor is built by doing your job no matter how you feel.",
        "Feelings change every hour, but duty stays forever. Rise above your moods and complete your daily work with honesty.",
        "There is deep satisfaction in a job well done. When you take care of your responsibilities, you build an unshakeable life."
      ]
    },
    {
      theme: 'Master Yourself',
      paragraphs: [
        "Before you try to change the world, learn to control yourself. Master your body, control your speech, and build strong daily habits.",
        "Say no to quick fun for long-term power and health. Controlling your own desires is the highest level of freedom.",
        "Take total responsibility for your life path. When you control your own actions, nobody can hold you back."
      ]
    },
    {
      theme: 'Embrace Pain',
      paragraphs: [
        "Hard times are not your enemy; they are your teacher. Struggling burns away weakness and makes your heart strong.",
        "Do not run away from hard tasks. Jump straight into the work, because real strength only comes from heavy resistance.",
        "When you learn to bear hard work with patience, small troubles will never hurt you again. You become unbreakable."
      ]
    },
    {
      theme: 'Clear Goals',
      paragraphs: [
        "A life without clear goals is like walking in the dark. Know what you want, focus your mind on it, and go get it.",
        "Write down your goals and break them into small daily steps. Finish one simple task at a time with full focus.",
        "Keep your eyes fixed on your main goal. Ignore the distractions around you and keep walking forward every day."
      ]
    },
    {
      theme: 'Continuous Growth',
      paragraphs: [
        "Never allow yourself to stay lazy. Staying in one place is dying slowly. Make your mind, body, and character better every day.",
        "Learn new skills, read good wisdom, and keep your body healthy. Staying active brings real energy into your life.",
        "Compare yourself only to who you were yesterday. As long as you get 1% better every day, you are winning."
      ]
    },
    {
      theme: 'Unshakable Peace',
      paragraphs: [
        "Build a calm heart that outside problems cannot break. You cannot control the world, but you can control your own reaction.",
        "Do not waste your mental power on small arguments. Save your strength for what really matters in life.",
        "Find peace in hard work, clean living, and honest goals. When your heart is clean, true rest comes naturally."
      ]
    },
    {
      theme: 'Be The Example',
      paragraphs: [
        "Be a strong pillar of help and truth for your family and friends. Lead through hard work rather than long speeches.",
        "Set high standards for your health, work, and discipline. Show everyone what a reliable human being looks like.",
        "When people see your steady effort and honesty, they will feel inspired to do good too. Make your family proud."
      ]
    },
    {
      theme: 'Overcome Fear',
      paragraphs: [
        "Fear is just a thought in your mind. Step directly toward what scares you, and watch the fear disappear.",
        "Courage does not mean zero fear. Courage means doing what is right even when you feel nervous. Take action now.",
        "Every time you face a fear with patience, you gain new strength. Step out of your comfort zone and grow."
      ]
    },
    {
      theme: 'Be Grateful',
      paragraphs: [
        "Be deeply thankful for your health, your breath, and a new morning. Many people did not wake up today. Use this gift.",
        "Being thankful gives you clarity. Stop complaining about what you do not have, and use what you have today to win.",
        "Start every morning with a thankful heart. Live honestly, work hard, and leave a good name behind you."
      ]
    }
  ];

  // Wrap sentence parts and ensure hyphens render completely straight
  const wrapWords = (text) => {
    return text.split(/\.\s*/).filter(s => s.trim().length > 0).map(sentence => {
      const cleanSentence = sentence.trim().replace(/-/g, '<span class="st-hyphen">-</span>');
      return `<span class="hi">${cleanSentence}.</span> `;
    }).join("");
  };

  const updateClockAndStats = () => {
    const now = new Date();
    
    // Top-left Day of the week
    const dayName = now.toLocaleDateString("en-US", { weekday: 'long' }).toUpperCase();
    document.getElementById("d0").textContent = dayName;

    // Top-right Date format
    document.getElementById("t0").textContent = `${now.toLocaleDateString("en-US",{month:"long"}).toUpperCase()} ${now.toLocaleDateString("en-US",{day:"2-digit"})} / ${now.getFullYear()}`;
    
    // Time with seconds for the bottom section
    const timeWithSeconds = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
    
    const totalMinutesInDay = 1440;
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const remainingMinutes = totalMinutesInDay - currentMinutes;
    const statsEl = document.getElementById('live-stats');
    if (statsEl) { statsEl.textContent = `Time: ${timeWithSeconds} • ${remainingMinutes} minutes remaining today`; }
  };

  const init = () => {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start + (start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000;
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    
    const currentTopic = dailyThemes[dayOfYear % dailyThemes.length];
    
    // Set clean heading
    document.getElementById("h0").textContent = currentTopic.theme;
    
    // Render content paragraphs with the larger text size
    document.getElementById("m0").innerHTML = `
      <div class="z1"><p class="font-f1 text-5xl sm:text-7xl md:text-8xl lg:text-[6.2rem] font-semibold leading-[1.2] tracking-tight zi">${wrapWords(currentTopic.paragraphs[0])}</p></div>
      <div class="z1"><p class="font-f1 text-5xl sm:text-7xl md:text-8xl lg:text-[6.2rem] font-semibold leading-[1.2] tracking-tight">${wrapWords(currentTopic.paragraphs[1])}</p></div>
      <div class="z1"><p class="font-f1 text-5xl sm:text-7xl md:text-8xl lg:text-[6.2rem] font-semibold leading-[1.2] tracking-tight zi">${wrapWords(currentTopic.paragraphs[2])}</p></div>
    `;
    updateClockAndStats();
    
    const generalObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("za"); });
    }, { threshold: 0.05 });
    document.querySelectorAll(".z1").forEach(el => generalObserver.observe(el));
  };

  window.addEventListener("scroll", () => {
    const s = window.scrollY;
    document.getElementById("n0").classList.toggle("zs", s > 10);
    if(document.getElementById("sd")) document.getElementById("sd").style.opacity = s > 20 ? "0" : "1";
    
    const spans = document.querySelectorAll(".hi");
    let active = null, min = Infinity;
    spans.forEach(span => {
      const dist = Math.abs((span.getBoundingClientRect().top + span.getBoundingClientRect().height / 2) - (window.innerHeight * 0.5));
      if (dist < min) { min = dist; active = span; }
    });
    spans.forEach(span => { span === active && min < window.innerHeight * 0.4 ? span.classList.add("active") : span.classList.remove("active"); });
  }, { passive: true });

  window.onload = () => {
    init();
    setInterval(updateClockAndStats, 1000);
  };
})();
</script>
</body>
</html>
