<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kilometre Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --text-color: #000000;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            height: 100dvh; 
            margin: 0;
            padding: 0;
            transition: background-color 0.3s;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 1.5rem;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .stat-value {
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 0.85;
        }

        .btn-press:active { transform: scale(0.95); }

        .gps-status {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 999px;
            display: inline-block;
        }
        
        .gps-on { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .gps-off { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .gps-searching { background: rgba(234, 179, 8, 0.2); color: #eab308; }
        
        .hidden-action { display: none !important; }
        
        .swipe-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.3;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.1; }
            50% { opacity: 0.3; }
            100% { opacity: 0.1; }
        }
        
        .fullscreen-mode {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 0;
        }
        
        .normal-mode {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .tap-hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.2;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="normalView" class="normal-mode">
        <!-- GPS Status -->
        <div class="text-center mt-4">
            <span id="gpsStatus" class="gps-status gps-off">GPS: OFF</span>
        </div>

        <!-- Distance Display -->
        <div class="flex-grow flex flex-col items-center justify-center w-full text-center">
            <div class="w-full">
                <span class="text-[10px] font-black uppercase tracking-[0.4em] opacity-30 mb-2 block">Distance</span>
                <div class="flex items-baseline justify-center">
                    <span id="trip" class="text-[140px] stat-value">0.0</span>
                    <span class="text-xl font-black ml-2">KM</span>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="w-full pb-4">
            <div id="standardActions" class="w-full">
                <button id="startBtn" onclick="initiateStart()" class="w-full py-6 bg-accent font-black text-[12px] uppercase tracking-[0.3em] shadow-2xl btn-press rounded-full" style="background-color: var(--text-color); color: var(--bg-color);">
                    Start Trip
                </button>

                <div id="activeActions" class="w-full flex space-x-4 hidden-action mt-4">
                    <button id="pauseBtn" onclick="togglePause()" class="flex-1 py-6 font-black text-[11px] uppercase tracking-widest btn-press rounded-full" style="background: rgba(128, 128, 128, 0.1); border: 1px solid rgba(255,255,255,0.1);">
                        Pause
                    </button>
                    <button onclick="stopTracking()" class="flex-[1.5] py-6 bg-red-600 text-white font-black text-[11px] uppercase tracking-[0.3em] shadow-lg btn-press rounded-full">
                        Finish Trip
                    </button>
                </div>
            </div>
            
            <div class="swipe-indicator hidden-action" id="swipeUpHint">Swipe up for fullscreen</div>
        </div>
    </div>

    <div id="fullscreenView" class="fullscreen-mode hidden-action">
        <div class="text-center">
            <div class="flex items-baseline justify-center">
                <span id="tripFull" class="text-[180px] stat-value">0.0</span>
                <span class="text-2xl font-black ml-2">KM</span>
            </div>
            <div class="mt-8">
                <span id="gpsStatusFull" class="gps-status gps-off">GPS: OFF</span>
            </div>
        </div>
        <div class="tap-hint">Tap to exit fullscreen</div>
    </div>

    <script>
        let isTracking = false;
        let isPaused = false;
        let watchId = null;
        let tripDistance = 0;
        let lastCoords = null;
        let isGpsCalibrated = false;
        let lastUpdateTime = 0;
        let positionBuffer = [];
        let hasLocationPermission = false;
        let isFullscreen = false;
        const MIN_UPDATE_INTERVAL = 1000;
        const BUFFER_SIZE = 3;

        const startBtn = document.getElementById('startBtn');
        const activeActions = document.getElementById('activeActions');
        const normalView = document.getElementById('normalView');
        const fullscreenView = document.getElementById('fullscreenView');
        const tripDisplay = document.getElementById('trip');
        const tripDisplayFull = document.getElementById('tripFull');
        const gpsStatus = document.getElementById('gpsStatus');
        const gpsStatusFull = document.getElementById('gpsStatusFull');
        const swipeUpHint = document.getElementById('swipeUpHint');

        function updateGPSStatus(status, isActive = false) {
            gpsStatus.textContent = `GPS: ${status}`;
            gpsStatus.className = `gps-status ${isActive ? 'gps-on' : (status === 'SEARCHING' ? 'gps-searching' : 'gps-off')}`;
            
            gpsStatusFull.textContent = `GPS: ${status}`;
            gpsStatusFull.className = `gps-status ${isActive ? 'gps-on' : (status === 'SEARCHING' ? 'gps-searching' : 'gps-off')}`;
        }

        function updateDistanceDisplay() {
            const distance = tripDistance.toFixed(1);
            tripDisplay.textContent = distance;
            tripDisplayFull.textContent = distance;
        }

        // Check GPS support and start searching
        function checkAndStartGPS() {
            if (!("geolocation" in navigator)) {
                updateGPSStatus("NOT SUPPORTED");
                return;
            }
            
            updateGPSStatus("SEARCHING");
            
            // Try to get position to check permission and start GPS
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    hasLocationPermission = true;
                    updateGPSStatus("READY", true);
                    console.log("GPS is ready");
                },
                (error) => {
                    // Just keep searching silently
                    updateGPSStatus("SEARCHING");
                    console.log("GPS searching...");
                    
                    // Keep trying every 5 seconds
                    setTimeout(checkAndStartGPS, 5000);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function saveState() {
            const state = { isTracking, isPaused, tripDistance, lastCoords };
            localStorage.setItem('trip_tracker_state', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('trip_tracker_state');
            if (saved) {
                const state = JSON.parse(saved);
                isTracking = state.isTracking;
                isPaused = state.isPaused;
                tripDistance = state.tripDistance || 0;
                lastCoords = state.lastCoords;

                if (isTracking) {
                    isGpsCalibrated = true;
                    restoreTrackingUI();
                }
            }
        }

        function restoreTrackingUI() {
            startBtn.classList.add('hidden-action');
            activeActions.classList.remove('hidden-action');
            updateDistanceDisplay();
            if(isPaused) document.getElementById('pauseBtn').innerText = "Resume";
            startGPSService();
        }

        function initiateStart() {
            if (!hasLocationPermission) {
                alert("Please turn on location services on your phone first");
                return;
            }
            
            startBtn.innerText = "Starting...";
            startBtn.classList.add('opacity-50');
            isTracking = true;
            isPaused = false;
            tripDistance = 0;
            lastCoords = null;
            isGpsCalibrated = false;
            positionBuffer = [];
            lastUpdateTime = 0;
            saveState();
            
            setTimeout(() => { 
                restoreTrackingUI();
                startBtn.innerText = "Start Trip";
                startBtn.classList.remove('opacity-50');
                
                // Show swipe hint when tracking starts
                swipeUpHint.classList.remove('hidden-action');
            }, 500);
        }

        function stopTracking() {
            // Stop GPS immediately
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            // Reset all tracking variables
            isTracking = false;
            isPaused = false;
            lastCoords = null;
            isGpsCalibrated = false;
            positionBuffer = [];
            
            // Update UI
            startBtn.classList.remove('hidden-action', 'opacity-50');
            startBtn.innerText = "Start Trip";
            activeActions.classList.add('hidden-action');
            updateGPSStatus("READY", false);
            swipeUpHint.classList.add('hidden-action');
            
            // Display final distance and then reset
            updateDistanceDisplay();
            
            // Clear saved state
            localStorage.removeItem('trip_tracker_state');
            
            // Reset trip distance after a brief delay
            setTimeout(() => {
                if (!isTracking) {
                    tripDistance = 0;
                    updateDistanceDisplay();
                }
            }, 2000);
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').innerText = isPaused ? "Resume" : "Pause";
            updateGPSStatus(isPaused ? "PAUSED" : "TRACKING", !isPaused);
            saveState();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + 
                     Math.cos(lat1 * Math.PI/180) * 
                     Math.cos(lat2 * Math.PI/180) * 
                     Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function handlePositionUpdate(pos) {
            const currentTime = Date.now();
            const accuracy = pos.coords.accuracy || 50;
            
            if (!isTracking || isPaused) return;
            
            // Filter by time interval
            if (currentTime - lastUpdateTime < MIN_UPDATE_INTERVAL) {
                return;
            }
            
            // Filter by accuracy
            if (accuracy > 50) {
                return;
            }
            
            // Add position to buffer
            positionBuffer.push({
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                timestamp: currentTime,
                accuracy: accuracy
            });
            
            // Keep buffer size limited
            if (positionBuffer.length > BUFFER_SIZE) {
                positionBuffer.shift();
            }
            
            // Wait for buffer to fill initially
            if (!isGpsCalibrated) {
                if (positionBuffer.length >= BUFFER_SIZE) {
                    lastCoords = positionBuffer[0];
                    isGpsCalibrated = true;
                }
                return;
            }
            
            // Calculate distance from last valid position
            if (lastCoords && positionBuffer.length >= 2) {
                const newestPos = positionBuffer[positionBuffer.length - 1];
                
                const dist = calculateDistance(
                    lastCoords.latitude, 
                    lastCoords.longitude, 
                    newestPos.latitude, 
                    newestPos.longitude
                );
                
                // Minimum distance threshold to filter noise
                const minDist = 0.001;
                
                if (dist > minDist && accuracy < 30) {
                    tripDistance += dist;
                    updateDistanceDisplay();
                    lastCoords = newestPos;
                    lastUpdateTime = currentTime;
                    saveState();
                }
            } else if (positionBuffer.length >= BUFFER_SIZE) {
                lastCoords = positionBuffer[positionBuffer.length - 1];
            }
        }

        function startGPSService() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            
            updateGPSStatus("TRACKING", true);
            
            watchId = navigator.geolocation.watchPosition(
                handlePositionUpdate, 
                (err) => {
                    console.log("GPS error:", err.message);
                    updateGPSStatus("SEARCHING");
                }, 
                { 
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0,
                    distanceFilter: 5
                }
            );
        }

        // Toggle fullscreen mode
        function toggleFullscreen() {
            if (!isTracking) return; // Only allow fullscreen when tracking
            
            isFullscreen = !isFullscreen;
            
            if (isFullscreen) {
                normalView.classList.add('hidden-action');
                fullscreenView.classList.remove('hidden-action');
                document.documentElement.requestFullscreen().catch(()=>{});
            } else {
                fullscreenView.classList.add('hidden-action');
                normalView.classList.remove('hidden-action');
                document.exitFullscreen().catch(()=>{});
            }
        }

        // Initialize on load
        window.onload = () => { 
            loadState();
            
            // Start searching for GPS immediately
            checkAndStartGPS();
        };
        
        // Swipe up for fullscreen, swipe down to exit
        let startY = 0;
        document.addEventListener('touchstart', e => {
            startY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchend', e => {
            const endY = e.changedTouches[0].clientY;
            const diffY = startY - endY;
            
            // Swipe up for fullscreen (only when tracking)
            if (diffY > 100 && isTracking && !isFullscreen) {
                toggleFullscreen();
            }
            
            // Swipe down to exit fullscreen OR tap to exit
            if ((diffY < -50 || (isFullscreen && Math.abs(diffY) < 10)) && isFullscreen) {
                toggleFullscreen();
            }
        });
        
        // Also allow tap to exit fullscreen
        fullscreenView.addEventListener('click', () => {
            if (isFullscreen) {
                toggleFullscreen();
            }
        });
    </script>
</body>
</html>
