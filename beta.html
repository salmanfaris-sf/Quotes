<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kilometre Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --panel-bg: rgba(20, 20, 20, 0.8);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-color: #ffffff;
            --secondary-text: #71717a;
            --drawer-bg: #0a0a0a;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --text-color: #000000;
                --panel-bg: rgba(240, 240, 240, 0.9);
                --panel-border: rgba(0, 0, 0, 0.1);
                --accent-color: #000000;
                --drawer-bg: #ffffff;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
            transition: background-color 0.5s ease;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 1.5rem;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .premium-card {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 9999px;
        }

        .stat-value {
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 0.85;
        }

        .btn-press:active { transform: scale(0.95); }

        .circle-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(128, 128, 128, 0.1);
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        #historyDrawer {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--drawer-bg);
            z-index: 100;
            transition: top 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        #historyDrawer.open { top: 0; }

        .slider-track {
            width: 100%;
            height: 64px;
            background: rgba(128, 128, 128, 0.1);
            border: 1px solid var(--panel-border);
            border-radius: 40px;
            position: relative;
            overflow: hidden;
        }

        .slider-handle {
            width: 56px;
            height: 56px;
            background: var(--text-color);
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 10;
        }

        .slider-text {
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 64px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-color);
            opacity: 0.5;
            pointer-events: none;
        }

        .bg-accent { background-color: var(--text-color); color: var(--bg-color); }
        .hidden-action { display: none !important; }
        
        .accuracy-indicator {
            font-size: 10px;
            font-weight: 800;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        
        .accuracy-good { opacity: 0.6; }
        
        .gps-status {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 999px;
            margin-top: 4px;
            display: inline-block;
        }
        
        .gps-on { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .gps-off { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .gps-searching { background: rgba(234, 179, 8, 0.2); color: #eab308; }
        
        .retry-btn {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>

    <div id="historyDrawer">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black uppercase tracking-widest">History</h2>
            <button onclick="toggleHistory(false)" class="p-2 opacity-50 font-bold text-sm">CLOSE</button>
        </div>
        <div id="historyList" class="flex-grow overflow-y-auto space-y-2"></div>
        <div class="py-4 flex flex-col items-center">
             <div class="w-12 h-1 bg-white/20 rounded-full mb-4"></div>
             <button onclick="clearHistory()" class="text-[9px] font-black uppercase tracking-widest text-red-500 opacity-50 text-center w-full">Clear All Records</button>
        </div>
    </div>

    <div class="main-container">
        <!-- GPS Status -->
        <div class="flex justify-between items-start mb-4">
            <div class="text-left">
                <span class="text-[10px] font-black uppercase tracking-[0.4em] opacity-30 block">Kilometre Tracker</span>
                <div class="flex items-center space-x-2">
                    <span id="gpsStatus" class="gps-status gps-off">GPS: OFF</span>
                    <span id="gpsLoading" class="hidden-action text-[8px] font-bold opacity-50 loading-dots">Searching</span>
                </div>
            </div>
            <button onclick="forceRetryGPS()" class="text-[8px] font-black uppercase tracking-widest opacity-50">RETRY GPS</button>
        </div>

        <!-- Distance Display -->
        <div class="flex-grow flex flex-col items-center justify-center w-full text-center">
            <div class="w-full">
                <span class="text-[10px] font-black uppercase tracking-[0.4em] opacity-30 mb-2 block">Distance</span>
                <div class="flex items-baseline justify-center">
                    <span id="trip" class="text-[120px] stat-value">0.0</span>
                    <span class="text-xl font-black ml-2">KM</span>
                </div>
                <div id="accuracyDisplay" class="accuracy-indicator mt-4 hidden-action">
                    Accuracy: <span id="accuracyValue">0</span>m
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="w-full shrink-0">
            <div class="flex flex-col space-y-8 w-full">
                <div class="flex justify-center space-x-12 items-center" id="utilityRow">
                    <button onclick="toggleFS()" class="circle-btn opacity-60 hover:opacity-100 transition-opacity">
                        <svg id="fsIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    </button>
                    <button id="lockBtn" onclick="toggleLock(true)" class="circle-btn opacity-60 hover:opacity-100 transition-opacity">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </button>
                </div>

                <div class="w-full relative min-h-[72px] pb-6">
                    <div id="standardActions" class="w-full">
                        <button id="startBtn" onclick="initiateStart()" class="w-full py-6 bg-accent font-black text-[12px] uppercase tracking-[0.3em] shadow-2xl btn-press rounded-full">
                            Start Trip
                        </button>

                        <div id="activeActions" class="w-full flex space-x-4 hidden-action">
                            <button id="pauseBtn" onclick="togglePause()" class="flex-1 py-6 premium-card font-black text-[11px] uppercase tracking-widest btn-press">
                                Pause
                            </button>
                            <button onclick="stopTracking()" class="flex-[1.5] py-6 bg-red-600 text-white font-black text-[11px] uppercase tracking-[0.3em] shadow-lg btn-press rounded-full">
                                Finish Trip
                            </button>
                        </div>
                    </div>

                    <div id="lockAction" class="w-full hidden-action">
                        <div class="slider-track" id="sliderTrack">
                            <div class="slider-text">Swipe to unlock</div>
                            <div class="slider-handle" id="sliderHandle">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isTracking = false;
        let isPaused = false;
        let isLocked = false;
        let watchId = null;
        let tripDistance = 0;
        let lastCoords = null;
        let wakeLock = null;
        let isHistoryOpen = false;
        let isGpsCalibrated = false;
        let lastUpdateTime = 0;
        let positionBuffer = [];
        let hasLocationPermission = false;
        let isLocationEnabled = false;
        let gpsRetryCount = 0;
        const MAX_RETRIES = 3;
        const MIN_UPDATE_INTERVAL = 1000;
        const BUFFER_SIZE = 3;

        const startBtn = document.getElementById('startBtn');
        const activeActions = document.getElementById('activeActions');
        const standardActions = document.getElementById('standardActions');
        const lockAction = document.getElementById('lockAction');
        const utilityRow = document.getElementById('utilityRow');
        const accuracyDisplay = document.getElementById('accuracyDisplay');
        const accuracyValue = document.getElementById('accuracyValue');
        const gpsStatus = document.getElementById('gpsStatus');
        const gpsLoading = document.getElementById('gpsLoading');

        function updateGPSStatus(status, isActive = false) {
            gpsStatus.textContent = `GPS: ${status}`;
            gpsStatus.className = `gps-status ${isActive ? 'gps-on' : (status === 'SEARCHING' ? 'gps-searching' : 'gps-off')}`;
            
            if (status === 'SEARCHING') {
                gpsLoading.classList.remove('hidden-action');
            } else {
                gpsLoading.classList.add('hidden-action');
            }
        }

        function forceRetryGPS() {
            gpsRetryCount = 0;
            requestLocationPermission();
        }

        // Check if geolocation is available
        function checkGeolocationSupport() {
            if (!("geolocation" in navigator)) {
                alert("Geolocation is not supported by your browser. Please use Chrome, Safari, or Firefox.");
                return false;
            }
            return true;
        }

        // Request location permission with better error handling
        async function requestLocationPermission() {
            if (!checkGeolocationSupport()) return false;
            
            updateGPSStatus('SEARCHING');
            
            // Clear any existing watch
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            try {
                // Use modern permission API if available
                if (navigator.permissions && navigator.permissions.query) {
                    const permissionStatus = await navigator.permissions.query({ name: 'geolocation' });
                    
                    permissionStatus.onchange = () => {
                        hasLocationPermission = permissionStatus.state === 'granted';
                        updateGPSStatus(hasLocationPermission ? 'READY' : 'DENIED', hasLocationPermission);
                        
                        if (hasLocationPermission) {
                            testGPSConnection();
                        }
                    };
                    
                    hasLocationPermission = permissionStatus.state === 'granted';
                    
                    if (hasLocationPermission) {
                        testGPSConnection();
                        return true;
                    }
                } else {
                    // Fallback for browsers without Permission API - just try to get location
                    testGPSConnection();
                }
                
            } catch (error) {
                console.error("Permission check failed:", error);
                // Fallback to direct test
                testGPSConnection();
            }
            
            return false;
        }

        // Get position with timeout
        function getPositionWithTimeout(timeout) {
            return new Promise((resolve, reject) => {
                const timer = setTimeout(() => {
                    reject(new Error('GPS timeout'));
                }, timeout);
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        clearTimeout(timer);
                        resolve(position);
                    },
                    (error) => {
                        clearTimeout(timer);
                        reject(error);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: timeout - 1000, // Slightly less than our timer
                        maximumAge: 0
                    }
                );
            });
        }

        // Test GPS connection with better error messages
        function testGPSConnection() {
            if (!checkGeolocationSupport()) return;
            
            updateGPSStatus('SEARCHING');
            
            // Use shorter timeout for initial test
            getPositionWithTimeout(15000)
                .then((position) => {
                    isLocationEnabled = true;
                    hasLocationPermission = true;
                    updateGPSStatus('READY', true);
                    
                    // Pre-warm GPS for better performance
                    if (!isTracking) {
                        startGPSService(false); // Test mode
                        setTimeout(() => {
                            if (watchId && !isTracking) {
                                navigator.geolocation.clearWatch(watchId);
                                watchId = null;
                            }
                        }, 3000);
                    }
                })
                .catch((error) => {
                    isLocationEnabled = false;
                    updateGPSStatus('ERROR');
                    
                    // More helpful error messages
                    let errorMsg = "GPS Error: ";
                    switch(error.code || error.message) {
                        case 1:
                        case 'PERMISSION_DENIED':
                            errorMsg += "Location permission denied. Please enable location in browser settings.";
                            break;
                        case 2:
                        case 'POSITION_UNAVAILABLE':
                            errorMsg += "No GPS signal. Please go outdoors or near a window.";
                            break;
                        case 3:
                        case 'TIMEOUT':
                            errorMsg += "GPS timeout. Try:\n• Going outside\n• Disabling battery saver\n• Waiting 30 seconds";
                            if (gpsRetryCount < MAX_RETRIES) {
                                setTimeout(() => {
                                    gpsRetryCount++;
                                    testGPSConnection();
                                }, 2000);
                            }
                            break;
                        default:
                            errorMsg += "Unknown error. Please check location settings.";
                    }
                    
                    console.log(errorMsg);
                });
        }

        function saveState() {
            const state = { isTracking, isPaused, tripDistance, lastCoords };
            localStorage.setItem('trip_tracker_state', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('trip_tracker_state');
            if (saved) {
                const state = JSON.parse(saved);
                isTracking = state.isTracking;
                isPaused = state.isPaused;
                tripDistance = state.tripDistance || 0;
                lastCoords = state.lastCoords;

                if (isTracking) {
                    isGpsCalibrated = true;
                    restoreTrackingUI();
                }
            }
        }

        function restoreTrackingUI() {
            startBtn.classList.add('hidden-action');
            activeActions.classList.remove('hidden-action');
            document.getElementById('trip').innerText = tripDistance.toFixed(1);
            if(isPaused) document.getElementById('pauseBtn').innerText = "Resume";
            
            if (hasLocationPermission) {
                startGPSService();
                requestWakeLock();
            } else {
                requestLocationPermission();
            }
        }

        function initiateStart() {
            if (!hasLocationPermission) {
                requestLocationPermission();
                return;
            }
            
            if (!isLocationEnabled) {
                testGPSConnection();
                alert("Please wait for GPS signal before starting trip.");
                return;
            }
            
            startBtn.innerText = "Starting...";
            startBtn.classList.add('opacity-50');
            isTracking = true;
            isPaused = false;
            tripDistance = 0;
            lastCoords = null;
            isGpsCalibrated = false;
            positionBuffer = [];
            lastUpdateTime = 0;
            saveState();
            
            setTimeout(() => { 
                restoreTrackingUI();
                startBtn.innerText = "Start Trip";
                startBtn.classList.remove('opacity-50');
            }, 1000);
        }

        function stopTracking() {
            // Stop GPS immediately first
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            // Save the trip
            saveTrip();
            
            // Reset all tracking variables
            isTracking = false;
            isPaused = false;
            lastCoords = null;
            isGpsCalibrated = false;
            positionBuffer = [];
            
            // Update UI
            toggleLock(false);
            startBtn.classList.remove('hidden-action', 'opacity-50');
            startBtn.innerText = "Start Trip";
            activeActions.classList.add('hidden-action');
            accuracyDisplay.classList.add('hidden-action');
            updateGPSStatus('READY', false);
            
            // Display final distance and then reset
            const finalDistance = tripDistance;
            document.getElementById('trip').innerText = finalDistance.toFixed(1);
            
            // Release wake lock
            if (wakeLock) { 
                wakeLock.release(); 
                wakeLock = null; 
            }
            
            // Clear saved state
            localStorage.removeItem('trip_tracker_state');
            
            // Reset trip distance after a brief delay
            setTimeout(() => {
                if (!isTracking) {
                    tripDistance = 0;
                    document.getElementById('trip').innerText = "0.0";
                }
            }, 2000);
        }

        async function toggleFS() {
            if (!document.fullscreenElement) await document.documentElement.requestFullscreen().catch(()=>{});
            else await document.exitFullscreen().catch(()=>{});
        }

        function toggleLock(locked) {
            isLocked = locked;
            standardActions.classList.toggle('hidden-action', locked);
            utilityRow.classList.toggle('opacity-0', locked);
            utilityRow.classList.toggle('pointer-events-none', locked);
            lockAction.classList.toggle('hidden-action', !locked);
        }

        const handle = document.getElementById('sliderHandle');
        const track = document.getElementById('sliderTrack');
        let isDragging = false;
        let startX = 0;

        handle.addEventListener('touchstart', e => { 
            isDragging = true; 
            startX = e.touches[0].clientX; 
            handle.style.transition = 'none';
        });
        
        window.addEventListener('touchmove', e => {
            if (!isDragging) return;
            let delta = Math.max(0, Math.min(e.touches[0].clientX - startX, track.offsetWidth - handle.offsetWidth - 8));
            handle.style.transform = `translateX(${delta}px)`;
            if (delta >= track.offsetWidth - handle.offsetWidth - 8) {
                isDragging = false;
                toggleLock(false);
                handle.style.transform = `translateX(0px)`;
            }
        });
        
        window.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            handle.style.transition = 'transform 0.3s ease';
            handle.style.transform = `translateX(0px)`;
            setTimeout(() => handle.style.transition = '', 300);
        });

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + 
                     Math.cos(lat1 * Math.PI/180) * 
                     Math.cos(lat2 * Math.PI/180) * 
                     Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function updateAccuracyDisplay(accuracy) {
            if (accuracy < 0) return;
            
            accuracyDisplay.classList.remove('hidden-action');
            accuracyValue.textContent = Math.round(accuracy);
            
            if (accuracy < 15) {
                accuracyDisplay.classList.add('accuracy-good');
            } else {
                accuracyDisplay.classList.remove('accuracy-good');
            }
        }

        function handlePositionUpdate(pos) {
            const currentTime = Date.now();
            const accuracy = pos.coords.accuracy || 50;
            const speedKmh = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
            
            // Update accuracy display
            updateAccuracyDisplay(accuracy);
            
            if (!isTracking || isPaused) return;
            
            // Filter by time interval to prevent rapid updates
            if (currentTime - lastUpdateTime < MIN_UPDATE_INTERVAL) {
                return;
            }
            
            // Filter by accuracy
            if (accuracy > 50) {
                return;
            }
            
            // Add position to buffer
            positionBuffer.push({
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                timestamp: currentTime,
                accuracy: accuracy
            });
            
            // Keep buffer size limited
            if (positionBuffer.length > BUFFER_SIZE) {
                positionBuffer.shift();
            }
            
            // Wait for buffer to fill initially
            if (!isGpsCalibrated) {
                if (positionBuffer.length >= BUFFER_SIZE) {
                    lastCoords = positionBuffer[0];
                    isGpsCalibrated = true;
                }
                return;
            }
            
            // Calculate distance from last valid position
            if (lastCoords && positionBuffer.length >= 2) {
                const newestPos = positionBuffer[positionBuffer.length - 1];
                
                const dist = calculateDistance(
                    lastCoords.latitude, 
                    lastCoords.longitude, 
                    newestPos.latitude, 
                    newestPos.longitude
                );
                
                // Minimum distance threshold to filter noise
                const minDist = 0.001;
                
                if (dist > minDist && accuracy < 30) {
                    tripDistance += dist;
                    document.getElementById('trip').innerText = tripDistance.toFixed(1);
                    lastCoords = newestPos;
                    lastUpdateTime = currentTime;
                    saveState();
                }
            } else if (positionBuffer.length >= BUFFER_SIZE) {
                lastCoords = positionBuffer[positionBuffer.length - 1];
            }
        }

        function startGPSService(tracking = true) {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            
            watchId = navigator.geolocation.watchPosition(
                handlePositionUpdate, 
                (err) => {
                    console.log("GPS error:", err.message);
                    accuracyDisplay.classList.add('hidden-action');
                    updateGPSStatus('ERROR');
                    
                    // Try to recover
                    if (isTracking && gpsRetryCount < 3) {
                        setTimeout(() => {
                            gpsRetryCount++;
                            startGPSService(tracking);
                        }, 2000);
                    }
                }, 
                { 
                    enableHighAccuracy: true,
                    timeout: 15000, // Increased timeout
                    maximumAge: 0,
                    distanceFilter: tracking ? 5 : 0
                }
            );
            
            if (tracking) {
                updateGPSStatus('TRACKING', true);
            }
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator && !wakeLock) {
                try { 
                    wakeLock = await navigator.wakeLock.request('screen'); 
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                    });
                } catch(e) {
                    console.log("Wake Lock error:", e);
                }
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').innerText = isPaused ? "Resume" : "Pause";
            
            if (isPaused) {
                accuracyDisplay.classList.add('hidden-action');
                updateGPSStatus('PAUSED', false);
            } else {
                accuracyDisplay.classList.remove('hidden-action');
                updateGPSStatus('TRACKING', true);
            }
            
            saveState();
        }

        function saveTrip() {
            if (tripDistance < 0.05) return;
            
            const h = JSON.parse(localStorage.getItem('activa_history') || '[]');
            h.unshift({ 
                name: 'Trip ' + (h.length + 1), 
                dist: tripDistance.toFixed(1), 
                date: new Date().toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }),
                timestamp: Date.now()
            });
            
            localStorage.setItem('activa_history', JSON.stringify(h.slice(0, 100)));
        }

        function toggleHistory(open) {
            const d = document.getElementById('historyDrawer');
            isHistoryOpen = open;
            
            if (open) {
                const h = JSON.parse(localStorage.getItem('activa_history') || '[]');
                const list = document.getElementById('historyList');
                list.innerHTML = h.length ? h.map(item => `
                    <div class="flex justify-between items-center py-4 border-b border-black/5">
                        <div>
                            <div class="text-[8px] font-black uppercase tracking-widest opacity-30">${item.date}</div>
                            <div class="font-bold">${item.name}</div>
                        </div>
                        <div class="text-right"><span class="text-xl font-black">${item.dist}</span><span class="text-[8px] ml-1 opacity-40">KM</span></div>
                    </div>
                `).join('') : '<p class="text-center opacity-30 mt-10 text-[10px] font-bold">NO HISTORY</p>';
                d.classList.add('open');
            } else {
                d.classList.remove('open');
            }
        }

        function clearHistory() { 
            localStorage.removeItem('activa_history'); 
            toggleHistory(true); 
        }

        // Handle visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && wakeLock) {
                wakeLock.release();
                wakeLock = null;
            } else if (!document.hidden && isTracking && !wakeLock) {
                requestWakeLock();
            }
        });

        // Initialize on load
        window.onload = () => { 
            // Check geolocation support
            if (!checkGeolocationSupport()) {
                alert("This browser doesn't support GPS tracking. Please use Chrome, Safari, or Firefox.");
                return;
            }
            
            loadState(); 
            
            // Request location permission immediately
            setTimeout(() => {
                requestLocationPermission();
            }, 1000);
        };
        
        let tY = 0;
        document.addEventListener('touchstart', e => tY = e.touches[0].clientY);
        document.addEventListener('touchend', e => {
            const diffY = tY - e.changedTouches[0].clientY;
            if (diffY < -80 && !isLocked && !isHistoryOpen) toggleHistory(true);
            else if (diffY > 80 && isHistoryOpen) toggleHistory(false);
        });
    </script>
</body>
</html>
