<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Trip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --panel-bg: rgba(20, 20, 20, 0.8);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-color: #ffffff;
            --secondary-text: #71717a;
            --drawer-bg: #0a0a0a;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --text-color: #000000;
                --panel-bg: rgba(244, 244, 245, 0.9);
                --panel-border: rgba(0, 0, 0, 0.05);
                --accent-color: #000000;
                --secondary-text: #a1a1aa;
                --drawer-bg: #ffffff;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
            transition: background-color 0.5s ease;
            height: 100vh;
            height: -webkit-fill-available; 
        }

        html {
            height: -webkit-fill-available;
        }

        .premium-card {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 9999px;
        }

        .stat-value {
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 0.85;
        }

        .btn-press {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease, opacity 0.3s ease;
            border-radius: 9999px;
        }

        .btn-press:active {
            transform: scale(0.95);
        }

        .tracking-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
            50% { opacity: 0.4; transform: scale(1.2); box-shadow: 0 0 25px rgba(16, 185, 129, 0.8); }
        }

        #historyDrawer {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--drawer-bg);
            z-index: 50;
            transition: top 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        #historyDrawer.open {
            top: 0;
        }

        .history-item {
            border-bottom: 1px solid var(--panel-border);
            padding: 1rem 0;
        }

        #tripName::placeholder {
            color: var(--secondary-text);
            opacity: 0.4;
        }

        .bg-accent { background-color: var(--text-color); color: var(--bg-color); }
        
        .hidden-action { display: none !important; }

        @media (max-height: 700px) {
            #trip { font-size: 90px; }
            .premium-card { padding: 0.75rem !important; }
            body { padding: 1rem !important; }
        }
    </style>
</head>
<body class="flex flex-col p-6 overflow-hidden" id="mainBody">

    <!-- History Drawer -->
    <div id="historyDrawer">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black uppercase tracking-widest">History</h2>
            <button onclick="toggleHistory(false)" class="p-2 opacity-50 font-bold text-sm">CLOSE</button>
        </div>
        <div id="historyList" class="flex-grow overflow-y-auto space-y-2">
            <p class="text-center opacity-30 mt-10 font-bold uppercase tracking-widest text-[10px]">No saved trips yet</p>
        </div>
        <button onclick="clearHistory()" class="mt-4 text-[9px] font-black uppercase tracking-widest text-red-500 opacity-50 text-center w-full">Clear All Records</button>
    </div>

    <!-- Top Bar -->
    <div class="flex justify-between items-start mb-2">
        <div class="flex flex-col">
            <div id="clock" class="text-3xl font-extrabold tracking-tighter">--:--</div>
            <div id="ampm" class="text-[10px] font-bold uppercase tracking-[0.2em] opacity-40 ml-1">--</div>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-[9px] font-black uppercase tracking-widest opacity-30">Battery</span>
            <span id="batteryText" class="text-xl font-bold tracking-tight">--%</span>
        </div>
    </div>

    <!-- Main Distance Display -->
    <div class="flex-grow flex flex-col items-center justify-center py-2" id="swipeZone">
        <div class="text-center w-full pointer-events-none">
            <span class="text-[10px] font-black uppercase tracking-[0.4em] opacity-30 mb-2 block">Distance</span>
            <div class="flex items-baseline justify-center">
                <span id="trip" class="text-[110px] stat-value">0.0</span>
                <span class="text-xl font-black ml-2">KM</span>
            </div>
        </div>
        <input type="text" id="tripName" placeholder="Trip Name" 
                class="bg-transparent text-center text-[11px] font-bold uppercase tracking-widest py-1 focus:outline-none w-full max-w-[180px] border-b border-transparent focus:border-white/20 transition-all mt-2 pointer-events-auto">
    </div>

    <!-- Stats Section -->
    <div class="mb-6">
        <div class="premium-card p-4 flex flex-col items-center justify-center border-white/5">
            <span class="text-[8px] font-black uppercase tracking-widest opacity-30 mb-1">Duration</span>
            <span id="tripTime" class="text-3xl font-bold tracking-tight">00:00:00</span>
        </div>
    </div>

    <!-- Controls Area -->
    <div class="flex flex-col space-y-4">
        <div class="w-full flex">
            <!-- Start State -->
            <button id="startBtn" onclick="toggleTracking()" class="w-full py-4 bg-accent font-black text-[11px] uppercase tracking-[0.2em] shadow-lg btn-press">
                Start Trip
            </button>

            <!-- Active State -->
            <div id="activeActions" class="w-full flex space-x-3 hidden-action">
                <button id="pauseBtn" onclick="togglePause()" class="flex-1 py-4 premium-card btn-press font-black text-[10px] uppercase tracking-widest">
                    Pause
                </button>
                <button onclick="toggleTracking()" class="flex-[1.5] py-4 bg-red-600 text-white font-black text-[10px] uppercase tracking-[0.2em] shadow-lg btn-press">
                    Finish Trip
                </button>
            </div>
        </div>
        
        <div id="statusContainer" class="flex items-center justify-center space-x-2 opacity-100 transition-opacity duration-500 pb-2 h-4">
            <div class="tracking-dot" id="dotElement" style="display: none;"></div>
            <p id="status" class="text-[9px] font-bold uppercase tracking-widest opacity-40"></p>
        </div>
    </div>

    <script>
        let isTracking = false;
        let isPaused = false;
        let watchId = null;
        let tripDistance = 0;
        let lastCoords = null;
        let startTime = null;
        let pausedTimeTotal = 0;
        let pauseStartTime = null;
        let timerInterval = null;
        let wakeLock = null;

        const startBtn = document.getElementById('startBtn');
        const activeActions = document.getElementById('activeActions');
        const pauseBtn = document.getElementById('pauseBtn');
        const statusText = document.getElementById('status');
        const dotElement = document.getElementById('dotElement');

        // Gesture Control: Swipe Up for Fullscreen, Swipe Down for History/Exit Fullscreen
        let touchStartY = 0;
        document.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY);
        document.addEventListener('touchend', e => {
            const touchEndY = e.changedTouches[0].clientY;
            const deltaY = touchStartY - touchEndY;

            if (Math.abs(deltaY) > 80) {
                if (deltaY > 80) {
                    // Swipe Up
                    if (!document.fullscreenElement) enterFullscreen();
                } else {
                    // Swipe Down
                    if (document.fullscreenElement) {
                        exitFullscreen();
                    } else {
                        toggleHistory(true);
                    }
                }
            }
        });

        async function enterFullscreen() {
            try {
                const elem = document.documentElement;
                if (elem.requestFullscreen) await elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) await elem.webkitRequestFullscreen();
            } catch (err) {}
        }

        async function exitFullscreen() {
            try {
                if (document.exitFullscreen) await document.exitFullscreen();
                else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
            } catch (err) {}
        }

        function toggleHistory(open) {
            const drawer = document.getElementById('historyDrawer');
            if (open) {
                renderHistory();
                drawer.classList.add('open');
            } else {
                drawer.classList.remove('open');
            }
        }

        function saveTrip() {
            if (tripDistance < 0.01) return;
            const history = JSON.parse(localStorage.getItem('activa_history') || '[]');
            const newTrip = {
                name: document.getElementById('tripName').value || 'Trip ' + (history.length + 1),
                dist: tripDistance.toFixed(1),
                time: document.getElementById('tripTime').innerText,
                date: new Date().toLocaleDateString()
            };
            history.unshift(newTrip);
            localStorage.setItem('activa_history', JSON.stringify(history.slice(0, 50)));
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('activa_history') || '[]');
            if (history.length === 0) {
                list.innerHTML = '<p class="text-center opacity-30 mt-10 font-bold uppercase tracking-widest text-[10px]">No saved trips yet</p>';
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="history-item flex justify-between items-center">
                    <div>
                        <div class="text-[9px] font-black uppercase tracking-widest opacity-30">${item.date}</div>
                        <div class="font-bold text-base">${item.name}</div>
                        <div class="text-[9px] opacity-50 uppercase font-bold tracking-tighter">${item.time}</div>
                    </div>
                    <div class="text-right">
                        <span class="text-xl font-black">${item.dist}</span>
                        <span class="text-[9px] font-bold opacity-30 ml-1">KM</span>
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            localStorage.removeItem('activa_history');
            renderHistory();
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; 
            document.getElementById('clock').innerText = `${String(hours).padStart(2, '0')}:${minutes}`;
            document.getElementById('ampm').innerText = ampm;
        }

        async function initBattery() {
            try {
                if ('getBattery' in navigator) {
                    const battery = await navigator.getBattery();
                    const updateUI = () => document.getElementById('batteryText').innerText = Math.round(battery.level * 100) + '%';
                    battery.addEventListener('levelchange', updateUI);
                    updateUI();
                } else { document.getElementById('batteryText').innerText = "100%"; }
            } catch (e) { document.getElementById('batteryText').innerText = "100%"; }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function handlePositionUpdate(position) {
            if (!isTracking || isPaused) return;
            statusText.innerText = "";
            statusText.classList.remove('text-red-500');
            dotElement.style.display = "block";

            const speedKMH = (position.coords.speed || 0) * 3.6;
            if (lastCoords) {
                const dist = calculateDistance(lastCoords.latitude, lastCoords.longitude, position.coords.latitude, position.coords.longitude);
                if (speedKMH > 1.2 || dist > 0.003) { 
                    tripDistance += dist;
                    document.getElementById('trip').innerText = tripDistance.toFixed(1);
                }
            }
            lastCoords = { latitude: position.coords.latitude, longitude: position.coords.longitude };
        }

        function handleGPSError(err) {
            dotElement.style.display = "none";
            statusText.classList.add('text-red-500');
            if (err.code === 1) statusText.innerText = "Location Permission Denied";
            else if (err.code === 2 || err.code === 3) statusText.innerText = "GPS Signal Lost";
        }

        async function toggleTracking() {
            if (!isTracking) {
                if ("geolocation" in navigator) {
                    watchId = navigator.geolocation.watchPosition(handlePositionUpdate, handleGPSError, { 
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    });
                    isTracking = true;
                    isPaused = false;
                    startTime = Date.now();
                    pausedTimeTotal = 0;
                    startTimer();
                    startBtn.classList.add('hidden-action');
                    activeActions.classList.remove('hidden-action');
                    dotElement.style.display = "block";
                    requestWakeLock();
                } else {
                    statusText.innerText = "GPS not supported";
                }
            } else {
                saveTrip();
                if (watchId) navigator.geolocation.clearWatch(watchId);
                isTracking = false;
                stopTimer();
                startBtn.classList.remove('hidden-action');
                activeActions.classList.add('hidden-action');
                dotElement.style.display = "none";
                statusText.innerText = "";
                tripDistance = 0;
                lastCoords = null;
                document.getElementById('trip').innerText = "0.0";
                document.getElementById('tripTime').innerText = "00:00:00";
                document.getElementById('tripName').value = "";
                releaseWakeLock();
            }
        }

        function togglePause() {
            if (!isTracking) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseStartTime = Date.now();
                pauseBtn.innerText = "Resume";
                statusText.innerText = "Paused";
                dotElement.style.animation = "none";
                dotElement.style.background = "#fbbf24";
            } else {
                pausedTimeTotal += (Date.now() - pauseStartTime);
                pauseBtn.innerText = "Pause";
                statusText.innerText = "";
                dotElement.style.animation = "pulse 2s infinite ease-in-out";
                dotElement.style.background = "#10b981";
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (isPaused) return;
                const currentElapsed = Date.now() - startTime - pausedTimeTotal;
                const hours = Math.floor(currentElapsed / 3600000);
                const minutes = Math.floor((currentElapsed % 3600000) / 60000);
                const seconds = Math.floor((currentElapsed % 60000) / 1000);
                document.getElementById('tripTime').innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }

        function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }

        window.onload = () => {
            updateClock();
            setInterval(updateClock, 1000);
            initBattery();
        };

        document.addEventListener('visibilitychange', () => {
            if (isTracking && !isPaused && document.visibilityState === 'visible') requestWakeLock();
        });
    </script>
</body>
</html>
