<!DOCTYPE html>
<html lang="en" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Big Clock</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-variant-numeric: tabular-nums; /* Prevents text layout shifting as seconds tick */
            user-select: none;
            -webkit-user-select: none;
        }

        /* Smooth fade out for controls on idle */
        .controls-layer {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .idle-hidden {
            opacity: 0 !important;
            cursor: none;
        }

        /* Gentle glow effect for text */
        .clock-text {
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="h-full bg-black text-slate-100 flex flex-col justify-between items-center overflow-hidden p-6 sm:p-10 select-none">

    <!-- Top Status Bar -->
    <header class="w-full max-w-7xl flex items-center justify-between text-xs sm:text-sm text-neutral-500 font-medium tracking-wider uppercase z-10">
        <div id="location-tz" class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="tz-name">LOCAL TIME</span>
        </div>
        <div id="day-of-year" class="hidden sm:block">
            DAY <span id="doy-val">--</span> OF 365
        </div>
    </header>

    <!-- Center Clock Main Display -->
    <main class="flex-1 flex flex-col items-center justify-center w-full my-auto z-10">
        <div class="text-center space-y-2 sm:space-y-4">
            
            <!-- Main Time Output -->
            <div className="relative">
                <h1 id="time-display" class="clock-text font-bold text-[18vw] leading-none tracking-tight text-white font-sans transition-all duration-300">
                    00:00:<span class="text-neutral-400 font-normal">00</span>
                </h1>
            </div>

            <!-- Date Display -->
            <p id="date-display" class="text-xl sm:text-3xl lg:text-4xl font-normal text-neutral-400 tracking-wide pt-2 sm:pt-4">
                Monday, January 1
            </p>
        </div>
    </main>

    <!-- Bottom Floating Control Bar -->
    <footer id="controls-bar" class="controls-layer z-20 w-full max-w-md bg-neutral-900/80 backdrop-blur-md border border-neutral-800/80 rounded-2xl p-2 sm:p-2.5 flex items-center justify-around shadow-2xl transition-opacity">
        
        <!-- 12H / 24H Toggle Button -->
        <button id="toggle-format" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-neutral-800 hover:bg-neutral-700 text-neutral-200 transition active:scale-95 flex items-center gap-1.5" title="Toggle 12/24 hour format">
            <i data-lucide="clock" class="w-4 h-4 text-indigo-400"></i>
            <span id="format-label">24H</span>
        </button>

        <!-- Flash Separator Toggle -->
        <button id="toggle-seconds" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium hover:bg-neutral-800 text-neutral-400 hover:text-neutral-200 transition active:scale-95 flex items-center gap-1.5" title="Toggle Seconds Visibility">
            <i data-lucide="eye" class="w-4 h-4 text-emerald-400"></i>
            <span id="seconds-label">Seconds</span>
        </button>

        <!-- Brightness / Minimalist Dimmer -->
        <button id="toggle-dim" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium hover:bg-neutral-800 text-neutral-400 hover:text-neutral-200 transition active:scale-95 flex items-center gap-1.5" title="Dim Mode">
            <i data-lucide="moon" class="w-4 h-4 text-amber-400"></i>
            <span>Dim</span>
        </button>

        <!-- Fullscreen Button -->
        <button id="toggle-fullscreen" class="p-2 sm:p-2.5 rounded-xl hover:bg-neutral-800 text-neutral-400 hover:text-neutral-200 transition active:scale-95" title="Toggle Fullscreen">
            <i data-lucide="maximize" class="w-4 h-4"></i>
        </button>
    </footer>

    <script>
        // State Variables
        let is24Hour = false;
        let showSeconds = true;
        let isDimmed = false;
        let idleTimer = null;

        // DOM Elements
        const timeDisplay = document.getElementById('time-display');
        const dateDisplay = document.getElementById('date-display');
        const tzName = document.getElementById('tz-name');
        const doyVal = document.getElementById('doy-val');
        const controlsBar = document.getElementById('controls-bar');
        const formatLabel = document.getElementById('format-label');
        const secondsLabel = document.getElementById('seconds-label');

        // Initialize Lucide Icons
        lucide.createIcons();

        function updateClock() {
            const now = new Date();

            // Time Formatting
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            let ampm = '';

            if (!is24Hour) {
                ampm = hours >= 12 ? ' PM' : ' AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // hour '0' should be '12'
            }
            
            const hoursStr = String(hours).padStart(2, '0');

            // Construct HTML string
            let timeHTML = `${hoursStr}:${minutes}`;
            if (showSeconds) {
                timeHTML += `<span class="text-neutral-500 font-normal opacity-90">:${seconds}</span>`;
            }
            if (!is24Hour) {
                timeHTML += `<span class="text-xs sm:text-2xl font-semibold text-neutral-500 ml-2 uppercase">${ampm}</span>`;
            }

            timeDisplay.innerHTML = timeHTML;

            // Date Formatting
            const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
            dateDisplay.textContent = now.toLocaleDateString('en-US', options);

            // Day of Year calculation
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            doyVal.textContent = dayOfYear;
        }

        // Format Toggle
        document.getElementById('toggle-format').addEventListener('click', () => {
            is24Hour = !is24Hour;
            formatLabel.textContent = is24Hour ? '24H' : '12H';
            updateClock();
        });

        // Seconds Toggle
        document.getElementById('toggle-seconds').addEventListener('click', () => {
            showSeconds = !showSeconds;
            secondsLabel.classList.toggle('line-through', !showSeconds);
            updateClock();
        });

        // Dim Mode Toggle
        document.getElementById('toggle-dim').addEventListener('click', () => {
            isDimmed = !isDimmed;
            if (isDimmed) {
                timeDisplay.classList.add('opacity-30');
                dateDisplay.classList.add('opacity-20');
            } else {
                timeDisplay.classList.remove('opacity-30');
                dateDisplay.classList.remove('opacity-20');
            }
        });

        // Fullscreen Toggle
        document.getElementById('toggle-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        function resetIdleTimer() {
            controlsBar.classList.remove('idle-hidden');
            document.body.classList.remove('idle-hidden');
            clearTimeout(idleTimer);

            idleTimer = setTimeout(() => {
                controlsBar.classList.add('idle-hidden');
                document.body.classList.add('idle-hidden');
            }, 4000); // Hide controls after 4s of inactivity
        }

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('touchstart', resetIdleTimer);
        window.addEventListener('keydown', resetIdleTimer);

        // Detect Timezone Name
        try {
            tzName.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone.replace('_', ' ');
        } catch (e) {
            tzName.textContent = 'LOCAL TIME';
        }

        // Start Clock Loop
        updateClock();
        setInterval(updateClock, 1000);
        resetIdleTimer();
    </script>
</body>
</html>
